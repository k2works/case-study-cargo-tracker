server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ポータルは /docs-portal/ 配下に置く。フロントエンドの nginx がこの
    # パスのまま中継するので、アプリと同じオリジンで開ける。オリジンを
    # 分けると、ポータルからアプリへのリンクが別ポートになり、転送を
    # 張り忘れたときに「リンクが切れている」ように見える。
    location = /docs-portal {
        return 301 /docs-portal/;
    }

    location /docs-portal/ {
        try_files $uri $uri/ /docs-portal/index.html;
    }

    # 生死の判定。index.html は中身が壊れていても 200 を返すので使わない。
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
