{{define "title"}}航海スケジュール登録 - Cargo Tracker{{end}}
{{define "content"}}
<h1 data-testid="page-title">航海スケジュール登録</h1>
<form method="post" action="/voyages" data-testid="voyage-form">
  <div class="field">
    <label for="voyageNumber">航海番号</label>
    <input id="voyageNumber" type="text" name="voyageNumber" placeholder="V0001" required data-testid="voyage-number">
  </div>
  <div class="field">
    <label for="vesselName">船名</label>
    <input id="vesselName" type="text" name="vesselName" required data-testid="vessel-name">
  </div>
  <div class="field">
    <label for="carrier">運送会社</label>
    <input id="carrier" type="text" name="carrier" required data-testid="carrier">
  </div>
  <fieldset data-testid="cargo-types">
    <legend>対応貨物種別</legend>
    <label><input type="checkbox" name="supportedCargoTypes" value="GENERAL" data-testid="ct-general" checked> 一般</label>
    <label><input type="checkbox" name="supportedCargoTypes" value="HAZARDOUS" data-testid="ct-hazardous"> 危険物</label>
    <label><input type="checkbox" name="supportedCargoTypes" value="REFRIGERATED" data-testid="ct-refrigerated"> 冷凍・冷蔵</label>
  </fieldset>
  <fieldset data-testid="movements">
    <legend>運送区間（順序どおり・前区間の到着地が次区間の出発地。区間 1 は必須、以降は「区間を追加」で寄港を追加）</legend>
    <div id="movement-list">
      <div class="field movement-row" data-testid="movement-row">
        <label>区間1 出発港 <input type="text" name="departure" maxlength="5" minlength="5" placeholder="JPTYO" required data-testid="dep-1"></label>
        <label>到着港 <input type="text" name="arrival" maxlength="5" minlength="5" placeholder="SGSIN" required data-testid="arr-1"></label>
        <label>出発日 <input type="date" name="departureDate" required data-testid="depdate-1"></label>
        <label>到着日 <input type="date" name="arrivalDate" required data-testid="arrdate-1"></label>
      </div>
      <div class="field movement-row" data-testid="movement-row">
        <label>区間2 出発港 <input type="text" name="departure" maxlength="5" placeholder="SGSIN" data-testid="dep-2"></label>
        <label>到着港 <input type="text" name="arrival" maxlength="5" placeholder="USLAX" data-testid="arr-2"></label>
        <label>出発日 <input type="date" name="departureDate" data-testid="depdate-2"></label>
        <label>到着日 <input type="date" name="arrivalDate" data-testid="arrdate-2"></label>
      </div>
    </div>
    <button type="button" id="add-movement" data-testid="add-movement">区間を追加</button>
  </fieldset>
  <button type="submit" data-testid="submit">登録</button>
</form>

<template id="movement-template">
  <div class="field movement-row" data-testid="movement-row">
    <label>出発港 <input type="text" name="departure" maxlength="5"></label>
    <label>到着港 <input type="text" name="arrival" maxlength="5"></label>
    <label>出発日 <input type="date" name="departureDate"></label>
    <label>到着日 <input type="date" name="arrivalDate"></label>
  </div>
</template>
<script>
  (function () {
    var btn = document.getElementById('add-movement');
    var list = document.getElementById('movement-list');
    var tpl = document.getElementById('movement-template');
    if (btn && list && tpl) {
      btn.addEventListener('click', function () {
        list.appendChild(tpl.content.cloneNode(true));
      });
    }
  })();
</script>
{{end}}
