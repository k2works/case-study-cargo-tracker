{{define "title"}}貨物予約登録 - Cargo Tracker{{end}}
{{define "content"}}
<h1 data-testid="page-title">貨物予約登録</h1>
<form method="post" action="/bookings" data-testid="booking-form">
  <div class="field">
    <label for="shipperCode">荷主コード（荷主 ID）</label>
    <input id="shipperCode" type="text" name="shipperCode" placeholder="SHP-XXXXXXXX" required data-testid="shipper-code">
  </div>
  <div class="field">
    <label for="cargoType">貨物種別</label>
    <select id="cargoType" name="cargoType" data-testid="cargo-type" onchange="toggleSpecialCargo(this.value)">
      <option value="GENERAL">一般貨物</option>
      <option value="HAZARDOUS">危険物</option>
      <option value="REFRIGERATED">冷凍・冷蔵</option>
    </select>
  </div>
  <fieldset id="hazardous-fields" data-testid="hazardous-fields" hidden>
    <legend>危険物申告</legend>
    <div class="field">
      <label for="hazardClass">危険物クラス</label>
      <input id="hazardClass" type="text" name="hazardClass" data-testid="hazard-class">
    </div>
    <div class="field">
      <label for="unNumber">UN 番号</label>
      <input id="unNumber" type="text" name="unNumber" placeholder="UN1203" data-testid="un-number">
    </div>
    <div class="field">
      <label for="properShippingName">正式輸送品名</label>
      <input id="properShippingName" type="text" name="properShippingName" data-testid="proper-shipping-name">
    </div>
  </fieldset>
  <fieldset id="refrigerated-fields" data-testid="refrigerated-fields" hidden>
    <legend>温度管理条件</legend>
    <div class="field">
      <label for="minTemperature">最低温度</label>
      <input id="minTemperature" type="number" step="0.1" name="minTemperature" data-testid="min-temperature">
    </div>
    <div class="field">
      <label for="maxTemperature">最高温度</label>
      <input id="maxTemperature" type="number" step="0.1" name="maxTemperature" data-testid="max-temperature">
    </div>
    <div class="field">
      <label for="temperatureUnit">温度単位</label>
      <select id="temperatureUnit" name="temperatureUnit" data-testid="temperature-unit">
        <option value="CELSIUS">摂氏（℃）</option>
        <option value="FAHRENHEIT">華氏（℉）</option>
      </select>
    </div>
  </fieldset>
  <div class="field">
    <label for="weightKg">重量（kg）</label>
    <input id="weightKg" type="number" name="weightKg" min="0.001" step="0.001" required data-testid="weight">
  </div>
  <div class="field">
    <label for="originUnLocode">出発地（UN/LOCODE）</label>
    <input id="originUnLocode" type="text" name="originUnLocode" maxlength="5" minlength="5" placeholder="JPTYO" required data-testid="origin">
  </div>
  <div class="field">
    <label for="destUnLocode">目的地（UN/LOCODE）</label>
    <input id="destUnLocode" type="text" name="destUnLocode" maxlength="5" minlength="5" placeholder="DEHAM" required data-testid="destination">
  </div>
  <div class="field">
    <label for="arrivalDeadline">希望着日</label>
    <input id="arrivalDeadline" type="date" name="arrivalDeadline" data-testid="arrival-deadline">
  </div>
  <button type="submit" data-testid="submit">登録</button>
</form>
<script>
  function toggleSpecialCargo(value) {
    var haz = document.getElementById('hazardous-fields');
    var ref = document.getElementById('refrigerated-fields');
    haz.hidden = value !== 'HAZARDOUS';
    ref.hidden = value !== 'REFRIGERATED';
  }
  toggleSpecialCargo(document.getElementById('cargoType').value);
</script>
{{end}}
