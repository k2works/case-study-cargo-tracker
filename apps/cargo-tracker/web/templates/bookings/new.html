{{define "title"}}貨物予約登録 - Cargo Tracker{{end}}
{{define "content"}}
<h1 data-testid="page-title">貨物予約登録</h1>
<form method="post" action="/bookings" data-testid="booking-form">
  <div class="field">
    <label>荷主コード（荷主 ID）</label>
    <input type="text" name="shipperCode" placeholder="SHP-XXXXXXXX" required data-testid="shipper-code">
  </div>
  <div class="field">
    <label>貨物種別</label>
    <select name="cargoType" data-testid="cargo-type">
      <option value="GENERAL">一般貨物</option>
      <option value="HAZARDOUS">危険物</option>
      <option value="REFRIGERATED">冷凍・冷蔵</option>
    </select>
  </div>
  <div class="field">
    <label>重量（kg）</label>
    <input type="number" name="weightKg" min="0.001" step="0.001" required data-testid="weight">
  </div>
  <div class="field">
    <label>出発地（UN/LOCODE）</label>
    <input type="text" name="originUnLocode" maxlength="5" minlength="5" placeholder="JPTYO" required data-testid="origin">
  </div>
  <div class="field">
    <label>目的地（UN/LOCODE）</label>
    <input type="text" name="destUnLocode" maxlength="5" minlength="5" placeholder="DEHAM" required data-testid="destination">
  </div>
  <div class="field">
    <label>希望着日</label>
    <input type="date" name="arrivalDeadline" data-testid="arrival-deadline">
  </div>
  <button type="submit" data-testid="submit">登録</button>
</form>
{{end}}
