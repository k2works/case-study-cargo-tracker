plugins {
    id 'java'
    id 'checkstyle'
    id 'jacoco'
    id 'com.github.spotbugs' version '6.4.6'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
    // コードから設計ドキュメントを生成する（docs/design と実装の乖離を検出する手段）
    id 'org.dddjava.jig-gradle-plugin' version '2026.7.4'
}

group = 'com.example'
version = '0.1.0-SNAPSHOT'
description = '国際貨物輸送管理システム'

// バージョンの正典は docs/design/tech_stack.md（ADR-001: Java 25 LTS）
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

// 依存のロック。**脆弱性スキャン（Trivy）が実際に依存を見るために必要である。**
// ロックファイルが無いと、Trivy は Gradle の依存を解決できず 0 件で緑になる。
// 「緑だが何も検査していない」状態は、スキャンが無いより危険である。
//
// 更新は ./gradlew dependencies --write-locks で行う。
dependencyLocking {
    lockAllConfigurations()
}

ext {
    mybatisStarterVersion = '4.0.1'
    postgresqlVersion = '42.7.12'
    springdocVersion = '3.0.2'
    archunitVersion = '1.4.1'
    jigErdVersion = '0.2.2'
    testcontainersVersion = '1.20.4'
    bootstrapVersion = '5.3.3'
    htmxVersion = '2.0.4'
    webjarsLocatorVersion = '1.0.1'
}

// 脆弱性スキャン（Trivy）が HIGH / CRITICAL を指摘した依存を、修正版に固定する。
//
// **BOM に任せきりにすると、修正版が公開されても Boot が取り込むまで脆弱性が残る。**
// io.spring.dependency-management の管理版は resolutionStrategy.force より強いため、
// プラグイン自身の機構（dependencyManagement.dependencies）で上書きする。
//
// **Boot が追いついたらこの上書きは削除すること。** 残すと今度は古い方に固定してしまう。
// 各行の件数は「なぜ上げたか」の記録であり、削除の判断材料になる。
dependencyManagement {
    dependencies {
        dependency 'org.apache.tomcat.embed:tomcat-embed-core:11.0.22'   // HIGH 6 件
        dependency 'com.fasterxml.jackson.core:jackson-core:2.21.4'      // HIGH 1 件
        dependency 'com.fasterxml.jackson.core:jackson-databind:2.21.4'  // HIGH 2 件
        dependency 'tools.jackson.core:jackson-core:3.1.4'               // HIGH 2 件
        dependency 'tools.jackson.core:jackson-databind:3.1.4'           // HIGH 2 件
        dependency 'org.springframework:spring-expression:7.0.8'         // HIGH 1 件（SpEL）
        dependency 'org.springframework:spring-webmvc:7.0.8'             // HIGH 2 件
        dependency 'org.postgresql:postgresql:42.7.12'                   // HIGH 2 件
    }
}

dependencies {
    // --- Web / テンプレート ---
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // --- セキュリティ（RBAC 8 ロール。non_functional.md §4.1 が正典）---
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

    // --- 永続化（ADR-004: MyBatis を採用し JPA は採用しない）---
    implementation "org.mybatis.spring.boot:mybatis-spring-boot-starter:${mybatisStarterVersion}"
    // Spring Boot 4 では自動構成がモジュール分割されている。
    // spring-boot-flyway が無いと FlywayAutoConfiguration が有効にならず、
    // 依存だけ入れてもマイグレーションが「静かに実行されない」。
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // ADR-003: ローカル起動の高速化のみに使う。
    // developmentOnly にしているのは、本番の成果物（bootJar）に H2 を含めないため。
    // 含まれていると、設定ミスで本番が H2 に接続しうる。
    developmentOnly 'com.h2database:h2'
    // **テストでも H2 を使う。** ただし SQL の正しさを検証するためではない（ADR-003）。
    // PostgreSQL でしか解釈できない SQL を書くと、Testcontainers のテストは緑のまま
    // ローカル起動でだけ画面が落ちる。その方言差を CI で捕まえるためだけに使う
    // （H2DialectSmokeTest）。テスト依存であり本番の成果物には入らない
    testRuntimeOnly 'com.h2database:h2'

    // 自動再起動と LiveReload。ローカルで「直して確かめる」間隔を短くするために使う。
    // developmentOnly のため bootJar には含まれない。
    // **本番の成果物に入れてはならない**（再起動の仕組みとクラスローダの分離は
    // 本番では不要であり、リスクにしかならない）。
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // SpotBugs に不変であることを伝えるための注釈（@Immutable）。
    // 実行時には不要なため compileOnly とする。
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    // 開発環境（Heroku）のイメージは bootJar を H2 で起動するため、
    // そのビルドに限り H2 を実行時依存に含める。
    //   ./gradlew bootJar -PincludeH2=true
    // 既定では含めない。**安全側を既定にし、必要な場合だけ明示的に opt-in する。**
    if (project.hasProperty('includeH2')) {
        runtimeOnly 'com.h2database:h2'
    }

    // --- 運用 ---
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    // --- フロントエンド資産（WebJars）---
    implementation "org.webjars:bootstrap:${bootstrapVersion}"
    implementation "org.webjars.npm:htmx.org:${htmxVersion}"
    implementation "org.webjars:webjars-locator-lite:${webjarsLocatorVersion}"

    // --- テスト ---
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // Spring Boot 4 は自動構成がモジュール分割されている。
    // @AutoConfigureMockMvc は spring-boot-webmvc-test にあり、
    // spring-boot-starter-test には含まれない。
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation "org.mybatis.spring.boot:mybatis-spring-boot-starter-test:${mybatisStarterVersion}"

    // ADR-003: SQL の正しさを検証する Repository / Mapper のテストは実 PostgreSQL で行う。
    // H2 で Repository テストを書かないこと。方言差が本番障害として現れる。
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
    testImplementation "org.testcontainers:postgresql:${testcontainersVersion}"

    // アーキテクチャテスト（test_strategy.md §3.3 の 6 ルール）
    testImplementation "com.tngtech.archunit:archunit-junit5:${archunitVersion}"

    // 実 DB のスキーマから ER 図を生成する（data-model.md との乖離検出）
    testImplementation "com.github.irof:jig-erd:${jigErdVersion}"

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// --- JIG（コードからの設計ドキュメント生成）---
// docs/design は「こう設計した」、JIG の出力は「こう実装されている」を示す。
// 両者を突き合わせることで、設計と実装の乖離を目視ではなく生成物で検出する。
jig {
    // BC ごとの構造を見たいので、全パッケージを対象にする
    modelPattern = '.+'
    outputDirectory = layout.buildDirectory.dir('jig').get().asFile.toString()
}

// --- jig-erd（DB スキーマからの ER 図生成）---
// Testcontainers 上に Flyway で構築したスキーマから ER 図を出力する。
// data-model.md の ER 図は設計、jig-erd の出力は実際のスキーマである。
tasks.register('jigErd', Test) {
    group = 'documentation'
    description = 'Flyway で構築したスキーマから ER 図を生成する（Docker と Graphviz が必要）'
    // Test タスクを register する場合、クラスパスは明示的に設定しないと NO-SOURCE になる
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'com.example.cargotracker.SchemaErdDocument'
    }
    systemProperty 'jig.erd.enabled', 'true'
    outputs.upToDateWhen { false }
}

// 通常のテスト実行では ER 図生成をスキップする（Graphviz と Docker に依存するため）
tasks.named('test') {
    filter {
        excludeTestsMatching 'com.example.cargotracker.SchemaErdDocument'
    }
}

// SonarQube の解析に渡す依存 jar を 1 箇所へ集める。
// **ライブラリを渡さないと型解決に失敗し、Java の解析が静かに縮退する。**
// 「指摘 0 件」がそのまま緑になり、何も検査していない状態に気づけない。
tasks.register('sonarLibs', Copy) {
    group = 'verification'
    description = 'SonarQube 解析用に依存 jar を build/tmp/sonar-libs へ集める'
    from configurations.testRuntimeClasspath
    into layout.buildDirectory.dir('tmp/sonar-libs')
    include '*.jar'
}

// --- コード品質 ---
// 基準値の正典は docs/design/test_strategy.md §6。ここに値を書き写さず参照する。

checkstyle {
    toolVersion = '10.21.1'
    configFile = file('config/checkstyle/checkstyle.xml')
    // 違反は 0 件が目標（test_strategy.md §6.2）。警告で見逃さずビルドを落とす。
    maxWarnings = 0
    ignoreFailures = false
}

spotbugs {
    toolVersion = '4.9.6'
    effort = com.github.spotbugs.snom.Effort.valueOf('MAX')
    reportLevel = com.github.spotbugs.snom.Confidence.valueOf('LOW')
    excludeFilter = file('config/spotbugs/exclude.xml')
    ignoreFailures = false
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        html.required = true
        xml.required = true
    }
}

jacoco {
    toolVersion = '0.8.13'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        html.required = true
        xml.required = true   // SonarQube 連携に必要
    }
}

// カバレッジ閾値の強制（test_strategy.md §6.3）。
// 現在はプロジェクト全体の単一ルール。
// レイヤー別ルール（§6.1: ドメイン 85% 等）への分割は Release 1 の最終イテレーションまでに行う。
// 全体ルールだけでは、DTO や Controller の薄いテストでドメイン層の穴を相殺できてしまう。
tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('jacocoTestReport')
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.75
            }
        }
        rule {
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.65
            }
        }
    }
}

// カバレッジ検証を check に含める（IT1 で有効化）。
//
// 当初は IT2 の予定だったが、実測が 88.7%（行）で閾値 75% を十分上回っており、
// **「閾値を満たすためのテストを書く」という懸念が現実にならない**ことが確認できた。
// 「余力次第の返済枠」は繰り越されて固定化するため、上回っているうちに入れる。
tasks.named('check') { dependsOn tasks.named('jacocoTestCoverageVerification') }

// ADR で「採用しない」「本番の成果物に含めない」と宣言した依存が、
// 本番の実行クラスパスに入っていないことを検証する（IT2 タスク 0-1）。
//
// **宣言はコメントでは守られない。** ADR-003 は H2 を developmentOnly とし本番の成果物に
// 含めないと定め、ADR-006 は WireMock を採用しないと定めているが、いずれも強制する仕組みが
// 無かった。誰かが developmentOnly を runtimeOnly に書き換えても、テストは緑のままになる。
//
// 検査対象は runtimeClasspath ではなく productionRuntimeClasspath である。
// developmentOnly は runtimeClasspath には載る（ローカル起動のため）が、
// bootJar には載らない。**runtimeClasspath を見ると常に赤になり、意味を成さない。**
tasks.register('verifyProductionDependencies') {
    group = 'verification'
    description = '本番の実行クラスパスに、採用しないと宣言した依存が無いことを検証する'

    // ADR で明示的に排除した依存。キーは依存の座標の一部、値は根拠。
    def forbidden = [
            'com.h2database'            : 'ADR-003: H2 はローカル起動のみ。本番の成果物に含めない',
            'wiremock'                  : 'ADR-006: 外部連携が無いため WireMock は採用しない',
            'spring-cloud-contract'     : 'ADR-006: 契約テストの対象が存在しない',
            // ORM のみを対象とする。hibernate-validator は Bean Validation の実装であり
            // ADR-004 の対象外である（org.hibernate で一括除外すると誤検知する）。
            'org.hibernate.orm'         : 'ADR-004: 永続化は MyBatis。JPA / Hibernate は採用しない',
            'jakarta.persistence'       : 'ADR-004: JPA の API を本番に持ち込まない',
    ]
    // ADR-003 は開発環境向けに `-PincludeH2=true` での opt-in を認めている。
    // **認めた抜け道を検証が知らないと、正当な手順がビルドを落とす。**
    // 逆に、opt-in していないのに H2 が入っていれば落ちる。
    if (project.hasProperty('includeH2')) {
        forbidden.remove('com.h2database')
    }

    def config = configurations.named('productionRuntimeClasspath')

    inputs.files(config)
    doLast {
        def resolved = config.get().resolvedConfiguration.resolvedArtifacts
                .collect { "${it.moduleVersion.id.group}:${it.moduleVersion.id.name}" }
        def violations = []
        forbidden.each { needle, reason ->
            resolved.findAll { it.contains(needle) }.each { violations << "$it — $reason" }
        }
        if (violations) {
            throw new GradleException(
                    '本番の実行クラスパスに、採用しないと宣言した依存が含まれています:\n  '
                            + violations.join('\n  '))
        }
    }
}

tasks.named('check') { dependsOn tasks.named('verifyProductionDependencies') }
