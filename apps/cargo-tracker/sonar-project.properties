sonar.projectKey=cargo-tracker-go-backend
sonar.projectName=Cargo Tracker Backend (Go)

# ソース・テスト
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/*_test.go,**/sqlcgen/**,**/tmp/**,web/e2e/**,web/static/**

# Go カバレッジ（go test -coverprofile=coverage.out で生成）
sonar.go.coverage.reportPaths=coverage.out

# 生成コード（sqlc）はカバレッジ対象から除外
sonar.coverage.exclusions=**/sqlcgen/**,cmd/server/**,**/*_test.go

sonar.sourceEncoding=UTF-8
