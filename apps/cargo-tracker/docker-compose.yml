services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cargo
      POSTGRES_PASSWORD: cargo
      POSTGRES_DB: cargo_tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cargo -d cargo_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
