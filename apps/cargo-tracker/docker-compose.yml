# 開発用 Docker Compose (local プロファイル)
#
# 起動: docker compose up -d
# 停止: docker compose down
# データ初期化: docker compose down -v
services:
  postgres:
    image: postgres:16-alpine
    container_name: cargo-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cargo_tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cargo_tracker_dev}
      POSTGRES_DB: cargo_tracker_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cargo_tracker -d cargo_tracker_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: cargo-tracker-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres

  mailhog:
    image: mailhog/mailhog:latest
    container_name: cargo-tracker-mail
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

volumes:
  postgres_data:
    name: cargo-tracker-postgres-data
