# ローカル開発の依存ミドルウェア。
#
# 正典: docs/design/cargo-tracker/architecture_infrastructure.md
#
# 本番・ステージングは kind + Kustomize / AWS ECS で、この compose は開発機の
# 「アプリを動かすための土台」だけを立てる。

services:
  axonserver:
    image: axoniq/axonserver:2026.0.4
    container_name: cargo-tracker-axonserver
    environment:
      # DCB を有効にする。無効だと接続が確立せず（AXONIQ-1302）、
      # アプリケーションは起動を止めないまま無限に再接続する（IT1 スパイクで実測）。
      AXONIQ_AXONSERVER_STANDALONE_DCB: "true"
      AXONIQ_AXONSERVER_DEVMODE_ENABLED: "true"
    ports:
      - "8024:8024"
      - "8124:8124"
    volumes:
      - axonserver-events:/axonserver/events

  postgres:
    image: postgres:16-alpine
    container_name: cargo-tracker-postgres
    environment:
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Tokyo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./ops/postgres/init-databases.sql:/docker-entrypoint-initdb.d/10-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  axonserver-events:
  postgres-data:
