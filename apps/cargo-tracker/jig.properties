# JIG (dddjava/jig) 設定
# 実行: apps/cargo-tracker/ を作業ディレクトリとして
#   sbt compile
#   java -jar ../../ops/tools/jig/jig-cli.jar
# 優先順位: CLI 引数(--jig.*) > -Djig.* > 環境変数(JIG_*) > {user.dir}/jig.properties > コード内デフォルト

# 出力先
jig.output-directory=./build/jig

# ドメインとして扱うパッケージ
jig.pattern.domain=cargotracker\\..+\\.domain\\..+
