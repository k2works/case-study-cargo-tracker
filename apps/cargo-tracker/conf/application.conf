# 共通設定（環境別差分は staging.conf / production.conf がこのファイルを include して上書きする）

# Play Session 署名キー（本番は Secrets Manager から環境変数で注入。全タスクで同一値必須）
play.http.secret.key = "dev-only-secret-key-please-change-0123456789abcdef"
play.http.secret.key = ${?PLAY_HTTP_SECRET_KEY}

# Flyway（flyway-play）: 起動時にマイグレーションを自動適用する
play.modules.enabled += "org.flywaydb.play.PlayModule"

db.default {
  driver = org.postgresql.Driver
  url = "jdbc:postgresql://localhost:5432/cargo_tracker"
  url = ${?DB_URL}
  username = cargo_tracker
  username = ${?DB_USER}
  password = cargo_tracker
  password = ${?DB_PASSWORD}

  # HikariCP: 最大タスク数 10 × 15 = 150 < RDS max_connections 200（非機能要件定義）
  hikaricp.maximumPoolSize = 15

  migration {
    auto = true
  }
}
