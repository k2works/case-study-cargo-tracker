# 共通設定（環境別差分は staging.conf / production.conf がこのファイルを include して上書きする）

# Play Session 署名キー（本番は Secrets Manager から環境変数で注入。全タスクで同一値必須）
play.http.secret.key = "dev-only-secret-key-please-change-0123456789abcdef"
play.http.secret.key = ${?PLAY_HTTP_SECRET_KEY}

# Flyway（flyway-play）: 起動時にマイグレーションを自動適用する
play.modules.enabled += "org.flywaydb.play.PlayModule"

# 認証フィルター（保護リソースへのアクセスに有効なセッションを要求）
play.http.filters = "Filters"

# 許可ホスト（DNS リバインディング対策）。既定はローカルのみ。
# K8s のヘルスチェックは Pod IP を Host にするため、PLAY_ALLOWED_HOST で許可ホストを拡張する
# （Docker Desktop の local overlay では "." を設定し全ホストを許可。本番 ECS は ALB ホストを指定）。
play.filters.hosts {
  allowed = ["localhost", "localhost:9000", "127.0.0.1", "127.0.0.1:9000"]
  allowed += ${?PLAY_ALLOWED_HOST}
}

# 開発用 admin シードユーザー（IT1 レビュー H1 対応・IT2 タスク 0.10）。
# 本番では必ず環境変数 / Secrets Manager から差し替える。`enabled = false` で投入をスキップ可能。
cargotracker.admin-seed {
  enabled = true
  enabled = ${?ADMIN_SEED_ENABLED}
  username = "admin"
  username = ${?ADMIN_USERNAME}
  email = "admin@example.com"
  email = ${?ADMIN_EMAIL}
  password = "Adm1nPass!"
  password = ${?ADMIN_PASSWORD}
}

db.default {
  driver = org.postgresql.Driver
  url = "jdbc:postgresql://localhost:5432/cargo_tracker"
  url = ${?DB_URL}
  username = cargo_tracker
  username = ${?DB_USER}
  password = cargo_tracker
  password = ${?DB_PASSWORD}

  # HikariCP: 最大タスク数 10 × 15 = 150 < RDS max_connections 200（非機能要件定義）
  hikaricp.maximumPoolSize = 15

  migration {
    auto = true
  }
}

# IT9 0.3 (US23 / T8): 期限超過 Invoice 検出を Pekko Scheduler で日次起動
billing.overdue {
  enabled = true
  enabled = ${?BILLING_OVERDUE_ENABLED}
  cron-hour = 2
  cron-hour = ${?BILLING_OVERDUE_CRON_HOUR}
  cron-minute = 0
  cron-minute = ${?BILLING_OVERDUE_CRON_MINUTE}
  zone-id = "Asia/Tokyo"
  zone-id = ${?BILLING_OVERDUE_ZONE_ID}
}
