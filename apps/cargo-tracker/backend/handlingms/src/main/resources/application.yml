spring:
  application:
    name: handlingms
  datasource:
    # Database per Service（ADR-0001 決定 1）。他サービスの DB には繋がない。
    url: ${DB_URL:jdbc:postgresql://localhost:5432/handling_read_db}
    username: ${DB_USER:handlingms}
    password: ${DB_PASSWORD:handlingms}
  flyway:
    enabled: true
    locations: classpath:db/migration
  main:
    # Axon の axon.axonserver ConfigurationProperties が Spring Boot の
    # BoundConfigurationProperties と Bean 循環を作るため必須（IT1 スパイクで実測）。
    # Spring Boot の版を下げても回避できない。
    allow-circular-references: true

server:
  port: ${SERVER_PORT:8085}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

axon:
  axonserver:
    servers: ${AXON_SERVER:localhost:8124}

management:
  endpoints:
    web:
      exposure:
        include: health,info
