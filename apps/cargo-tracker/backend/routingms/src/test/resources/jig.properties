# jig-erd の出力設定
# 出力先は build/ 配下とし、Git 管理外に置く（生成物はコミットしない）
jig.erd.output.directory=./build/jig-erd
jig.erd.output.prefix=routingms-erd
jig.erd.output.format=SVG

# 対象スキーマを public に限定する。
# flyway_schema_history も public にあるため図に現れる。「Flyway 管理テーブルを
# 除外する」設定ではない点に注意する。
jig.erd.filter.schema.pattern=public
