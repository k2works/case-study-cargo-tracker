spring:
  application:
    name: routingms
  datasource:
    # Database per Service（ADR-0001 決定 1）。他サービスの DB には繋がない。
    url: ${DB_URL:jdbc:postgresql://localhost:5432/routing_read_db}
    username: ${DB_USER:routingms}
    password: ${DB_PASSWORD:routingms}
  flyway:
    enabled: true
    locations: classpath:db/migration
  main:
    # Axon の axon.axonserver ConfigurationProperties が Spring Boot の
    # BoundConfigurationProperties と Bean 循環を作るため必須（IT1 スパイクで実測）。
    # Spring Boot の版を下げても回避できない。
    allow-circular-references: true

server:
  port: ${SERVER_PORT:8083}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

axon:
  axonserver:
    servers: ${AXON_SERVER:localhost:8124}
  eventhandling:
    processors:
      # Processing Group はパッケージ名キーで指定する（@ProcessingGroup は Axon 5 に無い）。
      # 名前の正典は data-model.md「Processing Group とテーブルの対応」。
      # 列挙し忘れると既定の設定で動くので、テストは緑のまま本番だけ挙動が変わる。
      "[com.example.cargotracker.routing.infrastructure.projection]":
        mode: pooled

management:
  endpoints:
    web:
      exposure:
        include: health,info
