# 料金の料率（正典: docs/design/cargo-tracker/domain-model.md「料金計算（正典）」）。
#
# **application.yml から分けてある。** 2 つのサービスを同じ JVM に載せると
# `classpath:application.yml` は最初に見つかった 1 つしか読まれず、相手の設定が
# 勝つと料率が消える（契約の往復テストで実測。起動そのものが失敗した）。
# 別名のファイルにして `spring.config.import` で名指しすれば、どちらのサービスが
# 先に読まれても自分の料率が入る。
#
# **ハードコードしない**（ADR-0016）。見積（US01・IT14）も同じ値を読むので、
# 出典が 1 つでなければ片方だけ直る。欠けていれば RateTable が組み立ての時点で
# 断るので、請求のたびに落ちることはない。
#
# **共有カーネルに置く**（IT14）。読み手が billingms（請求）と bookingms（見積）の
# 2 つになったが、bookingms は billingms に依存できない（BC の独立性）。
# **式は共有しない**——見積の入力は候補経路、請求の入力は実際に通った区間で、
# 金額は一致しない。同じなのは料率だけである。同一性は RateTableParityTest が
# 固定する。名前空間を billing のままにすると「請求の設定」に読めるので cargo にする。
cargo:
  rates:
    # 基準運賃（1 区間・1,000kg・一般貨物）
    base-fare: 50000
    # 区間ごとの地域係数。**区間の区分は両端の重いほう**。
    region-factors:
      DOMESTIC: 1.0
      NEAR_SEA: 2.5
      OCEAN: 6.0
    cargo-type-factors:
      GENERAL: 1.0
      HAZARDOUS: 1.8
      REFRIGERATED: 1.5
    # 港の所在国 → 地域区分。**表に無い国は遠洋**として数える（安いほうに
    # 倒さない。取りこぼした請求はあとから取り返せない）。
    country-regions:
      JP: DOMESTIC
      CN: NEAR_SEA
      KR: NEAR_SEA
      TW: NEAR_SEA
      SG: NEAR_SEA
      HK: NEAR_SEA
      TH: NEAR_SEA
      VN: NEAR_SEA
      MY: NEAR_SEA
      PH: NEAR_SEA
    # 消費税率。**輸出（出発地と目的地の国が違う）は免税**（判定は計算側）。
    tax-rate: 0.10
    # 状態別のキャンセル料の料率（US30・IT15）。**基本料金に掛ける**。
    #
    # **キャンセルできる予約状態を漏れなく並べる。** 表に無い状態は断る
    # （黙って 0 円で通すと、取りこぼした請求はあとから取り返せない）。
    # 漏れは RateTableParityTest#everyCancellableStatusHasAFeeRate が、
    # BookingStatus の列挙から回して見つける——名簿を手書きすると、
    # 足した状態が名乗り出ない。
    #
    # **輸送中の陸揚げ実費はここに入らない。** 港・船社・貨物で変わるので
    # 自動では出せず、経理が S61 の調整行で入れる（マニュアル 17 章）。
    cancellation-fee-rates:
      PRELIMINARY: 0.00
      ROUTE_PROPOSED: 0.05
      ROUTE_NOTIFIED: 0.05
      CONFIRMED: 0.10
      TRACKING_ISSUED: 0.20
      IN_TRANSIT: 0.50
