# フロントエンドの SonarQube 設定。プロジェクトキーと接続情報は sonar-local:scan が渡す。
#
# 品質基準の正典は docs/design/cargo-tracker/test_strategy.md である。

sonar.sources=src,e2e
sonar.tests=src,e2e
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=dist/**,node_modules/**,playwright-report/**,test-results/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
