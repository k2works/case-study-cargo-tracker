server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA のルーティングはクライアント側にある。存在しないパスは index.html に
    # 落とす。落とさないと、画面を開いたまま再読み込みしただけで 404 になる。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ドキュメントポータル。別の Pod（www）が配るが、パスはここに寄せる。
    # 別オリジンにすると、画面のナビから開くたびに転送を張り直す必要があり、
    # 「リンクが切れている」ように見える。
    location /docs-portal/ {
        proxy_pass http://www:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://gatewayms:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 利用者の身元は Gateway だけが決める（ADR-0001 決定 4）。外から来た
        # X-Auth-* は空にして渡す。Gateway 側でも必ず上書きしているが、
        # 「上書きしているから大丈夫」を前提にすると、上書きを緩めた日に破れる。
        proxy_set_header X-Auth-Username "";
        proxy_set_header X-Auth-Roles "";
        proxy_set_header X-Auth-Shipper-Id "";
    }

    # ヘルスチェック。SPA の index.html を返すと、壊れていても 200 になる。
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
