executables:
  cargo-tracker-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - cargo-tracker
    - servant >= 0.20
    - servant-server >= 0.20
    - warp >= 3.4
    - wai >= 3.2
    - wai-extra >= 3.1
    - http-types

tests:
  cargo-tracker-test:
    main:                Spec.hs
    source-dirs:
    - test
    - test/unit
    - test/integration
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - cargo-tracker
    - hspec >= 2.11
    - hedgehog >= 1.4
    - hspec-wai >= 0.11
    - wai >= 3.2
    - wai-extra >= 3.1
    - http-types
    - servant
    - servant-server
    - aeson
    - bytestring
    - text
    - postgresql-simple
    - lucid
    - servant-lucid

benchmarks:
  routing-bench:
    main:                RouteFinderBench.hs
    source-dirs:
    - bench
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    - -O2
    dependencies:
    - cargo-tracker
    - criterion >= 1.6
    - text
    - time
