name:                cargo-tracker
version:             0.1.0.0
github:              "k2works/case-study-cargo-tracker-haskell-take-1"
license:             BSD-3-Clause
author:              "Cargo Tracker Team"
maintainer:          "noreply@example.com"
copyright:           "2026 Cargo Tracker Team"

extra-source-files:
- README.md
- db/migrations/**/*.sql

synopsis:            国際貨物輸送管理システム (Haskell 版)
description:         DDD + ヘキサゴナル + CQRS を Servant + Warp + Lucid で実装

# ADR 0002 (arch-check) で定めたコンパイラフラグを全プロジェクトに強制適用
ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-patterns
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wpartial-fields
- -Wmissing-export-lists
- -Wmissing-deriving-strategies
- -Wunused-packages
- -Wname-shadowing
- -Wredundant-constraints
- -Werror=incomplete-patterns

default-extensions:
- DerivingStrategies
- GeneralizedNewtypeDeriving
- LambdaCase
- OverloadedStrings
- RecordWildCards
- ScopedTypeVariables
- StrictData
- TypeApplications
- DataKinds
- TypeOperators

dependencies:
- base >= 4.18 && < 5
- text >= 2.0
- bytestring
- containers
- time
- uuid
- aeson >= 2.2
- mtl >= 2.3
- bcrypt >= 0.0.11
- cryptohash-sha256 >= 0.11
- base64-bytestring >= 1.2
- servant >= 0.20
- servant-server >= 0.20
- wai >= 3.2
- postgresql-simple >= 0.7

library:
  source-dirs: src
  exposed-modules:
  - Cargotracker
  - Cargotracker.Shared.Domain.DomainError
  - Cargotracker.Shared.Auth.Domain.User
  - Cargotracker.Shared.Auth.Application.Ports
  - Cargotracker.Shared.Auth.Application.LoginCommand
  - Cargotracker.Shared.Auth.Infrastructure.BcryptVerifier
  - Cargotracker.Shared.Auth.Infrastructure.JwtIssuer
  - Cargotracker.Shared.Auth.Interfaces.LoginApi
  - Cargotracker.Shared.Auth.Interfaces.Protected
  - Cargotracker.Shipper.Domain.Model.Shipper
  - Cargotracker.Shipper.Domain.Model.Value.Address
  - Cargotracker.Shipper.Domain.Model.Value.ContactEmail
  - Cargotracker.Shipper.Domain.Model.Value.ShipperId
  - Cargotracker.Shared.Domain.Common.UnLocode
  - Cargotracker.Booking.Domain.Model.Cargo
  - Cargotracker.Booking.Domain.Model.Value.BookingId
  - Cargotracker.Booking.Domain.Model.Value.RouteSpecification
  - Cargotracker.Booking.Domain.Model.State.BookingStatus
  - Cargotracker.Routing.Domain.Model.Voyage
  - Cargotracker.Routing.Domain.Model.Value.VoyageNumber
  - Cargotracker.Routing.Domain.Model.Value.CarrierMovement
  - Cargotracker.Shipper.Application.Ports
  - Cargotracker.Shipper.Application.RegisterShipperCommand
  - Cargotracker.Booking.Application.Ports
  - Cargotracker.Booking.Application.RegisterBookingCommand
  - Cargotracker.Routing.Application.Ports
  - Cargotracker.Routing.Application.RegisterVoyageCommand
  - Cargotracker.Shipper.Interfaces.ShipperApi
  - Cargotracker.Booking.Interfaces.BookingApi
  - Cargotracker.Routing.Interfaces.VoyageApi
  - Cargotracker.Shared.Auth.Infrastructure.PostgresUserRepository
  - Cargotracker.Shipper.Infrastructure.PostgresShipperRepository
  - Cargotracker.Booking.Infrastructure.PostgresBookingRepository
  - Cargotracker.Booking.Infrastructure.PostgresShipperExistenceChecker

executables:
  cargo-tracker-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - cargo-tracker
    - servant >= 0.20
    - servant-server >= 0.20
    - warp >= 3.4
    - wai >= 3.2
    - http-types

tests:
  cargo-tracker-test:
    main:                Spec.hs
    source-dirs:
    - test
    - test/unit
    - test/integration
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - cargo-tracker
    - hspec >= 2.11
    - hedgehog >= 1.4
    - hspec-wai >= 0.11
    - wai >= 3.2
    - wai-extra >= 3.1
    - http-types
    - servant
    - servant-server
    - aeson
    - bytestring
    - text
    - postgresql-simple
