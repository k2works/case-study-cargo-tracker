name:                cargo-tracker
version:             0.1.0.0
github:              "k2works/case-study-cargo-tracker-haskell-take-1"
license:             BSD-3-Clause
author:              "Cargo Tracker Team"
maintainer:          "noreply@example.com"
copyright:           "2026 Cargo Tracker Team"

extra-source-files:
- README.md
- db/migrations/**/*.sql

synopsis:            国際貨物輸送管理システム (Haskell 版)
description:         DDD + ヘキサゴナル + CQRS を Servant + Warp + Lucid で実装

# ADR 0002 (arch-check) で定めたコンパイラフラグを全プロジェクトに強制適用
ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-patterns
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wpartial-fields
- -Wmissing-export-lists
- -Wmissing-deriving-strategies
- -Wunused-packages
- -Wname-shadowing
- -Wredundant-constraints
- -Werror=incomplete-patterns

default-extensions:
- DerivingStrategies
- GeneralizedNewtypeDeriving
- LambdaCase
- OverloadedStrings
- RecordWildCards
- ScopedTypeVariables
- StrictData
- TypeApplications
- DataKinds
- TypeOperators

dependencies:
- base >= 4.18 && < 5
- text >= 2.0
- bytestring
- containers
- time
- uuid
- aeson >= 2.2
- mtl >= 2.3
- bcrypt >= 0.0.11
- cryptohash-sha256 >= 0.11
- base64-bytestring >= 1.2
- servant >= 0.20
- servant-server >= 0.20
- wai >= 3.2
- postgresql-simple >= 0.7
- lucid >= 2.11
- servant-lucid >= 0.9
- http-api-data >= 0.6
- random >= 1.2

