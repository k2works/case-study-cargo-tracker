# JIG (dddjava/jig) の Spring 設定
# project.path / directory.* は Spring 設定プロパティのため、jig.properties ではなく本ファイルで指定する。
# Spring Boot が {user.dir}/application.properties を自動読み込みする。
project.path=./
directory.classes=target/scala-3.3.6/classes
directory.resources=target/scala-3.3.6/classes
directory.sources=app
