@(title: String)(content: Html)(implicit request: RequestHeader)
<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>@title - Cargo Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container">
        <a class="navbar-brand" href="/"><b>CargoTracker</b></a>
        @request.session.get("username").map { _ =>
          <div class="d-flex align-items-center gap-3 ms-auto">
            <a class="nav-link" href="/estimates">見積管理</a>
            <a class="nav-link" href="/shippers">荷主管理</a>
            <a class="nav-link" href="/bookings">貨物予約</a>
            <form method="POST" action="/logout" class="d-inline m-0">
              @helper.CSRF.formField
              <button type="submit" class="btn btn-outline-secondary btn-sm">ログアウト</button>
            </form>
          </div>
        }
      </div>
    </nav>
    <main class="container py-4">
      @content
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@@2.0.4/dist/htmx.min.js"></script>
  </body>
</html>
