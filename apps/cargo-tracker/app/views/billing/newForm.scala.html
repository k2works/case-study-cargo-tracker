@(form: Form[cargotracker.billing.interfaces.web.NewInvoiceFormData])(implicit request: RequestHeader, flash: Flash, messages: play.api.i18n.Messages)
@views.html.layout.main("請求書発行") {
  <h1 class="h3 mb-3">請求書発行</h1>
  @flash.get("error").map { msg => <div class="alert alert-danger">@msg</div> }
  <form method="POST" action="@cargotracker.billing.interfaces.web.routes.InvoiceController.create()">
    @helper.CSRF.formField
    <div class="mb-3">
      <label class="form-label">予約 ID <span class="text-danger">*</span></label>
      <input type="text" name="bookingId" class="form-control" value="@form("bookingId").value.getOrElse("")" placeholder="BK-000001" required maxlength="20">
      <div class="form-text">引取済 (Delivered) 状態の予約のみ請求可能です。</div>
    </div>
    <div class="form-check mb-3">
      <input type="checkbox" name="isCorporate" value="true" class="form-check-input" id="is-corporate" @if(form("isCorporate").value.contains("true")){checked}>
      <label class="form-check-label" for="is-corporate">法人荷主</label>
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">発行</button>
      <a href="@cargotracker.billing.interfaces.web.routes.InvoiceController.list()" class="btn btn-secondary">一覧に戻る</a>
    </div>
  </form>
}
