# テストプロファイル。
# データソースは Testcontainers が @ServiceConnection で動的に上書きする（ADR-003）。
spring:
  # 認証のテストにはシードされた利用者が要る。**業務データ（db/demo）は含めない。**
  # 含めると「本番に動作確認用データが混ざらないこと」を検証できなくなる。
  flyway:
    locations: classpath:db/migration/common,classpath:db/migration/{vendor},classpath:db/seed

  thymeleaf:
    cache: false

logging:
  level:
    org.testcontainers: WARN
    com.github.dockerjava: WARN

# **動作確認用データの投入クラスを Bean として作る。**
# 中身を検査で固定するために必要である（DemoDataInstallerTest が直接呼ぶ）。
# **起動時には走らない** —— DemoDataRunner は @Profile("!test") で外してある。
# そうしないと、すべてのテストが動作確認用データの上で動くことになる。
cargo-tracker:
  demo:
    install: true
    # デモモードを検査できるようにする。
    # **間隔は最小にする。** 本番相当の 2.5 秒だと 16 手順 × 貨物数だけ待つことになり、
    # 待ち時間そのものを検査していることになる。
    # 待つことの意味は設定値で表しており、ここで確かめるのは手順の側である。
    mode:
      enabled: true
      step-interval: 1ms
      concurrent-cargo: 2
