# 共通設定。環境固有の値は application-{profile}.yml で上書きする。
# 設定値の正典は docs/design/non_functional.md（性能・可用性・セキュリティ）。
spring:
  application:
    name: cargo-tracker
  profiles:
    default: local

  # ADR-004: 永続化は MyBatis。JPA は採用しない。
  # ADR-003: テストも本番と同一の PostgreSQL を使う。H2 は採用しない。
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      # non_functional.md §5 に対応。RDS の max_connections を超えないこと。
      maximum-pool-size: 20
      connection-timeout: 3000

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 既存マイグレーションの編集は禁止（チェックサム検証）。
    # ロールバックは Undo ではなく Forward + Expand-Contract で行う
    # （Undo は Flyway Community Edition では実行できない）。
    validate-on-migrate: true

  thymeleaf:
    cache: true

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# 追跡画面の htmx ポーリング間隔。
# テストで短縮できるよう外部化する（コメントで「テストでは短く」と書くだけでは短くならない）。
cargotracker:
  tracking:
    polling-interval: 30s

logging:
  level:
    root: INFO
    com.example.cargotracker: INFO
