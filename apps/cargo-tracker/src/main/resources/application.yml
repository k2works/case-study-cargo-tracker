server:
  port: ${PORT:8080}

spring:
  application:
    name: cargo-tracker
  datasource:
    url: jdbc:h2:mem:cargo_tracker
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
