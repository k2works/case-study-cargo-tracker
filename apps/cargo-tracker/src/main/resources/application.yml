server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:h2:mem:cargo_tracker;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true  # 開発用 H2 コンソール。本番（product プロファイル）では無効化すること
      path: /h2-console
  security:
    user:
      name: admin
      password: admin  # 開発用固定値。本番は環境変数 SPRING_SECURITY_USER_PASSWORD で注入すること
  # ── 以下は開発環境専用設定（本番プロファイルでは上書きまたは無効化される）──
  thymeleaf:
    cache: false  # テンプレート変更の即時反映。本番は true に変更すること
  devtools:
    restart:
      enabled: true   # ホットリロード。本番 JAR には devtools が含まれないため実質無効
    livereload:
      enabled: true   # ブラウザライブリロード。本番 JAR には devtools が含まれないため実質無効

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.cargotracker
  type-handlers-package: com.example.cargotracker.shared.infrastructure
  configuration:
    map-underscore-to-camel-case: true

app:
  seed:
    enabled: true
