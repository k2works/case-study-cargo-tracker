<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予約登録 - CargoTracker</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/header :: appHeader}"></nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h4 class="card-title mb-0">予約登録</h4>
                </div>
                <div class="card-body">
                    <!-- エラーメッセージ -->
                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                    <form th:action="@{/bookings}" method="post" th:object="${form}">

                        <!-- 荷主情報 -->
                        <h6 class="text-muted mb-3">荷主情報</h6>
                        <div class="mb-3 row">
                            <label for="shipperId" class="col-sm-3 col-form-label">荷主名 <span class="text-danger">*</span></label>
                            <div class="col-sm-9">
                                <select class="form-select" id="shipperId" name="shipperId"
                                        th:classappend="${#fields.hasErrors('shipperId')} ? 'is-invalid'"
                                        required>
                                    <option value="">-- 荷主を選択してください --</option>
                                    <option th:each="shipper : ${shippers}"
                                            th:value="${shipper.id}"
                                            th:text="${shipper.name + ' / ' + shipper.email}"
                                            th:selected="${form.shipperId == shipper.id.toString()}"></option>
                                </select>
                                <div th:if="${#fields.hasErrors('shipperId')}" class="invalid-feedback"
                                       th:errors="*{shipperId}"></div>
                                <div class="form-text">同名の荷主がある場合はメールアドレスで見分けてください。</div>
                            </div>
                        </div>

                        <hr>
                        <!-- 貨物仕様 -->
                        <h6 class="text-muted mb-3">貨物仕様</h6>

                        <div class="mb-3 row">
                            <label for="cargoType" class="col-sm-3 col-form-label">貨物種別 <span class="text-danger">*</span></label>
                            <div class="col-sm-9">
                                <select class="form-select" id="cargoType" name="cargoType"
                                        th:classappend="${#fields.hasErrors('cargoType')} ? 'is-invalid'">
                                    <option value="">-- 選択してください --</option>
                                    <option th:each="type : ${cargoTypes}"
                                            th:value="${type}"
                                            th:text="${type.displayName}"
                                            th:selected="${form.cargoType == type}"></option>
                                </select>
                                <div th:if="${#fields.hasErrors('cargoType')}" class="invalid-feedback"
                                     th:errors="*{cargoType}"></div>
                            </div>
                        </div>

                        <!-- 危険物条件フィールド（cargoType=DANGEROUS_GOODS の時のみ表示） -->
                        <div id="dangerousGoodsFields" class="d-none">
                          <div class="row mb-3">
                            <label for="unNumber" class="col-sm-3 col-form-label">UN 番号 <span class="text-danger">*</span></label>
                            <div class="col-sm-9">
                              <input type="text" class="form-control" id="unNumber" name="unNumber"
                                     th:value="${form.unNumber}" placeholder="例: UN1234" maxlength="10">
                              <div class="invalid-feedback" th:if="${#fields.hasErrors('unNumber')}"
                                   th:errors="*{unNumber}"></div>
                            </div>
                          </div>
                          <div class="row mb-3">
                            <label for="hazardClass" class="col-sm-3 col-form-label">危険品等級</label>
                            <div class="col-sm-9">
                              <input type="text" class="form-control" id="hazardClass" name="hazardClass"
                                     th:value="${form.hazardClass}" placeholder="例: クラス3">
                            </div>
                          </div>
                        </div>

                        <!-- 冷凍条件フィールド（cargoType=REFRIGERATED の時のみ表示） -->
                        <div id="refrigeratedFields" class="d-none">
                          <div class="row mb-3">
                            <label for="minTempCelsius" class="col-sm-3 col-form-label">最低温度 (℃) <span class="text-danger">*</span></label>
                            <div class="col-sm-9">
                              <input type="number" class="form-control" id="minTempCelsius" name="minTempCelsius"
                                     th:value="${form.minTempCelsius}" step="0.1">
                              <div class="invalid-feedback" th:if="${#fields.hasErrors('minTempCelsius')}"
                                   th:errors="*{minTempCelsius}"></div>
                            </div>
                          </div>
                          <div class="row mb-3">
                            <label for="maxTempCelsius" class="col-sm-3 col-form-label">最高温度 (℃) <span class="text-danger">*</span></label>
                            <div class="col-sm-9">
                              <input type="number" class="form-control" id="maxTempCelsius" name="maxTempCelsius"
                                     th:value="${form.maxTempCelsius}" step="0.1">
                              <div class="invalid-feedback" th:if="${#fields.hasErrors('maxTempCelsius')}"
                                   th:errors="*{maxTempCelsius}"></div>
                            </div>
                          </div>
                        </div>

                        <!-- 動的表示スクリプト -->
                        <script>
                          function updateCargoTypeFields() {
                            const cargoType = document.getElementById('cargoType').value;
                            document.getElementById('dangerousGoodsFields').classList.toggle('d-none', cargoType !== 'DANGEROUS_GOODS');
                            document.getElementById('refrigeratedFields').classList.toggle('d-none', cargoType !== 'REFRIGERATED');
                          }
                          document.getElementById('cargoType').addEventListener('change', updateCargoTypeFields);
                          // 初期表示（バリデーションエラー後の再表示時）
                          updateCargoTypeFields();
                        </script>

                        <div class="mb-3 row">
                            <label for="weightKg" class="col-sm-3 col-form-label">重量 (kg) <span class="text-danger">*</span></label>
                            <div class="col-sm-4">
                                <input type="number" class="form-control" id="weightKg" name="weightKg"
                                       th:value="*{weightKg}"
                                       th:classappend="${#fields.hasErrors('weightKg')} ? 'is-invalid'"
                                       min="0.01" step="0.01" placeholder="例: 100.0">
                                <div th:if="${#fields.hasErrors('weightKg')}" class="invalid-feedback"
                                     th:errors="*{weightKg}"></div>
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label class="col-sm-3 col-form-label">寸法 (cm)</label>
                            <div class="col-sm-9">
                                <div class="row g-2">
                                    <div class="col-4">
                                        <input type="number" class="form-control" name="lengthCm"
                                               th:value="*{lengthCm}"
                                               min="0" step="0.1" placeholder="長さ">
                                    </div>
                                    <div class="col-4">
                                        <input type="number" class="form-control" name="widthCm"
                                               th:value="*{widthCm}"
                                               min="0" step="0.1" placeholder="幅">
                                    </div>
                                    <div class="col-4">
                                        <input type="number" class="form-control" name="heightCm"
                                               th:value="*{heightCm}"
                                               min="0" step="0.1" placeholder="高さ">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="quantity" class="col-sm-3 col-form-label">個数 <span class="text-danger">*</span></label>
                            <div class="col-sm-4">
                                <input type="number" class="form-control" id="quantity" name="quantity"
                                       th:value="*{quantity}"
                                       th:classappend="${#fields.hasErrors('quantity')} ? 'is-invalid'"
                                       min="1" step="1" value="1">
                                <div th:if="${#fields.hasErrors('quantity')}" class="invalid-feedback"
                                     th:errors="*{quantity}"></div>
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="description" class="col-sm-3 col-form-label">品名</label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" id="description" name="description"
                                       th:value="*{description}"
                                       placeholder="例: 電子機器">
                            </div>
                        </div>

                        <hr>
                        <!-- 輸送条件 -->
                        <h6 class="text-muted mb-3">輸送条件</h6>

                        <div class="mb-3 row">
                            <label for="originLocation" class="col-sm-3 col-form-label">出発地 (UNLOCODE) <span class="text-danger">*</span></label>
                            <div class="col-sm-4">
                                <input type="text" class="form-control" id="originLocation" name="originLocation"
                                       th:value="*{originLocation}"
                                       th:classappend="${#fields.hasErrors('originLocation')} ? 'is-invalid'"
                                       placeholder="例: JPTYO" maxlength="200" required>
                                <div th:if="${#fields.hasErrors('originLocation')}" class="invalid-feedback"
                                     th:errors="*{originLocation}"></div>
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="destinationLocation" class="col-sm-3 col-form-label">目的地 (UNLOCODE) <span class="text-danger">*</span></label>
                            <div class="col-sm-4">
                                <input type="text" class="form-control" id="destinationLocation" name="destinationLocation"
                                       th:value="*{destinationLocation}"
                                       th:classappend="${#fields.hasErrors('destinationLocation')} ? 'is-invalid'"
                                       placeholder="例: USNYC" maxlength="200" required>
                                <div th:if="${#fields.hasErrors('destinationLocation')}" class="invalid-feedback"
                                     th:errors="*{destinationLocation}"></div>
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="requestedPickupDate" class="col-sm-3 col-form-label">希望引渡日 <span class="text-danger">*</span></label>
                            <div class="col-sm-4">
                                <input type="date" class="form-control" id="requestedPickupDate"
                                       name="requestedPickupDate"
                                       th:value="*{requestedPickupDate}"
                                       th:classappend="${#fields.hasErrors('requestedPickupDate')} ? 'is-invalid'"
                                       required>
                                <div th:if="${#fields.hasErrors('requestedPickupDate')}" class="invalid-feedback"
                                     th:errors="*{requestedPickupDate}"></div>
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="requestedDeliveryDate" class="col-sm-3 col-form-label">希望着日 <span class="text-danger">*</span></label>
                            <div class="col-sm-4">
                                <input type="date" class="form-control" id="requestedDeliveryDate"
                                       name="requestedDeliveryDate"
                                       th:value="*{requestedDeliveryDate}"
                                       th:classappend="${#fields.hasErrors('requestedDeliveryDate')} ? 'is-invalid'"
                                       required>
                                <div th:if="${#fields.hasErrors('requestedDeliveryDate')}" class="invalid-feedback"
                                     th:errors="*{requestedDeliveryDate}"></div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a th:href="@{/bookings}" class="btn btn-outline-secondary">キャンセル</a>
                            <button type="submit" class="btn btn-primary">予約登録</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
