<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予約登録 - Cargo Tracker</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">CargoTracker</a>
        <div class="navbar-nav me-auto">
            <a class="nav-link" th:href="@{/shippers}">荷主管理</a>
            <a class="nav-link active" th:href="@{/bookings}">予約管理</a>
        </div>
        <form th:action="@{/logout}" method="post" class="d-flex">
            <button type="submit" class="btn btn-outline-light btn-sm">ログアウト</button>
        </form>
    </div>
</nav>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 mb-4">予約登録</h1>

                    <form th:action="@{/bookings}" th:object="${booking}" method="post">
                        <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                            入力内容を確認してください。
                        </div>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="shipperId" class="form-label">荷主 ID</label>
                                <input id="shipperId" type="text" th:field="*{shipperId}" class="form-control">
                                <div class="invalid-feedback d-block" th:errors="*{shipperId}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="cargoType" class="form-label">貨物種別</label>
                                <select id="cargoType" th:field="*{cargoType}" class="form-select">
                                    <option value="">選択してください</option>
                                    <option th:each="cargoType : ${cargoTypes}"
                                            th:value="${cargoType.name()}"
                                            th:text="${cargoType.name()}">GENERAL</option>
                                </select>
                                <div class="invalid-feedback d-block" th:errors="*{cargoType}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="weight" class="form-label">重量</label>
                                <input id="weight" type="number" step="0.001" min="0.001" th:field="*{weight}" class="form-control">
                                <div class="invalid-feedback d-block" th:errors="*{weight}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="arrivalDeadline" class="form-label">希望着日</label>
                                <input id="arrivalDeadline" type="date" th:field="*{arrivalDeadline}" class="form-control">
                                <div class="invalid-feedback d-block" th:errors="*{arrivalDeadline}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="originUnlocode" class="form-label">出発地</label>
                                <input id="originUnlocode" type="text" th:field="*{originUnlocode}" class="form-control text-uppercase">
                                <div class="invalid-feedback d-block" th:errors="*{originUnlocode}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="destinationUnlocode" class="form-label">目的地</label>
                                <input id="destinationUnlocode" type="text" th:field="*{destinationUnlocode}" class="form-control text-uppercase">
                                <div class="invalid-feedback d-block" th:errors="*{destinationUnlocode}"></div>
                            </div>
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-primary">登録する</button>
                            <a class="btn btn-outline-secondary" th:href="@{/bookings}">一覧へ戻る</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
