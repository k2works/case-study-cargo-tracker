<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予約詳細 - Cargo Tracker</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar('bookings')}"></div>

<main class="container py-4">
    <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">予約詳細</h1>
            <p class="text-secondary mb-0">予約番号: <span th:text="${booking.bookingId}">booking-id</span></p>
        </div>
        <div class="d-flex gap-2">
            <form th:if="${booking.status == 'PRELIMINARY'}"
                  th:action="@{/bookings/{id}/confirm(id=${booking.bookingId})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="button" class="btn btn-success"
                        data-bs-toggle="modal" data-bs-target="#confirmModal">予約確定</button>
                <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">予約確定の確認</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">予約を確定してもよろしいですか？確定後はキャンセルのみ可能です。</div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
                                <button type="submit" class="btn btn-success">確定する</button>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
            <form th:if="${booking.status != 'CANCELLED' and booking.status != 'SETTLED'}"
                  th:action="@{/bookings/{id}/cancel(id=${booking.bookingId})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="button" class="btn btn-outline-danger"
                        data-bs-toggle="modal" data-bs-target="#cancelModal">キャンセル</button>
                <div class="modal fade" id="cancelModal" tabindex="-1" aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">予約キャンセルの確認</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">予約をキャンセルしてもよろしいですか？この操作は元に戻せません。</div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">戻る</button>
                                <button type="submit" class="btn btn-danger">キャンセルする</button>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
            <a class="btn btn-outline-secondary" th:href="@{/bookings}">一覧へ戻る</a>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-3">荷主 ID</dt>
                <dd class="col-sm-9" th:text="${booking.shipperId}">shipper-id</dd>

                <dt class="col-sm-3">貨物種別</dt>
                <dd class="col-sm-9" th:text="${booking.cargoTypeDisplayName}">一般</dd>

                <dt class="col-sm-3">重量</dt>
                <dd class="col-sm-9" th:text="${booking.weight}">10.500</dd>

                <dt class="col-sm-3" th:if="${booking.dimensionLength != null}">寸法 (長×幅×高)</dt>
                <dd class="col-sm-9" th:if="${booking.dimensionLength != null}"
                    th:text="${booking.dimensionLength + ' × ' + booking.dimensionWidth + ' × ' + booking.dimensionHeight + ' m'}">10 × 5 × 3 m</dd>

                <dt class="col-sm-3" th:if="${booking.quantity != null}">個数</dt>
                <dd class="col-sm-9" th:if="${booking.quantity != null}" th:text="${booking.quantity}">5</dd>

                <dt class="col-sm-3" th:if="${booking.description != null}">品名</dt>
                <dd class="col-sm-9" th:if="${booking.description != null}" th:text="${booking.description}">電子部品一式</dd>

                <dt class="col-sm-3">出発地</dt>
                <dd class="col-sm-9" th:text="${booking.originUnlocode}">JPTYO</dd>

                <dt class="col-sm-3">目的地</dt>
                <dd class="col-sm-9" th:text="${booking.destinationUnlocode}">USLAX</dd>

                <dt class="col-sm-3">希望着日</dt>
                <dd class="col-sm-9" th:text="${booking.arrivalDeadline}">2026-04-30</dd>

                <dt class="col-sm-3" th:if="${booking.hazardousClass != null}">危険物クラス</dt>
                <dd class="col-sm-9" th:if="${booking.hazardousClass != null}" th:text="${booking.hazardousClass}">3</dd>

                <dt class="col-sm-3" th:if="${booking.unNumber != null}">UN番号</dt>
                <dd class="col-sm-9" th:if="${booking.unNumber != null}" th:text="${booking.unNumber}">UN1203</dd>

                <dt class="col-sm-3" th:if="${booking.properShippingName != null}">正式品名</dt>
                <dd class="col-sm-9" th:if="${booking.properShippingName != null}" th:text="${booking.properShippingName}">ガソリン</dd>

                <dt class="col-sm-3" th:if="${booking.minTemperature != null}">温度管理</dt>
                <dd class="col-sm-9" th:if="${booking.minTemperature != null}"
                    th:text="${booking.minTemperature + ' ～ ' + booking.maxTemperature + ' ' + booking.temperatureUnit}">-25 ～ -18 CELSIUS</dd>

                <dt class="col-sm-3">状態</dt>
                <dd class="col-sm-9">
                    <span class="badge"
                          th:classappend="'text-bg-' + ${booking.statusBadgeColor}"
                          th:text="${booking.statusDisplayName}">仮受付</span>
                </dd>
            </dl>
        </div>
    </div>
</main>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
