<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予約一覧 - CargoTracker</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/header :: appHeader}"></nav>

<main>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>予約一覧</h4>
        <a th:href="@{/bookings/new}" class="btn btn-primary">新規予約</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th scope="col">予約番号</th>
                    <th scope="col">荷主</th>
                    <th scope="col">貨物種別</th>
                    <th scope="col">出発地</th>
                    <th scope="col">目的地</th>
                    <th scope="col">希望引渡日</th>
                    <th scope="col">状態</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(bookings)}">
                    <td colspan="7" class="text-center text-muted py-4">予約が登録されていません</td>
                </tr>
                <tr th:each="booking : ${bookings}">
                    <td>
                        <a th:href="@{/bookings/{id}(id=${booking.id})}" th:text="${booking.id}"></a>
                    </td>
                    <td>
                        <div class="fw-semibold" th:text="${shipperNames[booking.id.toString()]}"></div>
                        <div class="small text-muted">ID: <code th:text="${booking.shipperId}"></code></div>
                    </td>
                    <td th:text="${booking.cargoSpecification.cargoType.displayName}"></td>
                    <td th:text="${booking.transportCondition.originLocation}"></td>
                    <td th:text="${booking.transportCondition.destinationLocation}"></td>
                    <td th:text="${booking.transportCondition.requestedPickupDate}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${booking.status.name() == 'CONFIRMED'} ? 'bg-success' : 'bg-warning text-dark'"
                              th:text="${booking.status.displayName}"></span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</main>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
