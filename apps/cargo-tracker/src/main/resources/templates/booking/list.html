<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>貨物予約一覧 | Cargo Tracker</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<nav th:replace="~{layout/nav :: navbar}"></nav>
<main class="container py-4">
  <div th:replace="~{fragments/alerts :: alerts}"></div>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">貨物予約一覧</h1>
    <!--/* **押せない操作を見せない。** 荷主は予約を登録できない（US34） */-->
    <a class="btn btn-primary" th:href="@{/bookings/new}"
       sec:authorize="hasRole('SALES')">+ 新規予約登録</a>
  </div>

  <form class="row g-2 mb-3" th:action="@{/bookings}" method="get">
    <div class="col-auto">
      <label class="visually-hidden" for="origin">出発地</label>
      <input type="text" class="form-control" id="origin" name="origin"
             th:value="${origin}" placeholder="出発地（JPOSA）">
    </div>
    <div class="col-auto">
      <label class="visually-hidden" for="destination">目的地</label>
      <input type="text" class="form-control" id="destination" name="destination"
             th:value="${destination}" placeholder="目的地（USLAX）">
    </div>
    <div class="col-auto">
      <label class="visually-hidden" for="status">ステータス</label>
      <select class="form-select" id="status" name="status">
        <option value="">すべて</option>
        <option th:each="s : ${statuses}" th:value="${s.name()}"
                th:text="${s.displayName()}" th:selected="${s.name() == status}">仮受付</option>
      </select>
    </div>
    <div class="col-auto">
      <!--/* 追跡番号で引き当てる（IT6 レビュー H9）。**荷主から「番号を無くした」
             「この番号は何の貨物か」と電話が来る。** 部分一致・大小文字を問わないのは、
             電話で読み上げられる番号の全桁が正確に伝わる前提を置けないためである */-->
      <label class="visually-hidden" for="trackingNumber">追跡番号</label>
      <input type="text" class="form-control" id="trackingNumber" name="trackingNumber"
             th:value="${trackingNumber}" placeholder="追跡番号（一部でも可）">
    </div>
    <div class="col-auto"><button class="btn btn-outline-secondary" type="submit">検索</button></div>
  </form>

  <!--/* 空状態。**荷主とそれ以外で意味が違う。**
         荷主が何も見えないのは「まだ依頼していない」か「紐付けが済んでいない」であり、
         「条件に一致しない」と書くと条件を変えれば出ると読まれる */-->
  <div th:if="${bookings.isEmpty()}" class="alert alert-info">
    <span sec:authorize="!hasRole('SHIPPER')">条件に一致する予約がありません。</span>
    <span sec:authorize="hasRole('SHIPPER')">
      表示できる予約がありません。ご依頼済みの予約が表示されない場合は、
      営業担当者、または<strong>システム管理担当窓口</strong>にお問い合わせください。
      <br>
      <span class="form-text">アカウントと会社の紐付けが未設定の場合があります。</span>
    </span>
  </div>

  <table th:unless="${bookings.isEmpty()}" class="table table-hover bg-white">
    <thead>
      <tr>
        <th>予約 ID</th><th>追跡番号</th><th>荷主</th><th>出発地</th><th>目的地</th>
        <th>希望期限</th><th>貨物種別</th><th>ステータス</th><th>操作</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="b : ${bookings.items()}">
        <td><code th:text="${#strings.substring(b.bookingId(), 0, 8)}">BK-1234</code></td>
        <!--/* 発行前は空である。**「-」を出して発行済みと区別する** */-->
        <td><code th:text="${b.hasTrackingNumber()} ? ${b.trackingNumber()} : '-'">TRK-20260401-0001</code></td>
        <td th:text="${b.shipperName()}">荷主名</td>
        <td th:text="${b.origin()}">JPOSA</td>
        <td th:text="${b.destination()}">USLAX</td>
        <td th:text="${b.arrivalDeadline()}">2026-04-15</td>
        <td th:text="${b.cargoTypeLabel()}">一般貨物</td>
        <td><span class="badge" th:classappend="${b.statusBadgeClass()}"
              th:text="${b.statusLabel()}">仮予約</span></td>
        <td><a class="btn btn-sm btn-outline-primary"
               th:href="@{/bookings/{id}(id=${b.bookingId()})}">詳細</a></td>
      </tr>
    </tbody>
  </table>

  <nav th:replace="~{fragments/pagination :: pagination(${bookings}, '/bookings', ${query})}"></nav>
</main>
</body>
</html>
