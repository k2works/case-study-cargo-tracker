<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>予約詳細 | Cargo Tracker</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<nav th:replace="~{layout/nav :: navbar}"></nav>
<main class="container py-4">
  <div th:replace="~{fragments/alerts :: alerts}"></div>
  <h1 class="h4 mb-3">
    予約詳細
    <span class="badge align-middle" th:classappend="${booking.statusBadgeClass()}"
          th:text="${booking.statusLabel()}">仮予約</span>
  </h1>

  <div class="card bg-white">
    <div class="card-body">
      <dl class="row mb-0">
        <dt class="col-sm-3">予約 ID</dt>
        <dd class="col-sm-9"><code th:text="${booking.bookingId()}">...</code></dd>
        <dt class="col-sm-3">荷主</dt>
        <dd class="col-sm-9"
            th:text="${booking.shipperCode()} + ' ' + ${booking.shipperName()}">SHP-000001</dd>
        <dt class="col-sm-3">出発地</dt>
        <dd class="col-sm-9" th:text="${booking.origin()}">JPOSA</dd>
        <dt class="col-sm-3">目的地</dt>
        <dd class="col-sm-9" th:text="${booking.destination()}">USLAX</dd>
        <dt class="col-sm-3">希望到着期限</dt>
        <dd class="col-sm-9" th:text="${booking.arrivalDeadline()}">2026-04-15</dd>
        <dt class="col-sm-3">貨物種別</dt>
        <dd class="col-sm-9" th:text="${booking.cargoTypeLabel()}">一般貨物</dd>
        <dt class="col-sm-3">重量</dt>
        <dd class="col-sm-9" th:text="${booking.weight()} + ' kg'">1200.5 kg</dd>
        <dt class="col-sm-3">個数</dt>
        <dd class="col-sm-9" th:text="${booking.quantity()} ?: '-'">-</dd>
        <dt class="col-sm-3">寸法</dt>
        <dd class="col-sm-9"
            th:text="${booking.dimensions() != ''} ? ${booking.dimensions()} : '-'">-</dd>
        <dt class="col-sm-3">品名</dt>
        <dd class="col-sm-9"
            th:text="${booking.description() != ''} ? ${booking.description()} : '-'">-</dd>
        <!--/* 追跡番号（US14）。**ADR-006 によりメール通知は送らない。**
               荷主に伝える番号はこの画面で読む */-->
        <dt class="col-sm-3">追跡番号</dt>
        <dd class="col-sm-9">
          <code th:if="${booking.hasTrackingNumber()}"
                th:text="${booking.trackingNumber()}">TRK-20260901-0001</code>
          <span th:unless="${booking.hasTrackingNumber()}" class="text-muted">未発行</span>
        </dd>
      </dl>
    </div>
  </div>

  <!--/* 確定した経路（US11）。割り当て前は「未割り当て」と状態だけを示す */-->
  <div class="card mt-3">
    <div class="card-body">
      <h2 class="h6">
        経路
        <span class="badge ms-1" th:classappend="${booking.routingStatusBadgeClass()}"
              th:text="${booking.routingStatusLabel()}">未割り当て</span>
      </h2>

      <p th:unless="${booking.isRouted()}" class="text-muted mb-0">
        まだ経路が割り当てられていません。
        <span sec:authorize="hasRole('ROUTER')">
          <a th:href="@{/bookings/{id}/route(id=${booking.bookingId()})}">経路を割り当てる</a>
        </span>
      </p>

      <table th:if="${booking.isRouted()}" class="table table-sm mb-0">
        <thead>
          <tr><th style="width: 4rem;">#</th><th>航海番号</th>
              <th>積込港</th><th>積込</th><th>荷降港</th><th>荷降</th></tr>
        </thead>
        <tbody>
          <tr th:each="leg, stat : ${booking.itinerary()}">
            <td th:text="${stat.count}">1</td>
            <td><code th:text="${leg.voyageNumber()}">V001</code></td>
            <td th:text="${leg.loadLocation()}">JPOSA</td>
            <td th:text="${#temporals.format(leg.loadTime(), 'yyyy-MM-dd HH:mm')}">-</td>
            <td th:text="${leg.unloadLocation()}">USLAX</td>
            <td th:text="${#temporals.format(leg.unloadTime(), 'yyyy-MM-dd HH:mm')}">-</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="mt-3 d-flex gap-2">
    <!--/* 戻り先はロールごとに違う。**開いた本人が開けない先へのボタンを出さない。**
           押した先で「利用できません」と言われるボタンは、無いほうがまだよい */-->
    <a class="btn btn-outline-secondary" th:href="@{/bookings}"
       sec:authorize="hasRole('SALES')">一覧に戻る</a>
    <a class="btn btn-outline-secondary" th:href="@{/routing/queue}"
       sec:authorize="hasRole('ROUTER')">経路割り当て待ちへ戻る</a>
    <a class="btn btn-outline-primary" th:href="@{/bookings/{id}/route(id=${booking.bookingId()})}"
       sec:authorize="hasRole('ROUTER')">経路を割り当て</a>
    <!--/* ボタンの出し分けは集約の述語をそのまま使う（assignable / cancellable）。
           ここで状態名を並べると、遷移表の規則が画面にも散る */-->
    <form th:if="${booking.assignable()}"
          th:action="@{/bookings/{id}/assign-to-routing(id=${booking.bookingId()})}"
          method="post" sec:authorize="hasRole('SALES')">
      <button type="submit" class="btn btn-primary">経路設計者に引き渡す</button>
    </form>
    <!--/* 確定（US13）。**経路が割り当てられている場合だけ押せる**（遷移表 #4 の
           事前条件）。confirmable は集約と同じ判断を返す（CargoProgress.confirmable） */-->
    <form th:if="${booking.confirmable()}"
          th:action="@{/bookings/{id}/confirm(id=${booking.bookingId()})}"
          method="post" sec:authorize="hasRole('SALES')">
      <button type="submit" class="btn btn-primary">予約を確定</button>
    </form>
    <!--/* 追跡番号の発行（US14）。**押すのは追跡管理者**（遷移表 #5） */-->
    <form th:if="${booking.trackingNumberIssuable()}"
          th:action="@{/bookings/{id}/tracking-number(id=${booking.bookingId()})}"
          method="post" sec:authorize="hasRole('TRACKER')">
      <button type="submit" class="btn btn-primary">追跡番号を発行</button>
    </form>
    <!--/* 追跡管理者の戻り先。**開いた本人が開けない先へのボタンを出さない** */-->
    <a class="btn btn-outline-secondary" th:href="@{/tracking/queue}"
       sec:authorize="hasRole('TRACKER')">追跡番号発行待ちへ戻る</a>
    <form th:if="${booking.cancellable()}" th:action="@{/bookings/{id}/cancel(id=${booking.bookingId()})}"
          method="post" sec:authorize="hasRole('SALES')">
      <!--/* 取り消せない操作に確認を挟む。**押した瞬間に確定する画面は事故のもと。**
             hx-confirm ではなく素の confirm を使うのは、この操作が htmx の
             部分更新ではなく PRG で画面全体を遷移させるためである */-->
      <button type="submit" class="btn btn-outline-danger"
              onclick="return confirm('この予約をキャンセルします。取り消せません。よろしいですか？');">
        キャンセル
      </button>
    </form>
  </div>
</main>
</body>
</html>
