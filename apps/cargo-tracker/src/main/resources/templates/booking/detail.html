<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>予約詳細 | Cargo Tracker</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<nav th:replace="~{layout/nav :: navbar}"></nav>
<main class="container py-4">
  <div th:replace="~{fragments/alerts :: alerts}"></div>
  <h1 class="h4 mb-3">
    予約詳細
    <span class="badge bg-secondary align-middle" th:text="${booking.statusLabel()}">仮受付</span>
  </h1>

  <div class="card bg-white">
    <div class="card-body">
      <dl class="row mb-0">
        <dt class="col-sm-3">予約 ID</dt>
        <dd class="col-sm-9"><code th:text="${booking.bookingId()}">...</code></dd>
        <dt class="col-sm-3">荷主</dt>
        <dd class="col-sm-9"
            th:text="${booking.shipperCode()} + ' ' + ${booking.shipperName()}">SHP-000001</dd>
        <dt class="col-sm-3">出発地</dt>
        <dd class="col-sm-9" th:text="${booking.origin()}">JPOSA</dd>
        <dt class="col-sm-3">目的地</dt>
        <dd class="col-sm-9" th:text="${booking.destination()}">USLAX</dd>
        <dt class="col-sm-3">希望到着期限</dt>
        <dd class="col-sm-9" th:text="${booking.arrivalDeadline()}">2026-04-15</dd>
        <dt class="col-sm-3">貨物種別</dt>
        <dd class="col-sm-9" th:text="${booking.cargoTypeLabel()}">一般貨物</dd>
        <dt class="col-sm-3">重量</dt>
        <dd class="col-sm-9" th:text="${booking.weight()} + ' kg'">1200.5 kg</dd>
        <dt class="col-sm-3">個数</dt>
        <dd class="col-sm-9" th:text="${booking.quantity()} ?: '-'">-</dd>
        <dt class="col-sm-3">寸法</dt>
        <dd class="col-sm-9"
            th:text="${booking.dimensions() != ''} ? ${booking.dimensions()} : '-'">-</dd>
        <dt class="col-sm-3">品名</dt>
        <dd class="col-sm-9"
            th:text="${booking.description() != ''} ? ${booking.description()} : '-'">-</dd>
      </dl>
    </div>
  </div>

  <div class="mt-3 d-flex gap-2">
    <a class="btn btn-outline-secondary" th:href="@{/bookings}">一覧に戻る</a>
    <!--/* ボタンの出し分けは集約の述語をそのまま使う（cancellable）。
           ここで状態名を並べると、遷移表の規則が画面にも散る */-->
    <form th:if="${booking.cancellable()}" th:action="@{/bookings/{id}/cancel(id=${booking.bookingId()})}"
          method="post" sec:authorize="hasRole('SALES')">
      <button type="submit" class="btn btn-outline-danger">キャンセル</button>
    </form>
  </div>
</main>
</body>
</html>
