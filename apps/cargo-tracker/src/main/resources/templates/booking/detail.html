<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予約詳細 - CargoTracker</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/header :: appHeader}"></nav>

<main>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>予約詳細</h4>
        <div class="d-flex gap-2">
            <a th:href="@{/handling/new(bookingId=${booking.id})}"
               class="btn btn-warning text-dark">荷役作業を記録</a>
            <a th:if="${booking.status.name() != 'CONFIRMED'}"
               th:href="@{/routings/search(bookingId=${booking.id})}"
               class="btn btn-success">ルート検索</a>
            <a th:href="@{/quotes/new(
                    originLocode=${booking.transportCondition.originLocation},
                    destinationLocode=${booking.transportCondition.destinationLocation},
                    requestedArrivalDate=${booking.transportCondition.requestedDeliveryDate},
                    cargoType=${booking.cargoSpecification.cargoType},
                    weightKg=${booking.cargoSpecification.weightKg}
                )}"
               class="btn btn-primary">この条件で見積を作成</a>
            <form th:if="${booking.status.name() == 'PROVISIONAL' and booking.assignedRoute != null}"
                  th:action="@{/bookings/{id}/confirm(id=${booking.id})}" method="post" class="d-inline">
                <button type="submit" class="btn btn-success">予約を確定する</button>
            </form>
            <a th:href="@{/bookings}" class="btn btn-outline-secondary">一覧に戻る</a>
        </div>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0">予約番号: <code th:text="${booking.id}"></code></h5>
            <span class="badge fs-6"
                  th:classappend="${booking.status.name() == 'SETTLED'} ? 'bg-primary' :
                                 (${booking.status.name() == 'CONFIRMED'} ? 'bg-success' : 'bg-warning text-dark')"
                  data-testid="booking-status-badge"
                  th:text="${booking.status.displayName}"></span>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6">
                    <h6 class="text-muted mb-3">荷主情報</h6>
                    <dl class="row">
                        <dt class="col-sm-4">荷主名</dt>
                        <dd class="col-sm-8">
                            <div class="fw-semibold" th:text="${shipperName}"></div>
                            <div class="small text-muted">ID: <code th:text="${booking.shipperId}"></code></div>
                        </dd>
                    </dl>
                </div>
            </div>

            <hr>

            <div class="row">
                <div class="col-md-6">
                    <h6 class="text-muted mb-3">貨物仕様</h6>
                    <dl class="row">
                        <dt class="col-sm-5">貨物種別</dt>
                        <dd class="col-sm-7" th:text="${booking.cargoSpecification.cargoType.displayName}"></dd>

                        <dt class="col-sm-5">重量 (kg)</dt>
                        <dd class="col-sm-7" th:text="${booking.cargoSpecification.weightKg}"></dd>

                        <dt class="col-sm-5">寸法 (cm)</dt>
                        <dd class="col-sm-7">
                            <span th:if="${booking.cargoSpecification.lengthCm != null}"
                                  th:text="${booking.cargoSpecification.lengthCm + ' × ' + booking.cargoSpecification.widthCm + ' × ' + booking.cargoSpecification.heightCm}"></span>
                            <span th:if="${booking.cargoSpecification.lengthCm == null}" class="text-muted">-</span>
                        </dd>

                        <dt class="col-sm-5">個数</dt>
                        <dd class="col-sm-7" th:text="${booking.cargoSpecification.quantity}"></dd>

                        <dt class="col-sm-5">品名</dt>
                        <dd class="col-sm-7" th:text="${booking.cargoSpecification.description ?: '-'}"></dd>

                        <!-- 危険物条件 -->
                        <dt class="col-sm-5" th:if="${booking.cargoSpecification.unNumber != null}">UN 番号</dt>
                        <dd class="col-sm-7" th:if="${booking.cargoSpecification.unNumber != null}"
                            th:text="${booking.cargoSpecification.unNumber}"></dd>

                        <dt class="col-sm-5" th:if="${booking.cargoSpecification.hazardClass != null}">危険品等級</dt>
                        <dd class="col-sm-7" th:if="${booking.cargoSpecification.hazardClass != null}"
                            th:text="${booking.cargoSpecification.hazardClass}"></dd>

                        <!-- 冷凍条件 -->
                        <dt class="col-sm-5" th:if="${booking.cargoSpecification.minTempCelsius != null}">温度帯 (℃)</dt>
                        <dd class="col-sm-7" th:if="${booking.cargoSpecification.minTempCelsius != null}"
                            th:text="${booking.cargoSpecification.minTempCelsius + ' 〜 ' + booking.cargoSpecification.maxTempCelsius}"></dd>
                    </dl>
                </div>

                <div class="col-md-6">
                    <h6 class="text-muted mb-3">輸送条件</h6>
                    <dl class="row">
                        <dt class="col-sm-5">出発地</dt>
                        <dd class="col-sm-7" th:text="${booking.transportCondition.originLocation}"></dd>

                        <dt class="col-sm-5">目的地</dt>
                        <dd class="col-sm-7" th:text="${booking.transportCondition.destinationLocation}"></dd>

                        <dt class="col-sm-5">希望引渡日</dt>
                        <dd class="col-sm-7" th:text="${booking.transportCondition.requestedPickupDate}"></dd>

                        <dt class="col-sm-5">希望着日</dt>
                        <dd class="col-sm-7" th:text="${booking.transportCondition.requestedDeliveryDate}"></dd>
                    </dl>
                </div>
            </div>
        </div>
    </div>

    <!-- 追跡番号 -->
    <div th:if="${trackingNumber != null}" class="card shadow-sm mb-4">
        <div class="card-header bg-white fw-semibold">追跡番号</div>
        <div class="card-body">
            <h5>
                <a th:href="@{/tracking/{num}(num=${trackingNumber})}"
                   class="text-decoration-none">
                    <code class="fs-5 text-success"
                          data-testid="tracking-number"
                          th:text="${trackingNumber}"></code>
                </a>
            </h5>
            <small class="text-muted">クリックして輸送状況を確認できます。</small>
        </div>
    </div>

    <!-- 割り当て済みルート -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-white">割り当て済みルート</div>
        <div class="card-body">
            <div th:if="${booking.assignedRoute != null}">
                <div class="row mb-2">
                    <div class="col-sm-3 fw-bold">航海番号</div>
                    <div class="col-sm-9" th:text="${booking.assignedRoute.voyageNumber}"></div>
                </div>
                <div class="row mb-2">
                    <div class="col-sm-3 fw-bold">ルートパス</div>
                    <div class="col-sm-9" th:text="${booking.assignedRoute.routePath}"></div>
                </div>
                <div class="row mb-2">
                    <div class="col-sm-3 fw-bold">推定着日</div>
                    <div class="col-sm-9" th:text="${booking.assignedRoute.estimatedArrival}"></div>
                </div>
            </div>
            <div th:if="${booking.assignedRoute == null}" class="text-muted">未割り当て</div>
        </div>
    </div>
</div>
</main>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
