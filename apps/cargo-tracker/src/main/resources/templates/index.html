<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargo Tracker</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar('dashboard')}"></div>
<div class="container mt-4">
    <h1 class="h3 mb-1">ダッシュボード</h1>
    <p class="text-secondary lead">International Cargo Tracking System</p>
    <div class="row mt-4 g-3">
        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title">予約管理</h5>
                    <p class="card-text text-secondary">貨物予約の登録・確認を行います。</p>
                    <a th:href="@{/bookings}" class="btn btn-primary">予約管理へ</a>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title">荷主管理</h5>
                    <p class="card-text text-secondary">荷主情報の登録・管理を行います。</p>
                    <a th:href="@{/shippers}" class="btn btn-primary">荷主管理へ</a>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>
</body>
</html>
