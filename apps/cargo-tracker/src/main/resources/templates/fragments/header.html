<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ja">
<body>
<nav th:fragment="appHeader" class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">CargoTracker</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#globalNavbar"
                aria-controls="globalNavbar" aria-expanded="false" aria-label="ナビゲーションメニューを開く">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="globalNavbar">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link text-white" th:href="@{/shippers}">荷主</a></li>
                <li class="nav-item"><a class="nav-link text-white" th:href="@{/bookings}">予約</a></li>
                <li class="nav-item"><a class="nav-link text-white" th:href="@{/quotes}">見積</a></li>
                <li class="nav-item dropdown">
                    <a class="nav-link text-white dropdown-toggle" href="#" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">荷役</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/handling}">荷役一覧</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" th:href="@{/handling/receive}">引取記録</a></li>
                        <li><a class="dropdown-item" th:href="@{/handling/manual-update}">手動更新</a></li>
                    </ul>
                </li>
            </ul>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text text-white me-3" sec:authentication="name"></span>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light btn-sm">ログアウト</button>
                </form>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
