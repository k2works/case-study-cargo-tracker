<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>追跡詳細 | Cargo Tracker</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<nav th:replace="~{layout/nav :: navbar}"></nav>
<main class="container py-4" style="max-width: 40rem;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">追跡詳細</h1>
    <!--/* **別の番号を続けて調べる導線を残す。** 荷主は複数の貨物を持つ */-->
    <a class="btn btn-outline-secondary btn-sm" th:href="@{/tracking}">別の番号を調べる</a>
  </div>

  <div th:replace="~{tracking/_result :: result(${tracking})}"></div>
</main>
</body>
</html>
