<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>見積一覧 - Cargo Tracker</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">Cargo Tracker</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="ナビゲーションメニューを開く">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <div class="navbar-nav me-auto">
                <a class="nav-link text-white" th:href="@{/bookings}">予約</a>
                <a class="nav-link text-white active" th:href="@{/quotes}">見積</a>
            </div>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text text-white me-3" sec:authentication="name"></span>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light btn-sm">ログアウト</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<main>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>見積一覧</h4>
        <a th:href="@{/quotes/new}" class="btn btn-primary">新規見積</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" role="alert" aria-live="polite"
         th:text="${successMessage}"></div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th scope="col">見積番号</th>
                    <th scope="col">出発地</th>
                    <th scope="col">目的地</th>
                    <th scope="col">貨物種別</th>
                    <th scope="col">重量 (kg)</th>
                    <th scope="col">希望着日</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(quotes)}">
                    <td colspan="6" class="text-center text-muted py-4">見積が登録されていません</td>
                </tr>
                <tr th:each="quote : ${quotes}">
                    <td>
                        <a th:href="@{/quotes/{id}(id=${quote.id.value()})}"
                           th:text="${quote.quoteNumber.value()}"></a>
                    </td>
                    <td th:text="${quote.condition.originLocode()}"></td>
                    <td th:text="${quote.condition.destinationLocode()}"></td>
                    <td th:text="${quote.condition.cargoType().displayName}"></td>
                    <td th:text="${quote.condition.weightKg()}"></td>
                    <td th:text="${quote.condition.requestedArrivalDate()}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</main>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
