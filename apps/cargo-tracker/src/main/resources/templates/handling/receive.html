<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>引取記録 - CargoTracker</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/header :: appHeader}"></nav>
<main>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h4 class="card-title mb-0">引取記録</h4>
                </div>
                <div class="card-body">
                    <div class="alert alert-info small">
                        この画面では荷物の引取（RECEIVE）イベントを記録します。同一予約での引取は 1 回のみ記録できます。
                    </div>
                    <div th:if="${errorMessage}" class="alert alert-danger" data-testid="error-message"
                         th:text="${errorMessage}"></div>
                    <form th:action="@{/handling/receive}" method="post" th:object="${form}">
                        <input type="hidden" name="eventType" value="RECEIVE">
                        <div class="mb-3 row">
                            <label for="bookingId" class="col-sm-3 col-form-label">予約 ID <span class="text-danger">*</span></label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" id="bookingId" name="bookingId"
                                       th:value="*{bookingId}"
                                       th:classappend="${#fields.hasErrors('bookingId')} ? 'is-invalid'"
                                       placeholder="例: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
                                       inputmode="text" spellcheck="false" required>
                                <div th:if="${#fields.hasErrors('bookingId')}" class="invalid-feedback"
                                     th:errors="*{bookingId}" data-testid="booking-id-error"></div>
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label for="locationCode" class="col-sm-3 col-form-label">場所コード <span class="text-danger">*</span></label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" id="locationCode" name="locationCode"
                                       th:value="*{locationCode}"
                                       th:classappend="${#fields.hasErrors('locationCode')} ? 'is-invalid'"
                                       placeholder="例: JPTYO" maxlength="5" required>
                                <div th:if="${#fields.hasErrors('locationCode')}" class="invalid-feedback"
                                     th:errors="*{locationCode}"></div>
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label for="completionTime" class="col-sm-3 col-form-label">完了日時 <span class="text-danger">*</span></label>
                            <div class="col-sm-6">
                                <input type="datetime-local" class="form-control" id="completionTime" name="completionTime"
                                       th:value="*{completionTime}"
                                       th:classappend="${#fields.hasErrors('completionTime')} ? 'is-invalid'" required>
                                <div th:if="${#fields.hasErrors('completionTime')}" class="invalid-feedback"
                                     th:errors="*{completionTime}"></div>
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label for="receiveConfirmationCode" class="col-sm-3 col-form-label">引取確認コード <span class="text-danger">*</span></label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" id="receiveConfirmationCode" name="receiveConfirmationCode"
                                       th:value="*{receiveConfirmationCode}"
                                       th:classappend="${#fields.hasErrors('receiveConfirmationCode')} ? 'is-invalid'"
                                       placeholder="例: RC-20260403-001" data-testid="receive-confirmation-code" required>
                                <div th:if="${#fields.hasErrors('receiveConfirmationCode')}" class="invalid-feedback"
                                     th:errors="*{receiveConfirmationCode}" data-testid="receive-confirmation-code-error"></div>
                                <div class="form-text">荷受人確認のため、署名または確認コードの代わりに確認コードを記録します。</div>
                            </div>
                        </div>
                        <div class="mb-3 row">
                            <label for="memo" class="col-sm-3 col-form-label">メモ</label>
                            <div class="col-sm-9">
                                <textarea class="form-control" id="memo" name="memo" rows="3"
                                          th:text="*{memo}" placeholder="任意メモ"></textarea>
                            </div>
                        </div>
                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a th:href="@{/handling}" class="btn btn-outline-secondary">戻る</a>
                            <button type="submit" class="btn btn-success" data-testid="submit-receive">引取を記録</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</main>
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
