<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>引取記録の訂正・取り消し | Cargo Tracker</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<nav th:replace="~{layout/nav :: navbar}"></nav>
<main class="container py-4">
  <div th:replace="~{fragments/alerts :: alerts}"></div>
  <h1 class="h4 mb-3">引取記録の訂正・取り消しを申請する</h1>

  <!--/* **申請と承認を分ける。** 現場が自分で取り消せると、
         引き渡しの証明（US35）が現場の判断で消せることになる */-->
  <div class="alert alert-info">
    申請は<strong>追跡管理者の承認</strong>を経てから反映されます。
    取り消しが承認されると、貨物の状態は引取前に戻ります。
  </div>

  <form method="post" th:action="@{/handling/corrections}" class="card bg-white">
    <div class="card-body">
      <input type="hidden" name="handlingId" th:value="${handlingId}">

      <div class="mb-3">
        <label class="form-label" for="type">申請の種別</label>
        <select class="form-select" id="type" name="type">
          <option th:each="t : ${types}" th:value="${t.name()}"
                  th:text="${t.displayName()}">取り消し</option>
        </select>
        <div class="form-text">
          取り消しは貨物の状態を引取前に戻します。訂正は記録の中身を直します。
        </div>
      </div>

      <!--/* **訂正は直す中身を伴う。** 種別だけを選べて中身を入れられないと、
             承認しても何も起きない申請が待ち行列に並ぶ。
             取り消しでは使わないため、種別に応じて出し分ける */-->
      <div id="correctedFields" class="border rounded p-3 mb-3 bg-light">
        <p class="form-text mb-2">
          <strong>訂正の場合のみ</strong>入力します。空欄のままにした項目は変わりません。
        </p>
        <div class="mb-3">
          <label class="form-label" for="correctedCompletionTime">作業日時（訂正後）</label>
          <input type="datetime-local" class="form-control"
                 id="correctedCompletionTime" name="correctedCompletionTime">
        </div>
        <div class="mb-0">
          <label class="form-label" for="correctedNote">メモ（訂正後）</label>
          <input type="text" class="form-control" id="correctedNote" name="correctedNote"
                 placeholder="例: 代理受領のため">
        </div>
      </div>

      <!--/* **理由は必須である。** 理由の無い取り消しは、後から見ると
             「なぜ配送完了が取り消されたのか」が誰にも分からない */-->
      <div class="mb-3">
        <label class="form-label" for="reason">理由</label>
        <textarea class="form-control" id="reason" name="reason" rows="3"
                  placeholder="例: 別の貨物と取り違えて登録した"></textarea>
        <div class="form-text">承認する追跡管理者はこの理由だけを見て判断します。</div>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">申請する</button>
        <a class="btn btn-outline-secondary" th:href="@{/handling}">荷役作業一覧に戻る</a>
      </div>
    </div>
  </form>
</main>
<!--/* **入力できる項目を種別に合わせる。** 取り消しの申請で「作業日時（訂正後）」が
       出ていると、現場は何を入れるべきか迷う。
       JavaScript が動かない環境でも**入力欄が見えるだけ**であり、
       サーバ側が種別で判断する（取り消しに訂正内容は指定できない） */-->
<script>
  (function () {
    var type = document.getElementById('type');
    var fields = document.getElementById('correctedFields');
    function sync() {
      fields.style.display = type.value === 'CORRECT' ? '' : 'none';
    }
    type.addEventListener('change', sync);
    sync();
  })();
</script>
</body>
</html>
