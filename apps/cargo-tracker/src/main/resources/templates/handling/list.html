<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>荷役作業一覧 | Cargo Tracker</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<nav th:replace="~{layout/nav :: navbar}"></nav>
<main class="container py-4">
  <div th:replace="~{fragments/alerts :: alerts}"></div>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">荷役作業一覧</h1>
    <a class="btn btn-primary" th:href="@{/handling/new}">新規登録</a>
    <!--/* **通関へ繋ぐ**（US29）。荷役を登録した直後にそのまま申告へ進めるのが
           業務の流れである。マニュアル 8.4 はこの導線を前提に書かれていた */-->
    <a class="btn btn-outline-secondary" th:href="@{/handling/customs}">通関申告</a>
  </div>

  <!--/* 空状態。0 件のとき理由と次アクションを示す（ui_design.md） */-->
  <div th:if="${activities.isEmpty()}" class="alert alert-info">
    荷役作業の記録はまだありません。
    <a th:href="@{/handling/new}">最初の作業を登録する</a>
  </div>

  <table th:unless="${activities.isEmpty()}" class="table table-hover bg-white">
    <thead>
      <tr>
        <!--/* 追跡番号を先頭に置く。**作業員が手にしているのはこれだけである**
               （予約 ID は紙にもラベルにも無い。IT6 レビュー H12） */-->
        <th>追跡番号</th><th>作業日時</th><th>種別</th><th>場所</th><th>航海番号</th>
        <th>予約 ID</th><th>受取人 / メモ</th><th>担当者</th>
      </tr>
    </thead>
    <tbody>
      <!--/* 並びは作業日時の新しい順。**登録した作業が先頭に出る**（ui_design.md）。
             自分が今スキャンした荷物を探し直させない */-->
      <tr th:each="a : ${activities}">
        <!--/* IT6 以前の記録は番号を持たない（V13 で追加した列）。
               **後から埋めない** — 記録されていたことと区別がつかなくなる */-->
        <td>
          <code th:text="${a.trackingNumber() != ''} ? ${a.trackingNumber()} : '-'">TRK-20260901-0001</code>
          <!--/* **現物に触る人が特別な取り扱いに気づけるようにする（US05）。**
                 申告を登録しても、船に積む人に伝わらなければ安全な輸送にならない */-->
          <span class="badge bg-danger" th:if="${a.needsSpecialHandling()}"
                th:text="${a.cargoTypeLabel()}">危険物</span>
        </td>
        <td th:text="${#temporals.format(a.completionTime(), 'yyyy-MM-dd HH:mm')}">2026-09-01 10:00</td>
        <td th:text="${a.typeLabel()}">積込</td>
        <td th:text="${a.locationUnlocode()}">JPOSA</td>
        <td th:text="${a.voyageNumber() != ''} ? ${a.voyageNumber()} : '-'">V001</td>
        <td><code th:text="${#strings.substring(a.bookingId(), 0, 8)}">bk</code></td>
        <!--/* **引き渡しの証明は残すだけでは足りない。**「受け取っていない」という
               クレームは数日〜数週間後に来る。そのとき画面に受取人が出ていないと、
               誰に渡したかを示せない（レビュー H3）。
               確認コードそのものは出さない（記録の照合用であり一覧に並べる値ではない） */-->
        <td>
          <span th:if="${a.hasClaimRecord()}" class="d-block">
            受取人: <strong th:text="${a.consigneeName()}">受取花子</strong>
          </span>
          <span th:if="${a.note() != ''}" class="d-block small text-muted"
                th:text="${a.note()}">代理受領のため</span>
          <span th:if="${!a.hasClaimRecord() and a.note() == ''}" class="text-muted">-</span>
        </td>
        <td th:text="${a.operatorName() != ''} ? ${a.operatorName()} : '-'">港湾太郎</td>
      </tr>
    </tbody>
  </table>
</main>
</body>
</html>
