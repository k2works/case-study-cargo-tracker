<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>荷役作業一覧 - CargoTracker</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/header :: appHeader}"></nav>

<main>
<div class="container">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-3">
        <div>
            <h4 class="mb-1">荷役作業一覧</h4>
            <p class="text-muted small mb-0">積み込み・荷降ろし・通関・積み替えの記録と確認を行います。</p>
        </div>
        <a th:href="@{/handling/new}" class="btn btn-primary align-self-start align-self-md-center">+ 新規荷役登録</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <!-- 検索フォーム -->
    <div class="card shadow-sm mb-3">
        <div class="card-body py-2">
            <form th:action="@{/handling}" method="get" class="row g-2 align-items-end">
                <div class="col-md-4">
                    <label for="bookingId" class="form-label small mb-1">予約 ID</label>
                    <input type="text" class="form-control form-control-sm" id="bookingId" name="bookingId"
                           th:value="${searchBookingId}"
                           placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
                </div>
                <div class="col-md-3">
                    <label for="eventType" class="form-label small mb-1">荷役種別</label>
                    <select class="form-select form-select-sm" id="eventType" name="eventType">
                        <option value="">すべて</option>
                        <option th:each="type : ${eventTypes}"
                                th:value="${type}"
                                th:text="${type.displayName}"
                                th:selected="${searchEventType == type}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="locationCode" class="form-label small mb-1">場所コード</label>
                    <input type="text" class="form-control form-control-sm" id="locationCode" name="locationCode"
                           th:value="${searchLocationCode}"
                           placeholder="例: JPTYO">
                </div>
                <div class="col-md-2 d-flex gap-1">
                    <button type="submit" class="btn btn-primary btn-sm w-100">検索</button>
                    <a th:href="@{/handling}" class="btn btn-outline-secondary btn-sm">クリア</a>
                </div>
            </form>
        </div>
    </div>

    <!-- 一覧テーブル -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th scope="col">作業</th>
                    <th scope="col">予約 ID</th>
                    <th scope="col">状態</th>
                    <th scope="col">メモ</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(handlingEvents)}">
                    <td colspan="4" class="text-center text-muted py-4">
                        <span th:if="${hasSearchFilter}">検索条件に一致する荷役作業はありません。条件を見直してください。</span>
                        <span th:unless="${hasSearchFilter}">荷役作業が登録されていません。新規荷役登録から記録を開始してください。</span>
                    </td>
                </tr>
                <tr th:each="event : ${handlingEvents}">
                    <td>
                        <div class="fw-semibold small" th:text="${event.eventType.displayName}"></div>
                        <div class="text-muted small" th:text="${#temporals.format(event.completionTime, 'yyyy-MM-dd HH:mm')}"></div>
                        <div class="text-muted small">場所: <span th:text="${event.locationCode}"></span></div>
                        <code class="small"
                              th:title="${event.id}"
                              th:text="${#strings.substring(event.id.toString(), 0, 8) + '...'}"></code>
                    </td>
                    <td>
                        <a th:href="@{/bookings/{id}(id=${event.bookingId})}"
                           class="small font-monospace"
                           th:title="${event.bookingId}"
                           th:text="${event.bookingId}"></a>
                    </td>
                    <td class="text-nowrap">
                        <span class="badge"
                              th:classappend="${event.eventType.name() == 'RECEIVE'} ? 'bg-info text-dark' :
                                             (${event.eventType.name() == 'LOAD'} ? 'bg-success' :
                                             (${event.eventType.name() == 'UNLOAD'} ? 'bg-warning text-dark' :
                                             (${event.eventType.name() == 'CUSTOMS'} ? 'bg-secondary' :
                                             (${event.eventType.name() == 'TRANSHIP'} ? 'bg-primary' : 'bg-dark'))))"
                              th:text="${event.eventType.displayName}"></span>
                        <div class="small text-muted mt-2" th:text="${event.locationCode}"></div>
                    </td>
                    <td class="small text-muted" th:text="${event.memo != null ? event.memo : '—'}"></td>
                </tr>
                </tbody>
            </table>
            </div>
        </div>
    </div>
</div>
</main>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
