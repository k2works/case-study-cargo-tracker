<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>荷役作業記録 - CargoTracker</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/header :: appHeader}"></nav>

<main>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h4 class="card-title mb-0">荷役作業記録</h4>
                </div>
                <div class="card-body">
                    <div class="alert alert-info small" role="note">
                        この画面では港湾オペレーター向けの荷役作業のみを記録します。
                        引取記録と手動更新は別導線で扱います。
                    </div>

                    <!-- 成功メッセージ -->
                    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
                    <!-- エラーメッセージ -->
                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                    <form th:action="@{/handling}" method="post" th:object="${form}">

                        <div class="mb-3 row">
                            <label for="bookingId" class="col-sm-3 col-form-label">予約 ID <span class="text-danger">*</span></label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" id="bookingId" name="bookingId"
                                       th:value="*{bookingId}"
                                       th:classappend="${#fields.hasErrors('bookingId')} ? 'is-invalid'"
                                       placeholder="例: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
                                       inputmode="text"
                                       spellcheck="false"
                                       aria-describedby="bookingIdHelp"
                                       required>
                                <div id="bookingIdHelp" class="form-text">
                                    予約詳細画面に表示される UUID 形式の予約 ID を入力してください。
                                </div>
                                <div th:if="${#fields.hasErrors('bookingId')}" class="invalid-feedback"
                                     th:errors="*{bookingId}"></div>
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="eventType" class="col-sm-3 col-form-label">荷役種別 <span class="text-danger">*</span></label>
                            <div class="col-sm-9">
                                <select class="form-select" id="eventType" name="eventType"
                                        th:classappend="${#fields.hasErrors('eventType')} ? 'is-invalid'"
                                        required>
                                    <option value="">-- 選択してください --</option>
                                    <option th:each="type : ${eventTypes}"
                                            th:value="${type}"
                                            th:text="${type.displayName}"
                                            th:selected="${form.eventType == type}"></option>
                                </select>
                                <div th:if="${#fields.hasErrors('eventType')}" class="invalid-feedback"
                                     th:errors="*{eventType}"></div>
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="locationCode" class="col-sm-3 col-form-label">場所コード <span class="text-danger">*</span></label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" id="locationCode" name="locationCode"
                                       th:value="*{locationCode}"
                                       th:classappend="${#fields.hasErrors('locationCode')} ? 'is-invalid'"
                                       placeholder="例: JPTYO"
                                       pattern="[A-Z]{2}[A-Z0-9]{3}"
                                       maxlength="5"
                                       style="text-transform: uppercase;"
                                       inputmode="text"
                                       spellcheck="false"
                                       aria-describedby="locationCodeHelp"
                                       required>
                                <div id="locationCodeHelp" class="form-text">
                                    5 文字の UN/LOCODE を入力してください。例: JPTYO
                                </div>
                                <div th:if="${#fields.hasErrors('locationCode')}" class="invalid-feedback"
                                     th:errors="*{locationCode}"></div>
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="completionTime" class="col-sm-3 col-form-label">完了日時 <span class="text-danger">*</span></label>
                            <div class="col-sm-6">
                                <input type="datetime-local" class="form-control" id="completionTime" name="completionTime"
                                       th:value="*{completionTime}"
                                       th:classappend="${#fields.hasErrors('completionTime')} ? 'is-invalid'"
                                       aria-describedby="completionTimeHelp"
                                       required>
                                <div id="completionTimeHelp" class="form-text">
                                    港湾オペレーションで確定した現地時刻を入力してください。
                                </div>
                                <div th:if="${#fields.hasErrors('completionTime')}" class="invalid-feedback"
                                     th:errors="*{completionTime}"></div>
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="memo" class="col-sm-3 col-form-label">メモ</label>
                            <div class="col-sm-9">
                                <textarea class="form-control" id="memo" name="memo"
                                          rows="3"
                                          th:text="*{memo}"
                                          placeholder="任意メモ"></textarea>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a th:href="@{/handling}" class="btn btn-outline-secondary">戻る</a>
                            <button type="submit" class="btn btn-primary">荷役作業を記録</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</main>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
