<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>予定ルート外の作業の確認 | Cargo Tracker</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<nav th:replace="~{layout/nav :: navbar}"></nav>
<main class="container py-4">

  <h1 class="h4 mb-3">予定ルート外の作業です</h1>

  <!--/* **登録前に伝える**（US28）。記録してから知らせるのでは、
         作業員は取り消す手段を持たない（取り消しは US36 でまだ無い） */-->
  <div class="alert alert-warning">
    <p class="mb-2" th:text="${misrouteWarning}">予定ルートに無い積込です</p>
    <p class="mb-0">
      このまま登録すると<strong>誤配として記録され、追跡管理者に例外が起票されます</strong>。
      貨物は予定と違う港にあることになり、経路の引き直しが必要になります。
    </p>
  </div>

  <table class="table bg-white">
    <tbody>
      <tr><th style="width: 12rem;">追跡番号</th>
          <td><code th:text="${handlingForm.trackingNumber}">TRK-20260901-0001</code></td></tr>
      <tr><th>荷役種別</th><td th:text="${handlingForm.type}">LOAD</td></tr>
      <tr><th>作業場所</th><td th:text="${handlingForm.locationUnlocode}">FRLEH</td></tr>
      <tr><th>航海番号</th><td th:text="${handlingForm.voyageNumber}">V0099</td></tr>
      <tr><th>作業日時</th>
          <td th:text="${#temporals.format(handlingForm.completionTime, 'yyyy-MM-dd HH:mm')}">-</td></tr>
    </tbody>
  </table>

  <div class="d-flex gap-2">
    <!--/* 承認して登録する。**入力はすべて持ち回る** — 作業員に打ち直させない */-->
    <form method="post" th:action="@{/handling}">
      <input type="hidden" name="trackingNumber" th:value="${handlingForm.trackingNumber}">
      <input type="hidden" name="type" th:value="${handlingForm.type}">
      <input type="hidden" name="locationUnlocode" th:value="${handlingForm.locationUnlocode}">
      <input type="hidden" name="voyageNumber" th:value="${handlingForm.voyageNumber}">
      <input type="hidden" name="completionTime"
             th:value="${#temporals.format(handlingForm.completionTime, 'yyyy-MM-dd''T''HH:mm')}">
      <input type="hidden" name="confirmationCode" th:value="${handlingForm.confirmationCode}">
      <input type="hidden" name="consigneeName" th:value="${handlingForm.consigneeName}">
      <input type="hidden" name="note" th:value="${handlingForm.note}">
      <input type="hidden" name="operatorName" th:value="${handlingForm.operatorName}">
      <input type="hidden" name="acknowledged" value="true">
      <button class="btn btn-warning" type="submit">承認して登録する</button>
    </form>
    <!--/* **やめる側も同じ入力を持って戻る。** 打ち直させると、
           入力し直すより「承認して登録」を押すほうが楽になってしまう */-->
    <form method="get" th:action="@{/handling/new}">
      <input type="hidden" name="trackingNumber" th:value="${handlingForm.trackingNumber}">
      <button class="btn btn-outline-secondary" type="submit">入力に戻る</button>
    </form>
  </div>
</main>
</body>
</html>
