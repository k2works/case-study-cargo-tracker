<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">
<body>
<!--/*
  ナビゲーション。表示ロールの正典は ui_design.md のナビゲーション構成。
  ロールに該当しない項目はサーバ側で出さない（sec:authorize）。
*/-->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">Cargo Tracker</a>
    <div class="navbar-nav me-auto" sec:authorize="isAuthenticated()">
      <a class="nav-link" th:href="@{/}">ダッシュボード</a>
      <a class="nav-link" th:href="@{/shippers}" sec:authorize="hasRole('SALES')">荷主管理</a>
      <a class="nav-link" th:href="@{/bookings}" sec:authorize="hasRole('SALES')">貨物予約</a>
      <a class="nav-link" th:href="@{/routing/queue}"
         sec:authorize="hasRole('ROUTER')">経路設計</a>
      <a class="nav-link" th:href="@{/voyages}" sec:authorize="hasRole('ROUTER')">航路管理</a>
      <!--/* 追跡（US14）。**確定した予約はここに現れる**（ADR-006 により通知は送らない） */-->
      <a class="nav-link" th:href="@{/tracking/queue}"
         sec:authorize="hasRole('TRACKER')">追跡管理</a>
      <!--/* 貨物追跡（US18）。**荷主・荷受人がこのシステムで使う唯一の画面である。**
             追跡管理者にも出す（発行した番号をそのまま照会できる） */-->
      <a class="nav-link" th:href="@{/tracking}"
         sec:authorize="hasAnyRole('SHIPPER','CONSIGNEE','TRACKER')">貨物追跡</a>
      <!--/* 荷役（US15）。**現場が使う唯一の画面である** */-->
      <a class="nav-link" th:href="@{/handling}"
         sec:authorize="hasRole('HANDLER')">荷役管理</a>
      <!--/* 管理（US33）。**機能を作っても導線が無ければ誰も使えない** */-->
      <a class="nav-link" th:href="@{/admin/accounts}"
         sec:authorize="hasRole('ADMIN')">アカウント管理</a>
    </div>
    <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
      <button class="btn btn-outline-light btn-sm" type="submit">ログアウト</button>
    </form>
  </div>
</nav>
</body>
</html>
