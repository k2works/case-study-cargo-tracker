<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">
<body>
<!--/*
  ナビゲーション。表示ロールの正典は ui_design.md のナビゲーション構成。
  ロールに該当しない項目はサーバ側で出さない（sec:authorize）。
*/-->
<!--/* **フラグメントを th:block で包む。** 帯とスクリプトを navbar と一緒に返すため。
       呼び出し側は `<nav th:replace="~{layout/nav :: navbar}">` のままでよい
       （置換される側のタグは捨てられる）。

       **帯をここに置く理由。** この画面群には共通のレイアウトが無く（layout/main.html は
       どこからも参照されていない）、**全画面に一度で差し込める場所はここだけ**である。
       帯の出ない画面ができると、そこからはデモモードを止められない。 */-->
<th:block th:fragment="navbar">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">Cargo Tracker</a>
    <div class="navbar-nav me-auto" sec:authorize="isAuthenticated()">
      <a class="nav-link" th:href="@{/}">ダッシュボード</a>
      <!--/* 見積（US01）。**予約の前段である** — 荷主に予算と納期を伝える入口 */-->
      <a class="nav-link" th:href="@{/estimates}" sec:authorize="hasRole('SALES')">見積管理</a>
      <a class="nav-link" th:href="@{/shippers}" sec:authorize="hasRole('SALES')">荷主管理</a>
      <a class="nav-link" th:href="@{/bookings}" sec:authorize="hasRole('SALES')">貨物予約</a>
      <a class="nav-link" th:href="@{/routing/queue}"
         sec:authorize="hasRole('ROUTER')">経路設計</a>
      <a class="nav-link" th:href="@{/voyages}" sec:authorize="hasRole('ROUTER')">航路管理</a>
      <!--/* 追跡（US14）。**確定した予約はここに現れる**（ADR-006 により通知は送らない） */-->
      <a class="nav-link" th:href="@{/tracking/queue}"
         sec:authorize="hasRole('TRACKER')">追跡管理</a>
      <!--/* 例外管理（US19 / US20）。**追跡管理者の作業入口である**
             （ui_design.md ナビゲーション構成） */-->
      <a class="nav-link" th:href="@{/tracking/exceptions}"
         sec:authorize="hasRole('TRACKER')">例外管理</a>
      <!--/* エスカレーション中の例外（US20）。**管理者が見る唯一の入口である。**
             送っただけで誰も見ないなら、エスカレーションに意味は無い */-->
      <a class="nav-link" th:href="@{/tracking/exceptions/escalated}"
         sec:authorize="hasRole('ADMIN')">エスカレーション</a>
      <!--/* 貨物追跡（US18）。**荷主・荷受人がこのシステムで使う唯一の画面である。**
             追跡管理者にも出す（発行した番号をそのまま照会できる） */-->
      <a class="nav-link" th:href="@{/tracking}"
         sec:authorize="hasAnyRole('SHIPPER','CONSIGNEE','TRACKER')">貨物追跡</a>
      <!--/* 荷主の作業入口（US34）。**ダッシュボードのカードだけでは、
             一覧から離れた画面から戻る手段が無い** */-->
      <a class="nav-link" th:href="@{/bookings}"
         sec:authorize="hasRole('SHIPPER')">自社の予約</a>
      <!--/* 荷役（US15）。**現場が使う唯一の画面である** */-->
      <a class="nav-link" th:href="@{/handling}"
         sec:authorize="hasAnyRole('HANDLER','TRACKER')">荷役管理</a>
      <!--/* 通関（US29）。荷役作業員が登録し、追跡管理者が状態を追う。
             **通関は引き渡しを止める唯一の仕組みであり、両者が見る** */-->
      <a class="nav-link" th:href="@{/handling/customs}"
         sec:authorize="hasAnyRole('HANDLER', 'TRACKER')">通関管理</a>
      <!--/* **ここに <li> を置かない**（IT13 で発見）。navbar-nav は flex コンテナであり、
             直下の要素が横に並ぶ。<ul> の無い <li> を挟むと、
             **そこから下の項目が 1 つの塊として縦に積まれる**。
             IT12 で混入し、IT13 で請求の導線を足したことで目に見える形になった。
             **リンクが存在するかどうかの検査では判別しない** */-->
      <!--/* 訂正・取り消しの承認（US36）。**申請しただけでは仕事は終わらない。**
             承認する追跡管理者がこの画面に来られないと、承認待ちが積み上がる。
             荷役作業員も自分の申請の行方を読める */-->
      <a class="nav-link" th:href="@{/handling/corrections}"
         sec:authorize="hasAnyRole('HANDLER', 'TRACKER')">訂正・取り消し</a>
      <!--/* キャンセル承認（US30）。**申請しただけでは仕事は終わらない。**
             承認する追跡管理者がこの画面に来られないと、輸送中の貨物の
             キャンセルが宙に浮く。申請した営業担当者も行方を読める */-->
      <a class="nav-link" th:href="@{/bookings/cancellations}"
         sec:authorize="hasAnyRole('TRACKER', 'SALES')">キャンセル承認</a>
      <!--/* 請求管理（US21 / US22）。**請求対象一覧を先に置く。**
             請求書一覧はすでに請求書がある貨物しか出さないため、
             「これから請求するもの」にたどり着く道が無い */-->
      <a class="nav-link" th:href="@{/billing/pending}"
         sec:authorize="hasRole('BILLING')">請求対象</a>
      <a class="nav-link" th:href="@{/billing/invoices}"
         sec:authorize="hasRole('BILLING')">請求管理</a>
      <!--/* 管理（US33）。**機能を作っても導線が無ければ誰も使えない** */-->
      <a class="nav-link" th:href="@{/admin/accounts}"
         sec:authorize="hasRole('ADMIN')">アカウント管理</a>
    </div>
    <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
      <button class="btn btn-outline-light btn-sm" type="submit">ログアウト</button>
    </form>
  </div>
</nav>

<!--/* デモモードの帯（cargo-tracker.demo.mode）。**動いているあいだだけ出す。**

       止めているあいだも出ていると、動いているのか止まっているのか画面から
       判断できない。**止める手段と片付ける手段を同じ帯に置く** —— データが
       増える場所と減らせる場所が離れていると、片付けられることに気づかれない。 */-->
<div th:if="${demoModeRunning}" class="alert alert-warning border-0 rounded-0 mb-0 py-2"
     role="status" id="demo-mode-banner">
  <div class="container d-flex flex-wrap align-items-center gap-2">
    <span class="badge text-bg-warning">デモモード</span>
    <span class="small" id="demo-mode-summary">裏で業務が進んでいます</span>
    <span class="small text-muted flex-grow-1" id="demo-mode-latest"></span>
    <form th:action="@{/public/demo/stop}" method="post" class="d-inline">
      <button type="submit" class="btn btn-outline-dark btn-sm" id="demo-mode-stop">
        停止する
      </button>
    </form>
    <form th:action="@{/public/demo/reset}" method="post" class="d-inline">
      <button type="submit" class="btn btn-outline-danger btn-sm" id="demo-mode-reset">
        データを片付ける
      </button>
    </form>
  </div>
</div>

<script th:if="${demoModeRunning}" th:src="@{/js/demo-mode.js}"
        th:attr="data-status-url=@{/public/demo/status},
                 data-refresh-ms=${demoModeRefreshMs}"></script>
</th:block>
</body>
</html>
