<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>見積一覧 | Cargo Tracker</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<nav th:replace="~{layout/nav :: navbar}"></nav>
<main class="container py-4">
  <div th:replace="~{fragments/alerts :: alerts}"></div>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">見積一覧</h1>
    <a class="btn btn-primary" th:href="@{/estimates/new}">+ 新規見積作成</a>
  </div>

  <!--/* **空の表だけを見せない**（ui_design.md の空状態）。
         最初に開く人は必ず 0 件であり、そこで何をすればよいか分からないと
         画面を閉じてしまう */-->
  <div th:if="${estimates.isEmpty()}" class="alert alert-info">
    見積がまだありません。輸送条件から概算を作成できます。
    <a th:href="@{/estimates/new}">新規見積作成へ</a>
  </div>

  <!--/* **列が多い表は横に送る**（IT17 の R7）。列は隠さない */-->
  <div class="table-responsive" th:unless="${estimates.isEmpty()}">
    <table class="table table-sm align-middle">
      <thead>
        <tr><th>見積番号</th><th>出発地</th><th>目的地</th><th>希望期限</th>
            <th>貨物種別</th><th>重量</th><th>最安候補</th><th>状態</th><th>作成日</th></tr>
      </thead>
      <tbody>
        <tr th:each="e : ${estimates}">
          <td>
            <a th:href="@{/estimates/{id}(id=${e.estimateId()})}"
               th:text="${e.estimateId()}">EST-0001</a>
          </td>
          <td th:text="${e.route().origin()}">JPOSA</td>
          <td th:text="${e.route().destination()}">USLAX</td>
          <td th:text="${#temporals.format(e.deadline(), 'yyyy-MM-dd')}">2026-10-01</td>
          <td th:text="${e.cargo().typeLabel()}">一般貨物</td>
          <td class="text-end"
              th:text="${#numbers.formatInteger(e.cargo().weightKg(), 0, 'COMMA')} + ' kg'">1,000 kg</td>
          <!--/* **候補が無い見積もある**（その区間を走る便が無い場合）。
                 空欄だと読み込めていないのか候補が無いのか分からない */-->
          <td class="text-end">
            <span th:if="${e.hasCheapest()}"
                  th:text="${#numbers.formatInteger(e.cheapest(), 0, 'COMMA')} + ' 円'">120,000 円</span>
            <span th:unless="${e.hasCheapest()}" class="text-muted">—</span>
          </td>
          <td>
            <!--/* **バッジの正典は EstimateStatus である。**
                   画面で色を決め直すと、状態を足したときに片方だけ古くなる */-->
            <span class="badge" th:classappend="${e.status().badge()}"
                  th:text="${e.status().label()}">作成済</span>
          </td>
          <td th:text="${#temporals.format(e.createdOn(), 'yyyy-MM-dd')}">2026-08-12</td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
