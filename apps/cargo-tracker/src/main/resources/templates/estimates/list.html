<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>見積一覧 | Cargo Tracker</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<nav th:replace="~{layout/nav :: navbar}"></nav>
<main class="container py-4">
  <div th:replace="~{fragments/alerts :: alerts}"></div>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">見積一覧</h1>
    <a class="btn btn-primary" th:href="@{/estimates/new}">+ 新規見積作成</a>
  </div>

  <!--/* **絞り込み**（ui_design.md「見積一覧」。IT19 の C4）。
         期限切れが混ざったままだと、どれがまだ使えるのか分からず
         **一覧全体が信用されない**。
         **規則は application 層が持つ**（ADR-022）。ここは条件を送るだけである */-->
  <form class="row g-2 align-items-end mb-3" method="get" th:action="@{/estimates}">
    <div class="col-auto">
      <label class="form-label" for="origin">出発地</label>
      <input type="text" class="form-control" id="origin" name="origin"
             maxlength="5" placeholder="JPOSA" th:value="${criteria.origin()}">
    </div>
    <div class="col-auto">
      <label class="form-label" for="destination">目的地</label>
      <input type="text" class="form-control" id="destination" name="destination"
             maxlength="5" placeholder="USLAX" th:value="${criteria.destination()}">
    </div>
    <div class="col-auto">
      <label class="form-label" for="createdFrom">作成日（から）</label>
      <input type="date" class="form-control" id="createdFrom" name="createdFrom"
             th:value="${criteria.createdFrom()}">
    </div>
    <div class="col-auto">
      <label class="form-label" for="createdTo">作成日（まで）</label>
      <input type="date" class="form-control" id="createdTo" name="createdTo"
             th:value="${criteria.createdTo()}">
    </div>
    <div class="col-auto">
      <label class="form-label" for="status">状態</label>
      <select class="form-select" id="status" name="status">
        <option value="" th:selected="${criteria.status() == null
                                        or criteria.status().isBlank()}">すべて</option>
        <option value="CREATED" th:selected="${criteria.status() == 'CREATED'}">有効</option>
        <option value="EXPIRED" th:selected="${criteria.status() == 'EXPIRED'}">期限切れ</option>
      </select>
    </div>
    <div class="col-auto">
      <button type="submit" class="btn btn-outline-primary">絞り込む</button>
      <a class="btn btn-link" th:href="@{/estimates}">条件をクリア</a>
    </div>
  </form>

  <!--/* **空の表だけを見せない**（ui_design.md の空状態）。
         最初に開く人は必ず 0 件であり、そこで何をすればよいか分からないと
         画面を閉じてしまう。
         **絞り込んで 0 件だった人には別のことを言う** —— その人が変えたいのは
         条件であり、「新規作成へ」と促すのは筋が違う（IT19 の C4） */-->
  <div th:if="${estimates.isEmpty() and !filtered}" class="alert alert-info">
    見積がまだありません。輸送条件から概算を作成できます。
    <a th:href="@{/estimates/new}">新規見積作成へ</a>
  </div>
  <div th:if="${estimates.isEmpty() and filtered}" class="alert alert-warning">
    条件に一致する見積はありません。条件を変えてお試しください。
    <a th:href="@{/estimates}">条件をクリア</a>
  </div>

  <!--/* **列が多い表は横に送る**（IT17 の R7）。列は隠さない */-->
  <div class="table-responsive" th:unless="${estimates.isEmpty()}">
    <table class="table table-sm align-middle">
      <thead>
        <tr><th>見積番号</th><th>出発地</th><th>目的地</th><th>希望期限</th>
            <th>貨物種別</th><th>重量</th><th>最安候補</th><th>状態</th><th>作成日</th></tr>
      </thead>
      <tbody>
        <tr th:each="e : ${estimates}">
          <td>
            <a th:href="@{/estimates/{id}(id=${e.estimateId()})}"
               th:text="${e.estimateId()}">EST-0001</a>
          </td>
          <td th:text="${e.route().origin()}">JPOSA</td>
          <td th:text="${e.route().destination()}">USLAX</td>
          <td th:text="${#temporals.format(e.deadline(), 'yyyy-MM-dd')}">2026-10-01</td>
          <td th:text="${e.cargo().typeLabel()}">一般貨物</td>
          <td class="text-end"
              th:text="${#numbers.formatInteger(e.cargo().weightKg(), 0, 'COMMA')} + ' kg'">1,000 kg</td>
          <!--/* **候補が無い見積もある**（その区間を走る便が無い場合）。
                 空欄だと読み込めていないのか候補が無いのか分からない */-->
          <td class="text-end">
            <span th:if="${e.hasCheapest()}"
                  th:text="${#numbers.formatInteger(e.cheapest(), 0, 'COMMA')} + ' 円'">120,000 円</span>
            <span th:unless="${e.hasCheapest()}" class="text-muted">—</span>
          </td>
          <td>
            <!--/* **バッジの正典は EstimateStatus である。**
                   画面で色を決め直すと、状態を足したときに片方だけ古くなる */-->
            <span class="badge" th:classappend="${e.status().badge()}"
                  th:text="${e.status().label()}">作成済</span>
          </td>
          <td th:text="${#temporals.format(e.createdOn(), 'yyyy-MM-dd')}">2026-08-12</td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
