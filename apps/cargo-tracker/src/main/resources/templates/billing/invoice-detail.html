<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>精算書詳細 - CargoTracker</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/header :: appHeader}"></nav>

<main>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4">精算書詳細</h1>
        <a th:href="@{/invoices}" class="btn btn-outline-secondary">一覧に戻る</a>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <div class="card shadow-sm">
        <div class="card-body">
            <dl class="row">
                <dt class="col-sm-3">精算書 ID</dt>
                <dd class="col-sm-9"><code th:text="${invoice.id}"></code></dd>

                <dt class="col-sm-3">予約 ID</dt>
                <dd class="col-sm-9" th:text="${invoice.bookingId}"></dd>

                <dt class="col-sm-3">輸送料金 ID</dt>
                <dd class="col-sm-9"><code th:text="${invoice.freightChargeId}"></code></dd>

                <dt class="col-sm-3">金額</dt>
                <dd class="col-sm-9" th:text="${#numbers.formatDecimal(invoice.amount, 1, 'COMMA', 0, 'POINT')}"></dd>

                <dt class="col-sm-3">支払期限</dt>
                <dd class="col-sm-9" th:text="${#temporals.format(invoice.dueDate, 'yyyy-MM-dd')}"></dd>

                <dt class="col-sm-3">支払い状態</dt>
                <dd class="col-sm-9">
                    <span class="badge"
                          th:classappend="${invoice.paymentStatus == '支払い済み'} ? 'bg-success' : 'bg-warning text-dark'"
                          th:text="${invoice.paymentStatus}"></span>
                </dd>
            </dl>

            <div class="mt-3">
                <form th:if="${invoice.paymentStatus == '支払い待ち'}"
                      th:action="@{/invoices/{id}/confirm-payment(id=${invoice.id})}"
                      method="post"
                      class="d-inline">
                    <button type="submit"
                            class="btn btn-success"
                            data-testid="invoice-detail-confirm-payment-submit"
                            th:attr="aria-label='精算書 ' + ${invoice.id} + ' の支払いを確認'">支払い確認</button>
                </form>
            </div>
        </div>
    </div>
</div>
</main>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
