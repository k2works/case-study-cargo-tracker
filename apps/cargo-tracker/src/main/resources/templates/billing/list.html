<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>輸送料金一覧 - CargoTracker</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/header :: appHeader}"></nav>

<main>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4">輸送料金一覧</h1>
        <a th:href="@{/freight/calculate}" class="btn btn-primary">料金算出</a>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0" data-testid="freight-charge-table">
                <thead class="table-light">
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">予約 ID</th>
                    <th scope="col">ステータス</th>
                    <th scope="col">基本料金</th>
                    <th scope="col">調整額</th>
                    <th scope="col">合計</th>
                    <th scope="col">操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(freightCharges)}">
                    <td colspan="7" class="text-center text-muted py-4">輸送料金が登録されていません</td>
                </tr>
                <tr th:each="charge : ${freightCharges}" data-testid="freight-charge-row">
                    <td><code th:text="${charge.id}"></code></td>
                    <td th:text="${charge.bookingId}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${charge.status == '確定'} ? 'bg-success' : 'bg-warning text-dark'"
                              th:text="${charge.status}"></span>
                    </td>
                    <td th:text="${#numbers.formatDecimal(charge.baseAmount, 1, 'COMMA', 0, 'POINT')}"></td>
                    <td th:text="${#numbers.formatDecimal(charge.adjustmentAmount, 1, 'COMMA', 0, 'POINT')}"></td>
                    <td th:text="${#numbers.formatDecimal(charge.totalAmount, 1, 'COMMA', 0, 'POINT')}"></td>
                    <td>
                        <form th:if="${charge.status == '算出中'}"
                              th:action="@{/freight/{id}/apply-discount(id=${charge.id})}"
                              method="post"
                              class="d-inline">
                            <input type="hidden" name="bookingId" th:value="${charge.bookingId}" />
                            <button type="submit"
                                    class="btn btn-sm btn-outline-primary"
                                    data-testid="freight-discount-submit"
                                    th:attr="aria-label='予約 ' + ${charge.bookingId} + ' の法人割引を適用'">割引適用</button>
                        </form>
                        <form th:if="${charge.status == '算出中'}"
                              th:action="@{/freight/{id}/confirm(id=${charge.id})}"
                              method="post"
                              class="d-inline ms-1">
                            <button type="submit"
                                    class="btn btn-sm btn-outline-success"
                                    data-testid="freight-confirm-submit"
                                    th:attr="aria-label='予約 ' + ${charge.bookingId} + ' の料金を確定'"
                                    onclick="return confirm('この輸送料金を確定します。確定後は割引の変更ができません。よろしいですか？')">確定</button>
                        </form>
                        <form th:if="${charge.status == '確定'}"
                              th:action="@{/invoices}"
                              method="post"
                              class="d-inline ms-1">
                            <input type="hidden" name="bookingId" th:value="${charge.bookingId}" />
                            <input type="hidden" name="freightChargeId" th:value="${charge.id}" />
                            <button type="submit"
                                    class="btn btn-sm btn-outline-info"
                                    data-testid="freight-generate-invoice-submit"
                                    th:attr="aria-label='予約 ' + ${charge.bookingId} + ' の精算書を発行'">精算発行</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
            </div>
        </div>
    </div>
</div>
</main>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
