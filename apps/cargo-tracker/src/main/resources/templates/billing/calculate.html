<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>輸送料金算出 - CargoTracker</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/header :: appHeader}"></nav>

<main>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4">輸送料金算出</h1>
        <a th:href="@{/freight}" class="btn btn-outline-secondary">一覧に戻る</a>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/freight/calculate}" th:object="${form}" method="post">
                <div class="mb-3">
                    <label for="bookingId" class="form-label">予約 ID <span class="text-danger">*</span></label>
                    <input type="text"
                           id="bookingId"
                           data-testid="freight-booking-id"
                           th:field="*{bookingId}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('bookingId')} ? 'is-invalid'"
                           placeholder="確定済み予約の ID を入力してください">
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('bookingId')}"
                         th:errors="*{bookingId}">
                        予約 ID は必須です
                    </div>
                </div>

                <div th:if="${bookingSummary}" class="border rounded p-3 mb-3 bg-light" data-testid="freight-booking-summary">
                    <h5 class="mb-3">輸送実績</h5>
                    <dl class="row mb-0">
                        <dt class="col-sm-4">経路</dt>
                        <dd class="col-sm-8" data-testid="freight-route-path" th:text="${bookingSummary.routePath}"></dd>
                        <dt class="col-sm-4">距離</dt>
                        <dd class="col-sm-8" data-testid="freight-distance-km"
                            th:text="${#numbers.formatDecimal(bookingSummary.distanceKm, 1, 'COMMA', 0, 'POINT')} + ' km'"></dd>
                        <dt class="col-sm-4">重量</dt>
                        <dd class="col-sm-8" data-testid="freight-weight-kg"
                            th:text="${#numbers.formatDecimal(bookingSummary.weightKg, 1, 'COMMA', 0, 'POINT')} + ' kg'"></dd>
                        <dt class="col-sm-4">貨物種別</dt>
                        <dd class="col-sm-8" data-testid="freight-cargo-type" th:text="${bookingSummary.cargoType}"></dd>
                        <dt class="col-sm-4">荷役作業実績</dt>
                        <dd class="col-sm-8" data-testid="freight-handling-count" th:text="${bookingSummary.handlingEventCount} + ' 件'"></dd>
                    </dl>
                </div>

                <div class="mb-3">
                    <label for="adjustmentAmount" class="form-label">料金調整額</label>
                    <input type="number"
                           step="1"
                           id="adjustmentAmount"
                           data-testid="freight-adjustment-amount"
                           th:field="*{adjustmentAmount}"
                           class="form-control"
                           placeholder="例外発生時の減額や補償費用を入力">
                    <div class="form-text">例外がある場合に、減額または補償費用を入力できます。</div>
                </div>

                <button type="submit" class="btn btn-primary" data-testid="freight-calculate-submit">算出</button>
            </form>
        </div>
    </div>
</div>
</main>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
