<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>荷主一覧 - Cargo Tracker</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">Cargo Tracker</a>
        <div class="navbar-nav ms-auto">
            <span class="navbar-text text-white me-3" sec:authentication="name"></span>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-light btn-sm">ログアウト</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>荷主一覧</h4>
        <a th:href="@{/shippers/new}" class="btn btn-primary">新規登録</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>荷主 ID</th>
                    <th>氏名/社名</th>
                    <th>種別</th>
                    <th>メールアドレス</th>
                    <th>電話番号</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(shippers)}">
                    <td colspan="5" class="text-center text-muted py-4">荷主が登録されていません</td>
                </tr>
                <tr th:each="shipper : ${shippers}">
                    <td><code th:text="${shipper.id}"></code></td>
                    <td th:text="${shipper.name}"></td>
                    <td>
                        <span th:if="${shipper.category == 'INDIVIDUAL'}" class="badge bg-secondary">個人</span>
                        <span th:if="${shipper.category == 'CORPORATE'}" class="badge bg-primary">法人</span>
                    </td>
                    <td th:text="${shipper.email}"></td>
                    <td th:text="${shipper.phone ?: '-'}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
