<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>荷主一覧 | Cargo Tracker</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<nav th:replace="~{layout/nav :: navbar}"></nav>
<main class="container py-4">
  <div th:replace="~{fragments/alerts :: alerts}"></div>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">荷主一覧</h1>
    <a class="btn btn-primary" th:href="@{/shippers/new}">+ 新規荷主登録</a>
  </div>

  <!--/* 絞り込みは SQL 側で行う。件数が増えても全件を読み込まない（C3） */-->
  <form class="row g-2 mb-3" th:action="@{/shippers}" method="get">
    <div class="col-auto">
      <input type="text" class="form-control" name="keyword" th:value="${keyword}"
             placeholder="荷主名・荷主コード・メール" aria-label="検索キーワード">
    </div>
    <div class="col-auto"><button class="btn btn-outline-secondary" type="submit">検索</button></div>
    <div class="col-auto" th:if="${keyword != ''}">
      <a class="btn btn-link" th:href="@{/shippers}">条件をクリア</a>
    </div>
  </form>

  <!--/* 空状態。0 件のとき理由と次アクションを示す（ui_design.md） */-->
  <div th:if="${#lists.isEmpty(shippers)}" class="alert alert-info">
    <span th:if="${keyword != ''}">条件に一致する荷主がありません。</span>
    <span th:unless="${keyword != ''}">荷主が登録されていません。まず荷主を登録してください。</span>
  </div>

  <table th:unless="${#lists.isEmpty(shippers)}" class="table table-hover bg-white">
    <thead>
      <tr>
        <th>荷主コード</th><th>荷主名</th><th>種別</th><th>メール</th><th>操作</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="s : ${shippers}">
        <td th:text="${s.shipperCode()}">SHP-000001</td>
        <td th:text="${s.name()}">荷主名</td>
        <td>
          <span class="badge"
                th:classappend="${s.shipperType() == 'CORPORATE'} ? 'bg-primary' : 'bg-secondary'"
                th:text="${s.typeLabel()}">個人</span>
        </td>
        <td th:text="${s.email()}">mail@example.com</td>
        <td><a class="btn btn-sm btn-outline-primary"
               th:href="@{/shippers/{id}(id=${s.id()})}">詳細</a></td>
      </tr>
    </tbody>
  </table>
</main>
</body>
</html>
