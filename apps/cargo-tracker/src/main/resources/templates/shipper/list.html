<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>荷主一覧 | Cargo Tracker</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<nav th:replace="~{layout/nav :: navbar}"></nav>
<main class="container py-4">
  <div th:replace="~{fragments/alerts :: alerts}"></div>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">荷主一覧</h1>
    <a class="btn btn-primary" th:href="@{/shippers/new}">+ 新規荷主登録</a>
  </div>

  <!-- 空状態。0 件のとき理由と次アクションを示す（ui_design.md） -->
  <div th:if="${#lists.isEmpty(shippers)}" class="alert alert-info">
    荷主が登録されていません。まず荷主を登録してください。
  </div>

  <table th:unless="${#lists.isEmpty(shippers)}" class="table table-hover bg-white">
    <thead>
      <tr>
        <th>荷主コード</th><th>荷主名</th><th>種別</th><th>メール</th><th>操作</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="s : ${shippers}">
        <td th:text="${s.shipperCode().value()}">SHP-000001</td>
        <td th:text="${s.name().value()}">荷主名</td>
        <td>
          <span th:if="${s.isCorporate()}" class="badge bg-primary">法人</span>
          <span th:unless="${s.isCorporate()}" class="badge bg-secondary">個人</span>
        </td>
        <td th:text="${s.email().value()}">mail@example.com</td>
        <td><a class="btn btn-sm btn-outline-primary"
               th:href="@{/shippers/{id}(id=${s.id().value()})}">詳細</a></td>
      </tr>
    </tbody>
  </table>
</main>
</body>
</html>
