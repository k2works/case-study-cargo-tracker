<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>例外事象記録 - CargoTracker</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/header :: appHeader}"></nav>

<main class="py-4">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h4 class="card-title mb-0">例外事象記録</h4>
                </div>
                <div class="card-body">
                    <div class="alert alert-warning small" role="region" aria-label="業務説明">
                        この画面では輸送中に発生した遅延・破損・紛失の例外事象を記録します。
                        記録後、貨物の追跡情報に反映され、荷主への通知内容も履歴に残ります。
                    </div>

                    <!-- 成功メッセージ -->
                    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
                    <!-- エラーメッセージ -->
                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                    <form th:action="@{/exceptions/new}" method="post" th:object="${form}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="mb-3 row">
                            <label for="trackingNumber" class="col-sm-3 col-form-label">追跡番号 <span class="text-danger">*</span></label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" id="trackingNumber" name="trackingNumber"
                                       th:value="*{trackingNumber}"
                                       th:classappend="${#fields.hasErrors('trackingNumber')} ? 'is-invalid'"
                                       placeholder="例: TRK-AB123456"
                                       inputmode="text"
                                       spellcheck="false"
                                       required>
                                <div th:if="${#fields.hasErrors('trackingNumber')}" class="invalid-feedback"
                                     th:errors="*{trackingNumber}"></div>
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="exceptionType" class="col-sm-3 col-form-label">例外種別 <span class="text-danger">*</span></label>
                            <div class="col-sm-9">
                                <select class="form-select" id="exceptionType" name="exceptionType"
                                        th:classappend="${#fields.hasErrors('exceptionType')} ? 'is-invalid'"
                                        required>
                                    <option value="">-- 選択してください --</option>
                                    <option th:each="type : ${exceptionTypes}"
                                            th:value="${type}"
                                            th:text="${type.displayName}"
                                            th:selected="${form.exceptionType == type}"></option>
                                </select>
                                <div th:if="${#fields.hasErrors('exceptionType')}" class="invalid-feedback"
                                     th:errors="*{exceptionType}"></div>
                                <div class="form-text">「紛失」を選択した場合、緊急フラグが自動設定されます。</div>
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="locationCode" class="col-sm-3 col-form-label">発生場所コード</label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" id="locationCode" name="locationCode"
                                       th:value="*{locationCode}"
                                       placeholder="例: JPTYO"
                                       maxlength="5"
                                       style="text-transform: uppercase;"
                                       inputmode="text"
                                       spellcheck="false"
                                       aria-describedby="locationCodeHelp">
                                <div id="locationCodeHelp" class="form-text">5 文字の UN/LOCODE（任意）</div>
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="occurredAt" class="col-sm-3 col-form-label">発生日時 <span class="text-danger">*</span></label>
                            <div class="col-sm-6">
                                <input type="datetime-local" class="form-control" id="occurredAt" name="occurredAt"
                                       th:value="*{occurredAt}"
                                       th:classappend="${#fields.hasErrors('occurredAt')} ? 'is-invalid'"
                                       aria-describedby="occurredAtHelp"
                                       required>
                                <div id="occurredAtHelp" class="form-text">ローカル時刻（JST）で入力してください</div>
                                <div th:if="${#fields.hasErrors('occurredAt')}" class="invalid-feedback"
                                     th:errors="*{occurredAt}"></div>
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="reason" class="col-sm-3 col-form-label">発生理由・状況</label>
                            <div class="col-sm-9">
                                <textarea class="form-control" id="reason" name="reason"
                                          rows="3"
                                          th:text="*{reason}"
                                          placeholder="例: 悪天候による港湾閉鎖"></textarea>
                            </div>
                        </div>

                        <div class="mb-3 row">
                            <label for="resolution" class="col-sm-3 col-form-label">対応内容 <span class="text-danger">*</span></label>
                            <div class="col-sm-9">
                                <textarea class="form-control" id="resolution" name="resolution"
                                          data-testid="exception-resolution"
                                          rows="3"
                                          th:text="*{resolution}"
                                          th:classappend="${#fields.hasErrors('resolution')} ? 'is-invalid'"
                                          placeholder="例: 代替船を手配し、到着予定を 2026/06/05 に更新"
                                          required></textarea>
                                <div th:if="${#fields.hasErrors('resolution')}" class="invalid-feedback"
                                     th:errors="*{resolution}"></div>
                                <div class="form-text">新しい ETA や荷主への案内方針を入力します。</div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a th:href="@{/exceptions/new}" class="btn btn-outline-secondary">キャンセル</a>
                            <button type="submit" class="btn btn-primary" data-testid="submit-exception">例外事象を記録</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</main>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
