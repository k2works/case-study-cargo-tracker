<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ダッシュボード | Cargo Tracker</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<nav th:replace="~{layout/nav :: navbar}"></nav>
<main class="container py-4">
  <h1 class="h4 mb-4">ダッシュボード</h1>
  <p class="text-muted">
    ようこそ、<span sec:authentication="name">利用者</span> さん
  </p>

  <!--/*
    ロール別の作業入口。件数カードは IT2 以降で実装する。
    ここでロールごとの入口を用意しないと、引き渡された担当者が
    対象のレコードに到達できない（ui_design.md のロール別到達性）。
  */-->
  <!--/*
    入口が 1 つも無いロールに白紙を見せない。**「権限が付いていない」と受け取られる。**
    荷主一覧の空状態（shipper/list.html）と同じ考え方をダッシュボードにも適用する。
  */-->
  <div sec:authorize="!hasAnyRole('SALES','ROUTER')" class="alert alert-info">
    現在ご利用いただける機能はありません。<strong>あなたの担当業務は今後の提供で対応します。</strong>
    権限の問題ではありません。
  </div>

  <div class="row g-3">
    <div class="col-md-4" sec:authorize="hasRole('SALES')">
      <div class="card">
        <div class="card-body">
          <h2 class="h6">荷主管理</h2>
          <p class="text-muted small mb-2">荷主の登録と一覧</p>
          <a class="btn btn-primary btn-sm" th:href="@{/shippers}">開く</a>
        </div>
      </div>
    </div>
    <!--/* 経路設計者の作業入口。IT3 で ROLE_ROUTER に開く最初の画面である。
           US06 で引き渡された予約がここに現れる */-->
    <div class="col-md-4" sec:authorize="hasRole('ROUTER')">
      <div class="card">
        <div class="card-body">
          <h2 class="h6">経路設計</h2>
          <p class="text-muted small mb-2">経路割り当て待ちの予約</p>
          <a class="btn btn-primary btn-sm" th:href="@{/routing/queue}">開く</a>
        </div>
      </div>
    </div>
    <div class="col-md-4" sec:authorize="hasRole('ROUTER')">
      <div class="card">
        <div class="card-body">
          <h2 class="h6">航路管理</h2>
          <p class="text-muted small mb-2">航海スケジュールの登録と検索</p>
          <a class="btn btn-primary btn-sm" th:href="@{/voyages}">開く</a>
        </div>
      </div>
    </div>
    <!--/* 荷主には出さない。利用者アカウントと荷主の紐付けが無く、
           一覧を見せると他社の予約まで見える（non_functional.md は
           ROLE_SHIPPER を「自社予約・追跡（Phase 2）」と定めている） */-->
    <div class="col-md-4" sec:authorize="hasRole('SALES')">
      <div class="card">
        <div class="card-body">
          <h2 class="h6">貨物予約</h2>
          <p class="text-muted small mb-2">貨物予約の登録と一覧</p>
          <a class="btn btn-primary btn-sm" th:href="@{/bookings}">開く</a>
        </div>
      </div>
    </div>
  </div>
</main>
</body>
</html>
