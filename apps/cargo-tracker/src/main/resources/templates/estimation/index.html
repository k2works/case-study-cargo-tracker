<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>見積管理 - Cargo Tracker</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar('estimates')}"></div>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">見積管理</h1>
            <p class="text-secondary mb-0">輸送見積を作成・管理します。</p>
        </div>
        <a class="btn btn-primary" th:href="@{/estimates/new}">新規見積作成</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" aria-label="見積一覧">
                    <thead class="table-light">
                    <tr>
                        <th>見積番号</th>
                        <th>出発地</th>
                        <th>目的地</th>
                        <th>希望期限</th>
                        <th>貨物種別</th>
                        <th>状態</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(estimates)}">
                        <td colspan="7" class="text-center text-secondary py-4">登録済みの見積はありません。</td>
                    </tr>
                    <tr th:each="estimate : ${estimates}">
                        <td>
                            <span th:title="${estimate.estimateId}"
                                  th:text="${#strings.substring(estimate.estimateId.toString(), 0, 8) + '...'}">est-id</span>
                        </td>
                        <td th:text="${estimate.origin.unlocode}">JPTYO</td>
                        <td th:text="${estimate.destination.unlocode}">USNYC</td>
                        <td th:text="${estimate.arrivalDeadline}">2026-06-30</td>
                        <td th:text="${estimate.cargoType}">GENERAL</td>
                        <td>
                            <span class="badge text-bg-secondary"
                                  th:text="${estimate.status.displayName}">作成済</span>
                        </td>
                        <td>
                            <a class="btn btn-outline-primary btn-sm"
                               th:href="@{/estimates/{id}(id=${estimate.estimateId})}">詳細</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
