apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cargo
  namespace: cargo
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # API は Gateway に集約する。認証の要否は Gateway 側で判定する。
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gatewayms
                port:
                  number: 8080
          - path: /docs-portal
            pathType: Prefix
            backend:
              service:
                name: www
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
