apiVersion: apps/v1
kind: Deployment
metadata:
  name: routingms
  namespace: cargo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: routingms
  template:
    metadata:
      labels:
        app: routingms
    spec:
      containers:
        - name: routingms
          image: cargo-routingms:0.0.1
          ports:
            - containerPort: 8083
          env:
            - name: PORT
              value: "8083"
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/routing_db
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: { name: cargo-secrets, key: DB_USERNAME }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: cargo-secrets, key: DB_PASSWORD }

          # DB / ブローカーの起動待ちは readinessProbe の範囲で復帰させる（起動順序制御は作り込まない）
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: routingms
  namespace: cargo
spec:
  selector:
    app: routingms
  ports:
    - port: 8083
      targetPort: 8083
