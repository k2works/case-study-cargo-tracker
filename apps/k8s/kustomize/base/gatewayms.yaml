apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatewayms
  namespace: cargo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gatewayms
  template:
    metadata:
      labels:
        app: gatewayms
    spec:
      containers:
        - name: gatewayms
          image: cargo-gatewayms:0.0.1
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: AUTHMS_URI
              value: http://authms:8081
            - name: BOOKINGMS_URI
              value: http://bookingms:8082
            - name: ROUTINGMS_URI
              value: http://routingms:8083
            - name: TRACKINGMS_URI
              value: http://trackingms:8084
            - name: HANDLINGMS_URI
              value: http://handlingms:8085
            - name: BILLINGMS_URI
              value: http://billingms:8086
            - name: CORS_ALLOWED_ORIGINS
              value: http://localhost
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: cargo-secrets, key: JWT_SECRET }
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          # 起動が終わるまで liveness を働かせない。10 サービスが一斉に立ち上がる環境では
          # Spring Boot の初期化が liveness の猶予を超え、正常に起動中のコンテナが
          # 殺されて再起動ループに入る（実際に発生した）。
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            # 最大 10 分待つ。起動しないコンテナはここで初めて再起動される
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gatewayms
  namespace: cargo
spec:
  selector:
    app: gatewayms
  ports:
    - port: 8080
      targetPort: 8080
