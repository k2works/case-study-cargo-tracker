# 国際貨物輸送管理システム ローカル開発環境
#
# 起動順:
#   1. axonserver + postgresql（基盤）
#   2. authms / bookingms / routingms / trackingms / handlingms / billingms（アプリ）
#   3. gatewayms（API Gateway）
#   4. frontend（React SPA、IT3 で追加予定）
#
# 推奨利用:
#   - イメージビルド: `gulp local-docker:build`
#   - フル起動:       `gulp local-docker:up`
#   - 停止:           `gulp local-docker:down`
#   - 完全リセット:   `gulp local-docker:clean`（実行前に y/n 確認）
#   - 疎通確認:       `gulp local-docker:smoke`
#   - 日常 TDD は local-h2 プロファイル（gulp dev:bookingms）を推奨
#
# 注意:
#   - ADR-0003 によりシークレットは .env 経由で読込（ハードコード禁止）
#   - AXONIQ_AXONSERVER_DEVMODE_ENABLED はローカル限定。本番では false
#   - 完全リセット: `docker compose down -v`（Event Store も消える）

services:
  # =========================
  # 基盤サービス
  # =========================
  axonserver:
    # Axon Server 2026.0.0 (Standard Edition)
    # Docker Hub の実在タグは <MAJOR>.<MINOR>.<PATCH> 形式（`-LTS` サフィックスは存在しない）
    # 最新ラインは Axon Framework 5.1.0 と同時期にリリースされた 2026.0.0
    image: axoniq/axonserver:2026.0.0
    container_name: cargo-axonserver
    ports:
      - "${AXON_SERVER_HTTP_PORT:-8024}:8024"
      - "${AXON_SERVER_GRPC_PORT:-8124}:8124"
    volumes:
      - axonserver-data:/axonserver/data
      - axonserver-events:/axonserver/events
      - axonserver-config:/axonserver/config
    environment:
      AXONIQ_AXONSERVER_NAME: axonserver
      AXONIQ_AXONSERVER_HOSTNAME: axonserver
      AXONIQ_AXONSERVER_DEVMODE_ENABLED: "${AXONIQ_AXONSERVER_DEVMODE_ENABLED:-true}"
      # Axon Server 2026.0.0 では standalone モードを明示しないと default Context が
      # 自動作成されず、クライアントの gRPC 接続で AXONIQ-1302 "default: not found in
      # any replication group" になる（ADR-0009 受入検証で判明）。本番では cluster 構成を
      # 採るため別途検討する。
      AXONIQ_AXONSERVER_STANDALONE: "true"
      # Axon Framework 5 は DCB（Dynamic Consistency Boundary）対応の Event Store を
      # 要求する。standalone-dcb=true で default Context を DCB 形式で生成し、
      # AXONIQ-2308 "Operation not supported on non-DCB context" を回避する。
      AXONIQ_AXONSERVER_STANDALONE_DCB: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8024/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  postgresql:
    image: postgres:16
    container_name: cargo-postgresql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER not set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_MULTIPLE_DATABASES: >-
        auth_db,booking_read_db,routing_read_db,
        tracking_read_db,handling_read_db,billing_read_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./ops/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =========================
  # マイクロサービス（Phase 0 では bookingms のみ実装）
  # =========================
  bookingms:
    build:
      context: ./backend
      dockerfile: bookingms/Dockerfile
    container_name: cargo-bookingms
    # Phase 0 では bookingms のみが実装済みのため、profile を付けずに常時対象とする。
    # `up:basics` でサービス名指定（axonserver postgresql のみ）すれば基盤限定起動も可能。
    # Phase 1 で他サービスが追加されたら profiles: ["full"] を再導入する。
    depends_on:
      axonserver:
        condition: service_healthy
      postgresql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local-docker
      AXON_AXONSERVER_SERVERS: axonserver:8124
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/booking_read_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8082:8082"

  # =========================
  # IT2 完了時点で実装済みのマイクロサービス
  # ポート割り当て: authms=8081, bookingms=8082, routingms=8083, gatewayms=8080
  # IT5 追加: handlingms=8085
  # IT6 追加: trackingms=8086
  # 未実装（次イテレーション以降で追加予定）: billingms=8087
  # =========================
  authms:
    build:
      context: ./backend
      dockerfile: authms/Dockerfile
    container_name: cargo-authms
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local-docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/auth_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-case-study-cargo-tracker}
    ports:
      - "8081:8081"

  routingms:
    build:
      context: ./backend
      dockerfile: routingms/Dockerfile
    container_name: cargo-routingms
    depends_on:
      axonserver:
        condition: service_healthy
      postgresql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local-docker
      AXON_AXONSERVER_SERVERS: axonserver:8124
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/routing_read_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8083:8083"

  handlingms:
    build:
      context: ./backend
      dockerfile: handlingms/Dockerfile
    container_name: cargo-handlingms
    depends_on:
      axonserver:
        condition: service_healthy
      postgresql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local-docker
      AXON_AXONSERVER_SERVERS: axonserver:8124
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/handling_read_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8085:8085"

  trackingms:
    build:
      context: ./backend
      dockerfile: trackingms/Dockerfile
    container_name: cargo-trackingms
    depends_on:
      axonserver:
        condition: service_healthy
      postgresql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local-docker
      AXON_AXONSERVER_SERVERS: axonserver:8124
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/tracking_read_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      TRACKING_TOKEN_EXPIRATION_DAYS: ${TRACKING_TOKEN_EXPIRATION_DAYS:-30}
      TRACKING_TOKEN_GRACE_DAYS: ${TRACKING_TOKEN_GRACE_DAYS:-7}
    ports:
      - "8086:8086"

  billingms:
    build:
      context: ./backend
      dockerfile: billingms/Dockerfile
    container_name: cargo-billingms
    depends_on:
      axonserver:
        condition: service_healthy
      postgresql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local-docker
      AXON_AXONSERVER_SERVERS: axonserver:8124
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/billing_read_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8087:8087"

  gatewayms:
    build:
      context: ./backend
      dockerfile: gatewayms/Dockerfile
    container_name: cargo-gatewayms
    depends_on:
      authms:
        condition: service_started
      bookingms:
        condition: service_started
      routingms:
        condition: service_started
      handlingms:
        condition: service_started
      trackingms:
        condition: service_started
      billingms:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: local-docker
      AUTHMS_URL: http://authms:8081
      BOOKINGMS_URL: http://bookingms:8082
      ROUTINGMS_URL: http://routingms:8083
      HANDLINGMS_URL: http://handlingms:8085
      TRACKINGMS_URL: http://trackingms:8086
      BILLINGMS_URL: http://billingms:8087
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-case-study-cargo-tracker}
    ports:
      - "8080:8080"

  # =========================
  # IT3 以降で追加予定
  # =========================
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: cargo-frontend
  #   depends_on:
  #     gatewayms:
  #       condition: service_started
  #   environment:
  #     VITE_API_BASE_URL: http://localhost:8080
  #   ports:
  #     - "3000:80"

volumes:
  axonserver-data:
  axonserver-events:
  axonserver-config:
  postgres-data:
