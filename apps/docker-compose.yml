services:
  postgres:
    image: postgres:16
    container_name: cargo-tracker-postgres
    environment:
      POSTGRES_USER: cargo_tracker
      POSTGRES_PASSWORD: cargo_tracker
      POSTGRES_DB: cargo_tracker
    # ホスト側 5432 は他プロジェクト（sms-postgres 等）と競合しやすいため 5442 で公開する
    ports:
      - "5442:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cargo_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: cargo-tracker-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
