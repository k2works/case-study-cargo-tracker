# アプリケーション実行環境（local-docker プロファイル用）
#
# このファイルはアプリ実行環境を立ち上げる用途で、ドキュメントサイト
# （MkDocs / PlantUML）用の ../docker-compose.yml とは分離している（ADR-0003）。
#
# 起動方法:
#   docker compose -f apps/docker-compose.yml up -d
# あるいはタスクランナー経由:
#   npx gulp local-docker:up
#
# シークレットはすべてリポジトリ直下の .env から読み込む（ハードコード禁止）。
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: cargo-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: on-failure

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: cargo-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      - zookeeper
    restart: on-failure

  postgresql:
    image: postgres:16
    container_name: cargo-postgresql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER not set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set in .env}
      # 複数 DB の作成は init-databases.sh が POSTGRES_MULTIPLE_DATABASES を読んで実行する
      POSTGRES_MULTIPLE_DATABASES: >-
        auth_db,booking_read_db,routing_read_db,tracking_read_db,handling_read_db,billing_read_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../ops/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ポート割り当て: authms=8081, routingms=8083, gatewayms=8080
  authms:
    build:
      context: ./backend
      dockerfile: authms/Dockerfile
    container_name: cargo-authms
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: local-docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/auth_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgresql:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5

  routingms:
    build:
      context: ./backend
      dockerfile: routingms/Dockerfile
    container_name: cargo-routingms
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: local-docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/routing_read_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgresql:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5

  gatewayms:
    build:
      context: ./backend
      dockerfile: gatewayms/Dockerfile
    container_name: cargo-gatewayms
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local-docker
      AUTHMS_URL: http://authms:8081
      ROUTINGMS_URL: http://routingms:8083
    depends_on:
      authms:
        condition: service_healthy
      routingms:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5

volumes:
  postgres-data:
    name: cargo-postgres-data
