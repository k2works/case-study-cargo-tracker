spring:
  application:
    name: bookingms
  datasource:
    url: ${DB_URL:jdbc:h2:mem:booking_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Tokyo
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: ${PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

# 業務日付は業務タイムゾーンで判断する（UTC で判断しない）
app:
  business-time-zone: Asia/Tokyo
  # **相手の所在は環境ごとに上書きする。**
  #
  # 既定値は**開発機（localhost）を指す**。クラスタの中では自分自身を指すことになり、
  # 入れ忘れても起動は成功して、その相手を使う操作だけが失敗する
  # ——IT5（経路の確定）と IT12（見積の候補）で 2 度踏んだ。
  # **デプロイの手順（k8s マニフェスト・deploy.js）が必ず渡す。**
  routing-service:
    # 経路の確定時に候補の成立を確かめる先（ADR-019 決定 2）
    base-url: ${APP_ROUTING_SERVICE_BASE_URL:http://localhost:8083}
  billing-service:
    # 見積の概算料金を試算する先（[ADR-028] 決定 6）。**式は billingms の 1 か所にある**
    # ——こちらで計算すると、荷主に出した見積と請求が違う金額になる
    base-url: ${APP_BILLING_SERVICE_BASE_URL:http://localhost:8086}
