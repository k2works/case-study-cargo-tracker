spring:
  application:
    name: bookingms
  datasource:
    url: ${DB_URL:jdbc:h2:mem:booking_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Tokyo
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: ${PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

# 業務日付は業務タイムゾーンで判断する（UTC で判断しない）
app:
  business-time-zone: Asia/Tokyo
  routing-service:
    # 経路の確定時に候補の成立を確かめる先（ADR-019 決定 2）。
    # **コードに既定値を持たせない。** 既定値があると、設定漏れが実行時まで表面化せず、
    # しかも自分自身を指していた IT5 の欠陥のように「経路の確定だけが必ず失敗する」形になる。
    # 環境ごとに APP_ROUTING_SERVICE_BASE_URL で上書きする
    base-url: ${APP_ROUTING_SERVICE_BASE_URL:http://localhost:8083}
  billing-service:
    # 見積の概算料金を試算する先（[ADR-028] 決定 6）。**式は billingms の 1 か所にある**
    # ——こちらで計算すると、荷主に出した見積と請求が違う金額になる。
    # 環境ごとに APP_BILLING_SERVICE_BASE_URL で上書きする
    base-url: ${APP_BILLING_SERVICE_BASE_URL:http://localhost:8086}
