/*
 * ルートビルドスクリプト
 *
 * 全サブプロジェクト共通の設定（Java バージョン、依存関係、テスト設定など）を
 * subprojects ブロックで定義する。Version Catalog（gradle/libs.versions.toml）を
 * 参照してバージョンを一元管理する。
 */

plugins {
    id 'java'
    // Spring Boot プラグインはサブプロジェクトで apply するため、ルートでは apply false
    alias(libs.plugins.spring.boot) apply false
    alias(libs.plugins.spring.dependency.management) apply false
    alias(libs.plugins.sonarqube)
}

allprojects {
    group = 'com.example'
    version = '0.0.1-SNAPSHOT'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'jacoco'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(libs.versions.java.get() as Integer)
        }
    }

    repositories {
        mavenCentral()
    }

    // 共通依存関係（テスト系のみ。Spring Boot 系は各サブプロジェクトで宣言する）
    dependencies {
        testImplementation libs.spring.boot.starter.test
        testImplementation libs.junit.jupiter
        testImplementation libs.assertj.core
        testImplementation libs.mockito.core
        testImplementation libs.mockito.junit.jupiter
        testImplementation libs.archunit.junit5
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform {
            // IT5 H6/H7 対応：Kafka 統合テストは container race の flaky 問題のため
            // 通常の `check` タスクからは除外する。`-PincludeKafkaIntegration=true` 指定時のみ実行。
            // 個別実行は `./gradlew :<svc>:test --tests *KafkaIntegrationTest --rerun-tasks` で可能。
            // IT6 で構造的解決（Testcontainers Reusable + 一意 topic prefix）予定。
            if (!project.hasProperty('includeKafkaIntegration')) {
                excludeTags 'kafka-integration'
            }
        }
        testLogging {
            events 'passed', 'failed', 'skipped'
            exceptionFormat = 'full'
        }
        // ローカル TDD ループは local-h2 プロファイルをデフォルトとする
        systemProperty 'spring.profiles.active', System.getProperty('spring.profiles.active', 'local-h2')
        // Java 25 + Mockito/ByteBuddy 互換性のため実験的モードを有効化
        jvmArgs '-Dnet.bytebuddy.experimental=true'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-parameters']
    }

    jacoco {
        toolVersion = '0.8.13'
    }

    jacocoTestReport {
        dependsOn test
        reports {
            xml.required = true
            html.required = true
        }
    }

    test {
        finalizedBy jacocoTestReport
    }
}
