plugins {
    id 'org.springframework.boot' version '4.0.5' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'com.github.spotbugs' version '6.1.3' apply false
    id 'org.sonarqube' version '6.3.1.5724'
    // コードから設計ドキュメントを生成する（docs/design と実装の乖離を検出する手段）
    id 'org.dddjava.jig-gradle-plugin' version '2026.7.4' apply false
}

ext {
    jigErdVersion = '0.2.2'
    testcontainersVersion = '1.21.4'
}

allprojects {
    group = 'com.example'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'checkstyle'
    apply plugin: 'com.github.spotbugs'
    apply plugin: 'jacoco'
    apply plugin: 'org.sonarqube'
    apply plugin: 'org.dddjava.jig-gradle-plugin'

    // --- JIG（コードからの設計ドキュメント生成）---
    // docs/design は「こう設計した」、JIG の出力は「こう実装されている」を示す。
    // 両者を突き合わせることで、設計と実装の乖離を目視ではなく生成物で検出する。
    jig {
        // BC ごとの構造を見たいので、全パッケージを対象にする
        modelPattern = '.+'
        outputDirectory = layout.buildDirectory.dir('jig').get().asFile.toString()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    // Spring Boot を適用するサービスでは plain jar を生成しない。
    // Dockerfile の COPY build/libs/*.jar が 2 つの jar を拾って曖昧になるのを防ぐ。
    plugins.withId('org.springframework.boot') {
        tasks.named('jar') {
            enabled = false
        }
    }

    checkstyle {
        toolVersion = '10.21.4'
        configFile = file("${rootProject.projectDir}/config/checkstyle/checkstyle.xml")
        ignoreFailures = true
    }

    spotbugs {
        ignoreFailures = true
        excludeFilter = file("${rootProject.projectDir}/config/spotbugs/exclude-filter.xml")
    }

    tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
        reports {
            html.required = true
            xml.required = false
        }
    }

    jacocoTestReport {
        dependsOn test
        reports {
            html.required = true
            xml.required = true
        }
    }

    // --- jig-erd（DB スキーマからの ER 図生成）---
    // Testcontainers 上に Flyway で構築したスキーマから ER 図を出力する。
    // data-model.md の ER 図は設計、jig-erd の出力は実際のスキーマである。
    // Database per Service のため、図はサービスごとに生成される。
    if (file("${projectDir}/src/test/resources/jig.properties").exists()) {
        tasks.register('jigErd', Test) {
            group = 'documentation'
            description = 'Flyway で構築したスキーマから ER 図を生成する（Docker と Graphviz が必要）'
            // Test タスクを register する場合、クラスパスは明示しないと NO-SOURCE になる
            testClassesDirs = sourceSets.test.output.classesDirs
            classpath = sourceSets.test.runtimeClasspath
            useJUnitPlatform()
            filter {
                includeTestsMatching "com.example.${project.name}.SchemaErdDocument"
            }
            systemProperty 'jig.erd.enabled', 'true'
            outputs.upToDateWhen { false }
        }
    }

    tasks.named('test') {
        useJUnitPlatform()
        finalizedBy jacocoTestReport
        maxParallelForks = 1
        // ER 図生成は検証ではないため通常のテストから除外する（Graphviz と Docker に依存する）
        filter {
            excludeTestsMatching "com.example.${project.name}.SchemaErdDocument"
        }
        reports {
            junitXml.required = false
            html.required = true
        }
        // 業務タイムゾーンを本体と揃える。CI（UTC）でも同じ日付判定になることを確認するため
        // TZ=UTC で一度実行する運用と併用する（テスト戦略を参照）。
        systemProperty 'user.timezone', System.getProperty('user.timezone', 'Asia/Tokyo')
        jvmArgs '-Dnet.bytebuddy.experimental=true'
    }

    sonarqube {
        properties {
            property 'sonar.coverage.exclusions', [
                    '**/*Application.java',
                    '**/config/**',
                    '**/package-info.java'
            ].join(',')
        }
    }
}
