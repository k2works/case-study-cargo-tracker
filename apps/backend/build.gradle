plugins {
    id 'org.springframework.boot' version '4.0.5' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'com.github.spotbugs' version '6.1.3' apply false
    id 'org.sonarqube' version '6.3.1.5724'
}

allprojects {
    group = 'com.example'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'checkstyle'
    apply plugin: 'com.github.spotbugs'
    apply plugin: 'jacoco'
    apply plugin: 'org.sonarqube'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    // Spring Boot を適用するサービスでは plain jar を生成しない。
    // Dockerfile の COPY build/libs/*.jar が 2 つの jar を拾って曖昧になるのを防ぐ。
    plugins.withId('org.springframework.boot') {
        tasks.named('jar') {
            enabled = false
        }
    }

    checkstyle {
        toolVersion = '10.21.4'
        configFile = file("${rootProject.projectDir}/config/checkstyle/checkstyle.xml")
        ignoreFailures = true
    }

    spotbugs {
        ignoreFailures = true
        excludeFilter = file("${rootProject.projectDir}/config/spotbugs/exclude-filter.xml")
    }

    tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
        reports {
            html.required = true
            xml.required = false
        }
    }

    jacocoTestReport {
        dependsOn test
        reports {
            html.required = true
            xml.required = true
        }
    }

    tasks.named('test') {
        useJUnitPlatform()
        finalizedBy jacocoTestReport
        maxParallelForks = 1
        reports {
            junitXml.required = false
            html.required = true
        }
        // 業務タイムゾーンを本体と揃える。CI（UTC）でも同じ日付判定になることを確認するため
        // TZ=UTC で一度実行する運用と併用する（テスト戦略を参照）。
        systemProperty 'user.timezone', System.getProperty('user.timezone', 'Asia/Tokyo')
        environment 'DOCKER_API_VERSION', '1.43'
        jvmArgs '-Dnet.bytebuddy.experimental=true'
    }

    sonarqube {
        properties {
            property 'sonar.coverage.exclusions', [
                    '**/*Application.java',
                    '**/config/**',
                    '**/package-info.java'
            ].join(',')
        }
    }
}
