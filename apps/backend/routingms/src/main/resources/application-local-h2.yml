# local-h2 プロファイル: H2 インメモリ DB + ローカル Kafka（Docker Compose）
# DB は H2 で起動しつつ Kafka によるイベント伝搬を local-docker と同条件で検証できる。
spring:
  datasource:
    url: jdbc:h2:mem:routingdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: false
  sql:
    init:
      mode: always
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

axon:
  axonserver:
    enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    default-topic: cargo-events
    publisher:
      enabled: true
    fetcher:
      enabled: true
  eventhandling:
    processors:
      default:
        mode: subscribing

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.example.routingms: DEBUG
    org.axonframework: INFO
