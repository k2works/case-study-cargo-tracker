# local-h2 プロファイル: H2 インメモリ + Axon の EmbeddedEventStore（Kafka 無し）
# 単一サービスの最速 TDD ループに最適。
spring:
  datasource:
    url: jdbc:h2:mem:routingdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: false
  sql:
    init:
      mode: always
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

# Kafka・Axon Server を無効化し、Axon は InMemory EventStore を使用する
axon:
  axonserver:
    enabled: false
  kafka:
    publisher:
      enabled: false
    fetcher:
      enabled: false
  eventhandling:
    processors:
      default:
        mode: subscribing

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.example.routingms: DEBUG
    org.axonframework: INFO
