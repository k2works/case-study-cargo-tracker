# local-docker プロファイル: PostgreSQL + ローカル Kafka（Confluent）
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/routing_read_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

axon:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    default-topic: cargo-events
    publisher:
      enabled: true
    fetcher:
      enabled: true
  eventhandling:
    processors:
      default:
        # IT2 暫定: TokenEntry テーブル整備までは subscribing モードを使用
        # （ADR-0008 参照）
        mode: subscribing

logging:
  level:
    com.example.routingms: INFO
    org.axonframework: INFO
