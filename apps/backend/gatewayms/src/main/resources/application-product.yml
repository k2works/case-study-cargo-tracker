# Heroku 開発環境（container stack）向けプロファイル。
# 各サービスの URL は Config Vars で注入する。
spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: authms
              uri: ${AUTHMS_URL}
              predicates:
                - Path=/api/v1/auth/**
            - id: bookingms
              uri: ${BOOKINGMS_URL}
              predicates:
                - Path=/api/v1/bookings/**,/api/v1/shippers/**
            - id: routingms
              uri: ${ROUTINGMS_URL}
              predicates:
                - Path=/api/v1/voyages/**,/api/v1/routes/**
            - id: trackingms
              uri: ${TRACKINGMS_URL}
              predicates:
                - Path=/api/v1/tracking/**
            - id: handlingms
              uri: ${HANDLINGMS_URL}
              predicates:
                - Path=/api/v1/handling/**,/api/v1/customs/**
            - id: billingms
              uri: ${BILLINGMS_URL}
              predicates:
                - Path=/api/v1/billing/**
  jmx:
    enabled: false

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
