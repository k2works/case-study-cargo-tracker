# heroku プロファイル: Heroku 上のサービス間ルーティング
spring:
  cloud:
    gateway:
      routes:
        - id: authms
          uri: ${AUTHMS_URL}
          predicates:
            - Path=/api/auth/**, /api/v1/users/**
        - id: bookingms
          uri: ${BOOKINGMS_URL}
          predicates:
            - Path=/api/v1/bookings/**, /api/v1/shippers/**, /api/v1/quotes/**
        - id: routingms
          uri: ${ROUTINGMS_URL}
          predicates:
            - Path=/api/v1/voyages/**, /api/v1/routes/**
        - id: trackingms
          uri: ${TRACKINGMS_URL}
          predicates:
            - Path=/api/v1/tracking/**
        - id: handlingms
          uri: ${HANDLINGMS_URL}
          predicates:
            - Path=/api/v1/handling/**

server:
  port: ${PORT:8080}

logging:
  level:
    com.example.gatewayms: INFO
    root: WARN
