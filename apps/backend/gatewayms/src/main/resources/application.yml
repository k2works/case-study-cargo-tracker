spring:
  application:
    name: gatewayms
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: authms
              # ロック解除（US32）も authms が持つ。**ここに足し忘れると、画面からは
              # 404 に見える**（Gateway がどこへも振らないため、サービス側は無実である）
              uri: ${AUTHMS_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/admin/accounts/**,/api/v1/admin/user-shipper-links/**,/api/v1/internal/user-shipper-links/**
            - id: bookingms
              uri: ${BOOKINGMS_URI:http://localhost:8082}
              predicates:
                - Path=/api/v1/bookings/**,/api/v1/shippers/**,/api/v1/cancellations/**,/api/v1/cancellations,/api/v1/estimates/**,/api/v1/estimates
            - id: routingms
              uri: ${ROUTINGMS_URI:http://localhost:8083}
              predicates:
                - Path=/api/v1/voyages/**,/api/v1/routes/**
            - id: trackingms
              uri: ${TRACKINGMS_URI:http://localhost:8084}
              predicates:
                - Path=/api/v1/tracking/**,/api/v1/public/tracking/**,/api/v1/shipper/tracking/**
            - id: handlingms
              uri: ${HANDLINGMS_URI:http://localhost:8085}
              predicates:
                - Path=/api/v1/handling/**,/api/v1/customs/**
            - id: billingms
              uri: ${BILLINGMS_URI:http://localhost:8086}
              predicates:
                - Path=/api/v1/billing/**
            - id: simulationms
              uri: ${SIMULATIONMS_URI:http://localhost:8087}
              predicates:
                - Path=/api/v1/simulations/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
                allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
                allowedHeaders: '*'

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  # 認証不要で通す経路。追跡照会（公開画面）のみを許可し、それ以外は JWT 検証の対象とする。
  # 一覧に載っていない経路は必ず認証を要求する（未登録を素通りさせない）。
  public-paths:
    # 公開する追跡照会は /api/v1/public/ 配下に分ける。業務 API と同じ接頭辞のまま
    # ワイルドカードで開けると、後から生えた /api/v1/tracking/manage のような
    # 業務 API まで無認証で通ってしまう（IT1 の破壊検証で実際に検出した）。
    - method: GET
      pattern: /api/v1/public/tracking/*
    - method: POST
      pattern: /api/v1/auth/login
  jwt:
    secret: ${JWT_SECRET:local-development-secret-key-please-override-in-every-real-environment}
