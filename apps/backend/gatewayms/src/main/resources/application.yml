server:
  port: ${PORT:8080}

spring:
  application:
    name: gatewayms
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: authms
              uri: ${AUTHMS_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**
            - id: bookingms
              uri: ${BOOKINGMS_URL:http://localhost:8082}
              predicates:
                - Path=/api/booking/**
            - id: routingms
              uri: ${ROUTINGMS_URL:http://localhost:8083}
              predicates:
                - Path=/api/routing/**
            - id: trackingms
              uri: ${TRACKINGMS_URL:http://localhost:8084}
              predicates:
                - Path=/api/tracking/**
            - id: handlingms
              uri: ${HANDLINGMS_URL:http://localhost:8085}
              predicates:
                - Path=/api/handling/**
            - id: billingms
              uri: ${BILLINGMS_URL:http://localhost:8086}
              predicates:
                - Path=/api/billing/**
  devtools:
    restart:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
