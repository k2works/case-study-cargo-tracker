# heroku プロファイル: H2 インメモリ DB + Axon InMemory EventStore（Heroku 開発環境用）
spring:
  datasource:
    url: jdbc:h2:mem:billingdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never

axon:
  axonserver:
    enabled: false
  kafka:
    publisher:
      enabled: false
    fetcher:
      enabled: false
  eventhandling:
    processors:
      default:
        mode: subscribing

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${PORT:8086}

logging:
  level:
    com.example.billingms: INFO
    org.axonframework: WARN
    root: WARN

# billing パラメータの上書き（IT7 review 中対応で外部化）。
# Heroku Config Vars で以下を設定すると application.yml デフォルトを上書き可能:
#   - BILLING_PAYMENTDUEDAYS=60                            # NET60 支払サイト
#   - BILLING_OVERDUE_CRON="0 0 10 * * *"                   # 毎日 10:00 に変更
#   - BILLING_OVERDUE_ZONE="America/New_York"               # 米国本番運用時
#   - BILLING_DISCOUNTDESCRIPTION="Corporate discount (%d%%)" # 英語通知用
# IT8 ADR-0017 ShedLock 統合時は web=2 で BILLING_OVERDUE_CRON 一時停止（"-"）も検討可。
# IT8 ADR-0018 SendGrid 統合時は notification.adapter=sendgrid + テンプレート ID を追加。
