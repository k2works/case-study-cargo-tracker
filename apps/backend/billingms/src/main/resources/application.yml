# billingms 共通設定
spring:
  application:
    name: billingms
  profiles:
    active: local-h2
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8086

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when_authorized

# billingms 業務パラメータ（IT7 review 中対応、ハードコード除去）
# IT8 で契約別支払サイト（NET30/60/90）対応時は paymentDueDays を Map に拡張する
billing:
  paymentDueDays: 30
  overdue:
    cron: "0 0 9 * * *"
    zone: "Asia/Tokyo"
  discountDescription: "法人割引（%d%%）"

# Axon 共通設定（プロファイル別に上書き）
axon:
  serializer:
    general: jackson
    events: jackson
    messages: jackson
