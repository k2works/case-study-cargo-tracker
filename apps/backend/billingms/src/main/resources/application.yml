# billingms 共通設定
spring:
  application:
    name: billingms
  profiles:
    active: local-h2
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8086

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when_authorized

# billingms 業務パラメータ（IT7 review 中対応、ハードコード除去）
# IT8 で契約別支払サイト（NET30/60/90）対応時は paymentDueDays を Map に拡張する
billing:
  paymentDueDays: 30
  overdue:
    cron: "0 0 9 * * *"
    zone: "Asia/Tokyo"
  discountDescription: "法人割引（%d%%）"

# 通知設定（IT8 T3.2 / ADR-0018）
# adapter: logging（デフォルト、INFO/WARN ログ出力スタブ）
#        | sendgrid（本番、SendGrid Dynamic Templates 経由でメール送信）
notification:
  adapter: ${NOTIFICATION_ADAPTER:logging}
  sendgrid:
    apiKey: ${SENDGRID_API_KEY:}
    fromEmail: ${SENDGRID_FROM_EMAIL:noreply@cargo-tracker.example.com}
    fromName: ${SENDGRID_FROM_NAME:Cargo Tracker}
    templates:
      invoiceIssued: ${SENDGRID_TEMPLATE_INVOICE_ISSUED:}
      paymentReceived: ${SENDGRID_TEMPLATE_PAYMENT_RECEIVED:}
      overdue: ${SENDGRID_TEMPLATE_OVERDUE:}

# cross-service ACL 設定（IT8 T4.1 / ADR-0015 後半、RestShipperInfoAcl）
# adapter: stub（デフォルト、StubShipperInfoAcl が ConditionalOnMissingBean で生成）
#        | rest（本番、RestShipperInfoAcl が bookingms /api/v1/shippers/{id} を呼出）
shipper-info:
  adapter: ${SHIPPER_INFO_ADAPTER:stub}
  bookingms:
    base-url: ${BOOKINGMS_URL:http://localhost:8081}
    timeout-ms: 1000

# Resilience4j 設定（ADR-0015 後半）
resilience4j:
  circuitbreaker:
    instances:
      shipperInfo:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
  timelimiter:
    instances:
      shipperInfo:
        timeoutDuration: 1s
        cancelRunningFuture: true

# Caffeine cache（ADR-0015 後半、shipperInfo TTL 5min）
spring.cache:
  type: caffeine
  cache-names: shipperInfo
  caffeine:
    spec: maximumSize=500,expireAfterWrite=5m

# Axon 共通設定（プロファイル別に上書き）
axon:
  serializer:
    general: jackson
    events: jackson
    messages: jackson
