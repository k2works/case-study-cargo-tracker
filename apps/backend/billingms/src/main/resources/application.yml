spring:
  application:
    name: billingms
  datasource:
    url: ${DB_URL:jdbc:h2:mem:billing_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Tokyo

server:
  port: ${PORT:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

# 業務日付は業務タイムゾーンで判断する（UTC で判断しない）
app:
  business-time-zone: Asia/Tokyo
  booking-service:
    # 料金算出の入力を引く先（[ADR-027] 決定 7）。
    # **コードに既定値を持たせない。** 既定値があると設定漏れが実行時まで表面化せず、
    # 「料金の算出だけが必ず失敗する」形になる（IT5 で bookingms → routingms が
    # 自分自身を指していた欠陥と同じ）。環境ごとに APP_BOOKING_SERVICE_BASE_URL で上書きする
    base-url: ${APP_BOOKING_SERVICE_BASE_URL:http://localhost:8082}
