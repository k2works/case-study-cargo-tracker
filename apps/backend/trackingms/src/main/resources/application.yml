# trackingms 共通設定
spring:
  application:
    name: trackingms
  profiles:
    active: local-h2
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when_authorized

# Axon 共通設定（プロファイル別に上書き）
axon:
  serializer:
    general: jackson
    events: jackson
    messages: jackson

# 公開追跡照会の時限署名トークン（ADR-0013、US18）
# 本番環境は Heroku Config Vars / 環境変数で上書きする（32 バイト以上必須）。
# IT8 で AWS Secrets Manager + 四半期ローテーションへ切替予定（ADR-0015 で起票予定）。
tracking:
  public-token:
    secret: ${TRACKING_PUBLIC_TOKEN_SECRET:dev-only-tracking-public-token-secret-32+bytes}
