plugins {
    id 'java-library'
    // 全サービス共通のアーキテクチャ規則を testFixtures として配布する。
    // 規則を 1 箇所に集約することで、サービスごとに検査内容がずれるのを防ぐ。
    id 'java-test-fixtures'
    id 'io.spring.dependency-management'
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:4.0.5'
    }
}

// shared は共有カーネル（Location のみ）。デプロイ単位ではないため bootJar は生成しない。
dependencies {
    api 'org.mybatis:mybatis:3.5.19'
    api 'org.mybatis.spring.boot:mybatis-spring-boot-autoconfigure:4.0.1'
    compileOnly 'org.springframework:spring-context'

    testFixturesApi 'com.tngtech.archunit:archunit-junit5:1.4.1'
    // 方言スモークで MyBatis の登録済みステートメントを列挙するため
    testFixturesApi 'org.mybatis:mybatis:3.5.19'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// shared のテストには、他サービスのファイルを読んで横断的に検査するものがある
// （ArchitectureRuleCoverageTest・LocationSeedReplicaTest）。それらのファイルを
// 入力として宣言しないと、Gradle はテストを up-to-date と判断して再実行しない。
// 検査があるのに走らない状態は、検査が無いのと同じである。
tasks.named('test') {
    inputs.file(rootProject.file('settings.gradle')).withPathSensitivity(PathSensitivity.RELATIVE)
    rootProject.subprojects.each { sub ->
        // fileTree は存在しないディレクトリを空として扱う。サービスによって
        // マイグレーションを持たないものがあるため、dir ではなく files で宣言する。
        inputs.files(sub.fileTree('src/main/resources/db/migration'))
                .withPathSensitivity(PathSensitivity.RELATIVE)
                .withPropertyName("migrations-${sub.name}")
        inputs.files(sub.fileTree('src/test/java'))
                .withPathSensitivity(PathSensitivity.RELATIVE)
                .withPropertyName("testSources-${sub.name}")
    }
}
