# ローカル開発：H2 インメモリ
#
# 用途: IDE 起動・最速 TDD ループ。

spring:
  datasource:
    url: jdbc:h2:mem:authms;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
