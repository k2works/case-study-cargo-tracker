# heroku プロファイル: H2 インメモリ DB + Axon InMemory EventStore（Heroku 開発環境用）
spring:
  datasource:
    url: jdbc:h2:mem:handlingdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never

axon:
  axonserver:
    enabled: false
  kafka:
    publisher:
      enabled: false
    fetcher:
      enabled: false
  eventhandling:
    processors:
      default:
        mode: subscribing

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${PORT:8085}

logging:
  level:
    com.example.handlingms: INFO
    org.axonframework: WARN
    root: WARN

# Heroku 開発環境（cargo-tracker-5-handlingms 等）でも DevDataSeeder を有効化し、
# 起動直後から動作確認用のサンプル HandlingActivity が投入される。
# DevDataSeeder は冪等（既存データ skip）のため、dyno 再起動時の重複も安全。
# 本番運用時は APP_DEV_SEED_ENABLED=false で Config Vars 上書きして停止すること。
app:
  dev-seed:
    enabled: true
