spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/handling_db}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:cargo_tracker}
    password: ${DB_PASSWORD:cargo_tracker}
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false
