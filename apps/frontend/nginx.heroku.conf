server {
    listen ${PORT};

    root /usr/share/nginx/html;
    index index.html;

    location /api/v1/auth {
        proxy_pass ${AUTH_API_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass ${BOOKING_API_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
