site_name: Case Study Cargo Tracker
site_description: DDD ケーススタディ - 貨物追跡システム
site_author: Project Team
repo_url: https://github.com/k2works/case-study-cargo-tracker
repo_name: case-study-cargo-tracker

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight

extra_css:
  - assets/css/extra.css

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
        - name: plantuml
          class: plantuml
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.tasklist
  - pymdownx.emoji
  - admonition
  # 日本語の見出しにもアンカーを付ける（IT8）。
  #
  # 既定の slugify は非 ASCII を落とすため、**日本語だけの見出しには id が付かない**。
  # 「5.5」のように数字で始まる見出しは #55 になるが、
  # 「システム管理担当窓口」のような見出しは参照しようがなかった。
  # マニュアルの章内リンクが飛ばない原因である。
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - plantuml_markdown:
      server: !!python/object/apply:os.getenv
        - PLANTUML_SERVER_URL
        - http://www.plantuml.com/plantuml
      format: svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11.6.0/dist/mermaid.min.js
  - assets/js/extra.js

extra:
  plantuml_url: http://www.plantuml.com/plantuml
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/k2works/case-study-cargo-tracker
      name: GitHub Repository/case-study-cargo-tracker

plugins:
  - search

exclude_docs: |
  wiki
  article/source/

