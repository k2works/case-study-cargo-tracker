site_name: Case Study Cargo Tracker
site_description: DDD ケーススタディ - 貨物追跡システム
site_author: Project Team
repo_url: https://github.com/k2works/case-study-cargo-tracker
repo_name: case-study-cargo-tracker

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - search.suggest
    - search.highlight

extra_css:
  - assets/css/extra.css

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: plantuml
          class: plantuml
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.tasklist
  - pymdownx.emoji
  - admonition
  - toc:
      permalink: true
  - plantuml_markdown:
      server: !!python/object/apply:os.getenv
        - PLANTUML_SERVER_URL
        - http://www.plantuml.com/plantuml
      format: svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js
  - assets/js/extra.js

extra:
  plantuml_url: http://www.plantuml.com/plantuml
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/k2works/case-study-cargo-tracker
      name: GitHub Repository/case-study-cargo-tracker

plugins:
  - search

exclude_docs: |
  wiki
  article/source/

nav:
  - Home: index.md
  - 戦略:
      - 概要: strategy/index.md
      - ビジネスアーキテクチャ: strategy/business_architecture.md
      - インセプションデッキ: strategy/inception-deck.md
  - 要件:
      - 概要: requirements/index.md
      - 要件定義書: requirements/requirements_definition.md
      - ビジネスユースケース: requirements/business_usecase.md
      - システムユースケース: requirements/system_usecase.md
      - ユーザーストーリー: requirements/user_story.md
  - 設計:
      - 概要: design/index.md
  - 開発:
      - 概要: development/index.md
  - 運用:
      - 概要: operation/index.md
  - レビュー:
      - 概要: review/index.md
      - ドメインモデル分析レビュー: review/ドメインモデル分析_review_20260331.md
  - ADR:
      - 概要: adr/index.md
  - 記事:
      - 概要: article/index.md
      - モノリスアーキテクチャ実装比較:
          - 概要: article/monolith-architecture/index.md
          - 第 1 章 モノリスアーキテクチャの全体像: article/monolith-architecture/01-architecture.md
          - 第 2 章 IT1 荷主登録と貨物予約の基盤: article/monolith-architecture/02-iteration-01.md
          - 第 3 章 IT2 特殊貨物と予約確定: article/monolith-architecture/03-iteration-02.md
          - 第 4 章 IT3 輸送見積と経路設計への引き渡し: article/monolith-architecture/04-iteration-03.md
          - 第 5 章 IT4 航海スケジュール検索と経路候補算出: article/monolith-architecture/05-iteration-04.md
          - 第 6 章 IT5 経路の選択・確定・紐付け: article/monolith-architecture/06-iteration-05.md
          - 第 7 章 IT6 法人割引と精算処理: article/monolith-architecture/07-iteration-06.md
          - 第 8 章 IT7 追跡番号発行と荷役作業記録: article/monolith-architecture/08-iteration-07.md
          - 第 9 章 IT8 引取記録・追跡照会・状態手動更新: article/monolith-architecture/09-iteration-08.md
          - 第 10 章 IT9 遅延・破損・紛失の例外処理: article/monolith-architecture/10-iteration-09.md
          - 第 11 章 IT10 輸送料金算出とリリース 2.0: article/monolith-architecture/11-iteration-10.md
          - 第 12 章 10 言語横断まとめ: article/monolith-architecture/12-comparison.md
      - 関数型ドメインモデリング:
          - 概要: article/functional-domain-modeling/index.md
          - 第 1 章 関数型ドメインモデリングとは: article/functional-domain-modeling/01-functional-domain-modeling.md
          - 第 2 章 IT1 型で守る土台をつくる: article/functional-domain-modeling/02-iteration-01.md
          - 第 3 章 IT2 貨物予約と特殊貨物: article/functional-domain-modeling/03-iteration-02.md
          - 第 4 章 IT3 航海スケジュールと経路候補算出: article/functional-domain-modeling/04-iteration-03.md
          - 第 5 章 IT4 経路確定から予約確定まで: article/functional-domain-modeling/05-iteration-04.md
          - 第 6 章 IT5 追跡と荷役: article/functional-domain-modeling/06-iteration-05.md
          - 第 7 章 IT6 輸送例外の登録と解決: article/functional-domain-modeling/07-iteration-06.md
          - 第 8 章 IT7 料金算出と精算: article/functional-domain-modeling/08-iteration-07.md
          - 第 9 章 IT8 実務品質への引き上げ: article/functional-domain-modeling/09-iteration-08.md
          - 第 10 章 型で守れたもの・守れなかったもの: article/functional-domain-modeling/10-summary.md
  - リファレンス:
      - 概要: reference/index.md
      - よいソフトウェアとは: reference/よいソフトウェアとは.md
      - ロジカルシンキング: reference/ロジカルシンキング.md
      - 開発ガイド: reference/開発ガイド.md
      - ビジネスアーキテクチャ分析ガイド: reference/ビジネスアーキテクチャ分析ガイド.md
      - 要件定義ガイド: reference/要件定義ガイド.md
      - ユースケース作成ガイド: reference/ユースケース作成ガイド.md
