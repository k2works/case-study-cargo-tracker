      - 2026-07-14: journal/20260714.md
      - 2026-07-15: journal/20260715.md
      - 2026-07-16: journal/20260716.md
  - ADR:
      - 概要: adr/index.md
      - 0001 モジュール構成は垂直スライスを採用: adr/0001-モジュール構成は垂直スライスを採用.md
      - 0002 ドメインイベントは Payload レコード方式と post-commit ディスパッチを採用: adr/0002-ドメインイベントはPayloadレコード方式とpost-commitディスパッチを採用.md
      - 0003 DB マイグレーションは DbUp による forward-only 方式を採用: adr/0003-DBマイグレーションはDbUpによるforward-only方式を採用.md
      - 0004 Donald による集約永続化パターンを採用: adr/0004-Donaldによる集約永続化パターンを採用.md
      - 0005 Cookie 認証と user_roles による RBAC を採用: adr/0005-Cookie認証とuser_rolesによるRBACを採用.md
      - 0006 時刻と GUID の注入ポートを採用: adr/0006-時刻とGUIDの注入ポートを採用.md
      - 0007 経路設計中状態は BookingState DU 拡張で表現: adr/0007-経路設計中状態はBookingState_DU拡張で表現.md
      - 0008 荷主参照は ShipperId 永続化により業務識別子で行う: adr/0008-荷主参照はShipperId永続化により業務識別子で行う.md
      - 0009 経路候補算出は Routing 自コンテキストで構成する: adr/0009-経路候補算出はRouting自コンテキストで構成する.md
      - 0010 経路確定の Routing→Booking 連携は合成層の ACL 変換で行う: adr/0010-経路確定のRouting_Booking連携は合成層のACL変換で行う.md
      - 0011 追跡照会の所有者制御は capability トークンとロールで行う: adr/0011-追跡照会の所有者制御はcapabilityトークンとロールで行う.md
      - 0012 荷役→追跡の状態連携はベストエフォートと冪等で行う: adr/0012-荷役から追跡への状態連携はベストエフォートと冪等で行う.md
      - 0013 料金算出と Billing↔Booking 連携は合成層と状態射影で行う: adr/0013-料金算出とBilling_Booking連携は合成層と状態射影で行う.md
      - 0014 決済 ACL は PaymentGatewayPort と WireMock で契約固定する: adr/0014-決済ACLはPaymentGatewayPortとWireMockで契約固定する.md
  - 記事:
