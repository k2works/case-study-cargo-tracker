name: CI - E2E

# US-UI-r で導入した Playwright E2E をリモート実行する。
# local-h2 プロファイル前提（H2 インメモリ DB、Axon Server 不要）で
# authms / bookingms / routingms / handlingms / gatewayms を bootJar 起動し、
# フロントエンドの Vite dev サーバーは Playwright の webServer で自動起動する。

on:
  push:
    branches: [main, "java/take-4"]
    paths:
      - "apps/backend/**"
      - "apps/frontend/**"
      - ".github/workflows/ci-e2e.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "apps/frontend/**"
      - ".github/workflows/ci-e2e.yml"

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/backend/**/*.gradle*', 'apps/backend/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        working-directory: apps/backend
        run: chmod +x gradlew

      - name: Build backend bootJars
        working-directory: apps/backend
        run: ./gradlew :authms:bootJar :bookingms:bootJar :routingms:bootJar :handlingms:bootJar :trackingms:bootJar :gatewayms:bootJar --no-daemon

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/frontend
        run: npx playwright install --with-deps chromium

      - name: Start backend services (local-h2 profile)
        env:
          SPRING_PROFILES_ACTIVE: local-h2
        run: |
          set -euo pipefail
          mkdir -p logs

          # authms (8081)
          nohup java -jar apps/backend/authms/build/libs/authms.jar \
            > logs/authms.log 2>&1 &
          echo $! > logs/authms.pid

          # bookingms (8082) - Axon Server なしでも H2 + MyBatis でヘルスチェックは成立
          nohup java -jar apps/backend/bookingms/build/libs/bookingms.jar \
            > logs/bookingms.log 2>&1 &
          echo $! > logs/bookingms.pid

          # routingms (8083) - 同上
          nohup java -jar apps/backend/routingms/build/libs/routingms.jar \
            > logs/routingms.log 2>&1 &
          echo $! > logs/routingms.pid

          # handlingms (8085) - 同上（IT5 新設）
          nohup java -jar apps/backend/handlingms/build/libs/handlingms.jar \
            > logs/handlingms.log 2>&1 &
          echo $! > logs/handlingms.pid

          # trackingms (8086) - 同上（IT6 新設）
          nohup java -jar apps/backend/trackingms/build/libs/trackingms.jar \
            > logs/trackingms.log 2>&1 &
          echo $! > logs/trackingms.pid

          # gatewayms (8080) - 環境変数で内部ルーティング先を上書き
          AUTHMS_URL=http://localhost:8081 \
          BOOKINGMS_URL=http://localhost:8082 \
          ROUTINGMS_URL=http://localhost:8083 \
          HANDLINGMS_URL=http://localhost:8085 \
          TRACKINGMS_URL=http://localhost:8086 \
          nohup java -jar apps/backend/gatewayms/build/libs/gatewayms.jar \
            > logs/gatewayms.log 2>&1 &
          echo $! > logs/gatewayms.pid

      - name: Wait for backend health
        run: |
          set -euo pipefail
          for endpoint in \
            "authms http://localhost:8081/actuator/health" \
            "bookingms http://localhost:8082/actuator/health" \
            "routingms http://localhost:8083/actuator/health" \
            "handlingms http://localhost:8085/actuator/health" \
            "trackingms http://localhost:8086/actuator/health" \
            "gatewayms http://localhost:8080/actuator/health"; do
            name=${endpoint%% *}
            url=${endpoint##* }
            echo "Waiting for ${name} at ${url}..."
            for i in $(seq 1 60); do
              if curl -sf "${url}" > /dev/null; then
                echo "${name} is up after ${i} attempts"
                break
              fi
              if [ "$i" = "60" ]; then
                echo "ERROR: ${name} did not become healthy within 120s"
                cat logs/${name}.log || true
                exit 1
              fi
              sleep 2
            done
          done

      - name: Run Playwright E2E
        working-directory: apps/frontend
        env:
          CI: "true"
        run: npm run test:e2e

      - name: Stop backend services
        if: always()
        run: |
          for pidfile in logs/*.pid; do
            [ -f "$pidfile" ] && kill "$(cat "$pidfile")" 2>/dev/null || true
          done

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/frontend/playwright-report/
            apps/frontend/test-results/

      - name: Upload backend logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: logs/

      - name: Generate test summary
        if: always()
        run: |
          {
            echo "## E2E CI 結果"
            echo ""
            echo "| 項目 | 値 |"
            echo "|------|-----|"
            echo "| Backend ビルド | bootJar (authms / bookingms / routingms / handlingms / trackingms / gatewayms) |"
            echo "| プロファイル | local-h2 (H2 + Axon ダミー) |"
            echo "| ブラウザ | Chromium |"
            echo "| シナリオ | login-shipper / login-booking / login-voyage / login-handling / routing-workbench / login-tracking |"
          } >> "$GITHUB_STEP_SUMMARY"
