name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'apps/cargo-tracker/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'apps/cargo-tracker/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/cargo-tracker

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/cargo-tracker/go.mod
          cache-dependency-path: apps/cargo-tracker/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          working-directory: apps/cargo-tracker

      - name: go-arch-lint
        run: |
          go install github.com/fe3dback/go-arch-lint@latest
          go-arch-lint check

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/cargo-tracker/go.mod
          cache-dependency-path: apps/cargo-tracker/go.sum

      - name: Run tests (unit + integration)
        run: go test -tags=integration -coverprofile=coverage.out ./...

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: apps/cargo-tracker/coverage.out

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/cargo-tracker/go.mod
          cache-dependency-path: apps/cargo-tracker/go.sum

      - name: Build
        run: go build ./...
