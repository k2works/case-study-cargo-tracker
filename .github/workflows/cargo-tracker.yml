name: cargo-tracker

# 品質ゲート（test_strategy.md）。段を分けるのは、落ちた段で原因が分かるようにするため。
# 1 つのジョブにまとめると「何が落ちたか」をログから探すことになる。

on:
  push:
    branches: [java/take-8]
    paths: ['apps/cargo-tracker/**', '.github/workflows/cargo-tracker.yml']
  pull_request:
    paths: ['apps/cargo-tracker/**', '.github/workflows/cargo-tracker.yml']

concurrency:
  group: cargo-tracker-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: バックエンド（単体・統合・境界・カバレッジ）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4

      # 業務タイムゾーンは Asia/Tokyo だが、CI は UTC で回す。ここで落ちるのは
      # 「テストが JVM 既定の now() を使っている」しるし（本番でだけ時差の分ずれる）。
      - name: build（ArchUnit・JaCoCo 閾値を含む）
        working-directory: apps/cargo-tracker/backend
        env:
          TZ: UTC
        run: ./gradlew build --no-daemon

  contract:
    name: 契約（ゴールデン JSON）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: contract-tests
        working-directory: apps/cargo-tracker/backend
        env:
          TZ: UTC
        run: ./gradlew :contract-tests:test --no-daemon

  acceptance:
    name: 受け入れ（デモ項目の Gherkin）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: acceptance-tests
        working-directory: apps/cargo-tracker/backend
        env:
          TZ: UTC
        run: ./gradlew :acceptance-tests:test --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: acceptance-reports
          path: apps/cargo-tracker/backend/acceptance-tests/build/reports/

  frontend:
    name: フロント（型・lint・単体）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/cargo-tracker/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/cargo-tracker/frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  e2e:
    name: E2E（到達性）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: frontend
    defaults:
      run:
        working-directory: apps/cargo-tracker/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/cargo-tracker/frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/cargo-tracker/frontend/playwright-report/

  docs:
    name: ドキュメント（OKF）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx gulp okf:check
