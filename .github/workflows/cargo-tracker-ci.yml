name: Cargo Tracker CI

on:
  push:
    branches:
      - main
      - 'typescript/**'
    paths:
      - 'apps/cargo-tracker/**'
      - '.github/workflows/cargo-tracker-ci.yml'
  pull_request:
    paths:
      - 'apps/cargo-tracker/**'
      - '.github/workflows/cargo-tracker-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/cargo-tracker

jobs:
  verify:
    name: Lint / Typecheck / Arch / Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/cargo-tracker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Architecture rules (dependency-cruiser)
        run: npm run arch

      - name: Unit / Integration tests
        run: npm run test
