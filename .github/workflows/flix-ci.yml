name: Flix CI

# Flix はパッケージマネージャを持たず、コンパイラ本体（flix.jar）と Maven 依存
# （apps/cargo-tracker/lib/）をいずれもネットワークから取得する。どちらもキャッシュしないと
# 毎回のダウンロードでビルド時間の大半を占めるため、両方をキャッシュ対象にする。

on:
  push:
    branches:
      - main
      - 'flix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: flix-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build / test / arch-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # flix.jar は GitHub Releases から取得する固定バージョンの成果物のため、
      # バージョンをキーに含めれば内容が変わることはない。
      - name: Cache the Flix compiler
        uses: actions/cache@v4
        with:
          path: ops/tools/flix
          key: flix-jar-${{ hashFiles('apps/cargo-tracker/flix.toml', 'ops/scripts/develop.js') }}

      # Maven 依存は flix.toml の [mvn-dependencies] から解決される。
      - name: Cache the Maven dependencies
        uses: actions/cache@v4
        with:
          path: apps/cargo-tracker/lib
          key: flix-lib-${{ runner.os }}-${{ hashFiles('apps/cargo-tracker/flix.toml') }}
          restore-keys: |
            flix-lib-${{ runner.os }}-

      - name: Install the Flix compiler
        run: npx gulp dev:setup

      - name: Build
        run: npx gulp dev:build

      # テスト用 DB 名の重複検査。H2 は `DB_CLOSE_DELAY=-1` で JVM の寿命まで
      # DB を保持するため、名前が重なると**別のテストの残骸を引き継ぐ**。
      # 実行時に落ちるのを待たず、名前の一覧を先に検査する。
      # **テストより先に置く**（重複があればテストの結果が信用できない）。
      - name: Test database name lint
        run: npx gulp test:dbnames

      - name: Test
        run: npx gulp dev:test

      # メタテストが落ちた場合、arch-lint の検査結果そのものが信用できないため
      # 検査より先に実行する（arch:check = arch:lint:test → arch:lint）。
      - name: Architecture lint
        run: npm run arch:check

      # カバレッジを計測しないため、トレーサビリティ表が網羅性の唯一の物差しになる。
      # 表と実体のずれは、カバレッジ計測が壊れているのと同義として扱う。
      - name: Traceability lint
        run: npm run trace:lint

      # 運用スクリプト（`arch-lint`・`trace-lint` を含む）の静的解析。
      # **検査器のコードこそ静的解析にかける価値がある**（IT2 で検査器のバグが
      # 「検査をパスしているのに違反している」状態を生んだ）。
      # SonarQube の置き換え（IT5・Try T9）。サーバもトークンも要らず必ず走る
      - name: Script lint
        run: npm run script:lint

  # ブラウザを介した操作を検証する（TS05b）。verify と分けるのは、
  # **ビルド・単体・統合のフィードバックを E2E の所要時間で遅らせない**ため。
  # E2E が見るのは htmx の差し替え・フォームの実送信・Cookie のブラウザ側の扱い
  # であり、統合テスト（同一 JVM 内の HTTP）とは別の層の壊れ方を扱う。
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Cache the Flix compiler
        uses: actions/cache@v4
        with:
          path: ops/tools/flix
          key: flix-compiler-${{ hashFiles('apps/cargo-tracker/flix.toml') }}

      - name: Cache the Maven dependencies
        uses: actions/cache@v4
        with:
          path: apps/cargo-tracker/lib
          key: flix-maven-${{ hashFiles('apps/cargo-tracker/flix.toml') }}

      - name: Install the Flix compiler
        run: npm run dev:setup

      # E2E は fat JAR を起動して検証する。実行形態を本番に近づけるためであり、
      # 「ソースからは動くが JAR では動かない」種類を捕まえられる
      - name: Build the executable JAR
        run: npm run dev:jar

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npm run e2e
        env:
          CI: 'true'

      # 失敗したときだけ追跡材料を残す。再現しない失敗に対して、
      # **記録だけで原因へ辿り着ける**ようにする
      - name: Upload the E2E report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # 依存の脆弱性を走査する。verify と分けているのは、**依存の問題でビルドの
  # フィードバックが遅れないようにする**ためであり、両者に依存関係はない。
  vulnerability-scan:
    name: Trivy (dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      # flix.toml の [mvn-dependencies] と lock ファイル相当を走査する。
      # 実行ステージのイメージ走査は docker-publish.yml の責務とする。
      # `aquasecurity/trivy-action` は使わない。バイナリ導入ステップが
      # GitHub からの取得に失敗すると、**走査に到達しないまま**ジョブが赤くなる
      # （IT4 で実際に遭遇。原因が「脆弱性あり」と区別できず読み違えやすい）。
      # 公式イメージを直接動かせば、赤の意味は「検出あり」だけに絞れる。
      - name: Scan the repository for vulnerable dependencies
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            aquasec/trivy:0.65.0 fs \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --format table \
              /workspace
