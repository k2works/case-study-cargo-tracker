name: CI

on:
  push:
    branches: [ "java/take-3" ]
    paths:
      - "apps/backend/**"
      - "apps/frontend/**"
      - ".github/workflows/**"
  pull_request:
    branches: [ "java/take-3" ]
    paths:
      - "apps/backend/**"
      - "apps/frontend/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  # -------------------------------------------
  # バックエンド: ビルド & テスト
  # -------------------------------------------
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x apps/backend/gradlew

      - name: Build with Gradle
        working-directory: apps/backend
        run: ./gradlew build -x checkstyleMain -x checkstyleTest -x spotbugsMain -x spotbugsTest

      - name: Run Tests
        working-directory: apps/backend
        run: ./gradlew test -x checkstyleMain -x checkstyleTest -x spotbugsMain -x spotbugsTest

      - name: Upload backend JARs
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: apps/backend/*/build/libs/*.jar
          retention-days: 1

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: apps/backend/*/build/reports/tests/
          retention-days: 7

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: apps/backend/*/build/reports/jacoco/
          retention-days: 7

  # -------------------------------------------
  # バックエンド: 品質チェック
  # -------------------------------------------
  backend-quality:
    name: Backend Quality Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x apps/backend/gradlew

      - name: Run Checkstyle
        working-directory: apps/backend
        run: ./gradlew checkstyleMain checkstyleTest
        continue-on-error: true

      - name: Run SpotBugs
        working-directory: apps/backend
        run: ./gradlew spotbugsMain spotbugsTest
        continue-on-error: true

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            apps/backend/*/build/reports/checkstyle/
            apps/backend/*/build/reports/spotbugs/
          retention-days: 7

  # -------------------------------------------
  # フロントエンド: ビルド & テスト
  # -------------------------------------------
  frontend-build:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: apps/frontend
        run: npm install

      - name: Lint
        working-directory: apps/frontend
        run: npm run lint

      - name: Run Tests
        working-directory: apps/frontend
        run: npm test

      - name: Build
        working-directory: apps/frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist/
          retention-days: 1

  # -------------------------------------------
  # E2E テスト
  # -------------------------------------------
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    # US26 認証機能実装完了により有効化

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Download backend JARs
        uses: actions/download-artifact@v4
        with:
          name: backend-jars
          path: apps/backend

      - name: Start Gateway Service
        run: |
          GATEWAY_JAR=$(find apps/backend/gatewayms/build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-plain.jar" | head -n 1)
          if [ -z "$GATEWAY_JAR" ]; then
            echo "Gateway executable jar not found"
            ls -la apps/backend/gatewayms/build/libs || true
            exit 1
          fi
          echo "Starting Gateway with $GATEWAY_JAR"
          java -jar "$GATEWAY_JAR" > gateway.log 2>&1 &
        env:
          PORT: 8080

      - name: Start Auth Service
        run: |
          AUTH_JAR=$(find apps/backend/authms/build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-plain.jar" | head -n 1)
          if [ -z "$AUTH_JAR" ]; then
            echo "Auth executable jar not found"
            ls -la apps/backend/authms/build/libs || true
            exit 1
          fi
          echo "Starting Auth with $AUTH_JAR"
          java -jar "$AUTH_JAR" > auth.log 2>&1 &
        env:
          PORT: 8081

      - name: Start Booking Service
        run: |
          BOOKING_JAR=$(find apps/backend/bookingms/build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-plain.jar" | head -n 1)
          if [ -z "$BOOKING_JAR" ]; then
            echo "Booking executable jar not found"
            ls -la apps/backend/bookingms/build/libs || true
            exit 1
          fi
          echo "Starting Booking with $BOOKING_JAR"
          java -jar "$BOOKING_JAR" \
            --management.health.rabbit.enabled=false \
            > booking.log 2>&1 &
        env:
          PORT: 8082

      - name: Start Routing Service
        run: |
          ROUTING_JAR=$(find apps/backend/routingms/build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-plain.jar" | head -n 1)
          if [ -z "$ROUTING_JAR" ]; then
            echo "Routing executable jar not found"
            ls -la apps/backend/routingms/build/libs || true
            exit 1
          fi
          echo "Starting Routing with $ROUTING_JAR"
          java -jar "$ROUTING_JAR" > routing.log 2>&1 &
        env:
          PORT: 8083

      - name: Wait for backend services
        run: |
          echo "Waiting for backend services..."
          for port in 8080 8081 8082 8083; do
            for i in $(seq 1 30); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:$port/actuator/health || true)
              if [ "$STATUS" = "200" ]; then
                echo "Service on port $port is ready (attempt $i)"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "Service on port $port did not start in time"
                echo "==== gateway.log ===="
                cat gateway.log || true
                echo "==== auth.log ===="
                cat auth.log || true
                echo "==== booking.log ===="
                cat booking.log || true
                echo "==== routing.log ===="
                cat routing.log || true
                exit 1
              fi
              echo "Attempt $i/30: port=$port status=$STATUS, retrying in 5s..."
              sleep 5
            done
          done

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies and start dev server
        working-directory: apps/frontend
        run: |
          npm install
          npx vite --port 3000 &

      - name: Wait for frontend
        run: |
          for i in $(seq 1 15); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 || true)
            if [ "$STATUS" = "200" ]; then
              echo "Frontend is ready (attempt $i)"
              break
            fi
            if [ $i -eq 15 ]; then
              echo "Frontend did not start in time"
              exit 1
            fi
            sleep 2
          done

      - name: Install E2E dependencies
        working-directory: apps/frontend/e2e
        run: npm install

      - name: Install Playwright browsers
        working-directory: apps/frontend/e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: apps/frontend/e2e
        run: npm test
        env:
          BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/e2e/playwright-report/
          retention-days: 7
