name: CI

on:
  push:
    branches: [ "java/take-3" ]
    paths:
      - "apps/backend/**"
      - "apps/frontend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [ "java/take-3" ]
    paths:
      - "apps/backend/**"
      - "apps/frontend/**"

jobs:
  # -------------------------------------------
  # バックエンド: ビルド & テスト
  # -------------------------------------------
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x apps/backend/gradlew

      - name: Build with Gradle
        working-directory: apps/backend
        run: ./gradlew build -x checkstyleMain -x checkstyleTest -x spotbugsMain -x spotbugsTest

      - name: Run Tests
        working-directory: apps/backend
        run: ./gradlew test -x checkstyleMain -x checkstyleTest -x spotbugsMain -x spotbugsTest

      - name: Upload backend JARs
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: apps/backend/*/build/libs/*.jar
          retention-days: 1

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: apps/backend/*/build/reports/tests/
          retention-days: 7

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: apps/backend/*/build/reports/jacoco/
          retention-days: 7

  # -------------------------------------------
  # バックエンド: 品質チェック
  # -------------------------------------------
  backend-quality:
    name: Backend Quality Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x apps/backend/gradlew

      - name: Run Checkstyle
        working-directory: apps/backend
        run: ./gradlew checkstyleMain checkstyleTest
        continue-on-error: true

      - name: Run SpotBugs
        working-directory: apps/backend
        run: ./gradlew spotbugsMain spotbugsTest
        continue-on-error: true

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            apps/backend/*/build/reports/checkstyle/
            apps/backend/*/build/reports/spotbugs/
          retention-days: 7

  # -------------------------------------------
  # フロントエンド: ビルド & テスト
  # -------------------------------------------
  frontend-build:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Lint
        working-directory: apps/frontend
        run: npm run lint

      - name: Run Tests
        working-directory: apps/frontend
        run: npm test

      - name: Build
        working-directory: apps/frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist/
          retention-days: 1

  # -------------------------------------------
  # E2E テスト
  # -------------------------------------------
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Download backend JARs
        uses: actions/download-artifact@v4
        with:
          name: backend-jars
          path: apps/backend

      - name: Start Gateway Service
        run: |
          java -jar apps/backend/gatewayms/build/libs/*.jar &
        env:
          SERVER_PORT: 8080

      - name: Start Auth Service
        run: |
          java -jar apps/backend/authms/build/libs/*.jar &
        env:
          SERVER_PORT: 8081

      - name: Wait for backend services
        run: |
          echo "Waiting for backend services..."
          for port in 8080 8081; do
            for i in $(seq 1 30); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:$port/actuator/health || true)
              if [ "$STATUS" = "200" ]; then
                echo "Service on port $port is ready (attempt $i)"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "Service on port $port did not start in time"
                exit 1
              fi
              echo "Attempt $i/30: port=$port status=$STATUS, retrying in 5s..."
              sleep 5
            done
          done

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/frontend/e2e/package-lock.json

      - name: Install frontend dependencies and start preview
        working-directory: apps/frontend
        run: |
          npm ci
          npx vite preview --port 3000 &

      - name: Wait for frontend
        run: |
          for i in $(seq 1 15); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 || true)
            if [ "$STATUS" = "200" ]; then
              echo "Frontend is ready (attempt $i)"
              break
            fi
            if [ $i -eq 15 ]; then
              echo "Frontend did not start in time"
              exit 1
            fi
            sleep 2
          done

      - name: Install E2E dependencies
        working-directory: apps/frontend/e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/frontend/e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: apps/frontend/e2e
        run: npm test
        env:
          BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/e2e/playwright-report/
          retention-days: 7
