name: CI

on:
  push:
    branches: [ "java/take-1" ]
    paths:
      - "apps/cargo-tracker/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [ "java/take-1" ]
    paths:
      - "apps/cargo-tracker/**"

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x apps/cargo-tracker/gradlew

      - name: Build with Gradle
        working-directory: apps/cargo-tracker
        run: ./gradlew build -x checkstyleMain -x checkstyleTest -x spotbugsMain -x spotbugsTest

      - name: Run Tests
        working-directory: apps/cargo-tracker
        run: ./gradlew test -x checkstyleMain -x checkstyleTest -x spotbugsMain -x spotbugsTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: apps/cargo-tracker/build/reports/tests/
          retention-days: 7
