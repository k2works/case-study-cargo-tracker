name: CI

on:
  push:
    branches:
      - main
      - 'haskell/**'
  pull_request:
    branches:
      - main

# 同じブランチで新しい push があれば古いランをキャンセル
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  STACK_ROOT: /home/runner/.stack
  NIX_SHELL: ops/nix/environments/haskell/shell.nix

jobs:
  # ----------------------------------------------------------------------
  # 高速チェック (Lint / Format) — 失敗を早期検知するため最初に実行
  # ----------------------------------------------------------------------
  quick-checks:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-24.05
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org

      # Magic Nix Cache は GitHub Actions Cache の rate limit (HTTP 418) で
      # substituter が disabled 化し本来の cache.nixos.org からの取得も
      # ブロックされる事象が継続したため、IT2 で一旦除外する。
      # キャッシュ戦略の見直しは IT3 で検討 (cachix or 自前 S3)。

      # IT2 NOTE: nixos-25.05 channel の fourmolu は 0.15.0、ローカル開発 (0.19/0.20)
      # と diff が出るため、format check は警告扱い (continue-on-error) とする。
      # pre-commit hook で format 強制済みのため CI は二重保険の位置付け。
      # 厳密化は nixpkgs 固定 pin + GHC pin 確立後に行う (IT3 検討事項)。
      - name: fourmolu (format check, warn-only)
        working-directory: apps/cargo-tracker
        continue-on-error: true
        run: |
          nix-shell ../../$NIX_SHELL --run "fourmolu --mode check src/ test/ app/"

      - name: HLint
        working-directory: apps/cargo-tracker
        continue-on-error: true
        run: |
          nix-shell ../../$NIX_SHELL --run "hlint src/ test/ app/"

      - name: arch-check (Phase 1, ADR 0002)
        working-directory: apps/cargo-tracker
        run: |
          ./scripts/arch-check.sh src

  # ----------------------------------------------------------------------
  # Haskell ビルド + テスト
  # ----------------------------------------------------------------------
  build-and-test:
    name: Build & Test (GHC 9.10 / Stack)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-24.05
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org

      # Magic Nix Cache は GitHub Actions Cache の rate limit (HTTP 418) で
      # substituter が disabled 化し本来の cache.nixos.org からの取得も
      # ブロックされる事象が継続したため、IT2 で一旦除外する。
      # キャッシュ戦略の見直しは IT3 で検討 (cachix or 自前 S3)。

      # Stack のグローバルキャッシュ (~/.stack) と
      # プロジェクト固有のキャッシュ (.stack-work) を分けて保持
      - name: Cache ~/.stack (依存ライブラリ)
        uses: actions/cache@v4
        with:
          path: ~/.stack
          key: stack-global-${{ runner.os }}-${{ hashFiles('apps/cargo-tracker/stack.yaml.lock') }}
          restore-keys: |
            stack-global-${{ runner.os }}-

      - name: Cache .stack-work (プロジェクト成果物)
        uses: actions/cache@v4
        with:
          path: apps/cargo-tracker/.stack-work
          key: stack-work-${{ runner.os }}-${{ hashFiles('apps/cargo-tracker/package.yaml', 'apps/cargo-tracker/stack.yaml.lock') }}
          restore-keys: |
            stack-work-${{ runner.os }}-

      - name: Stack setup (GHC)
        working-directory: apps/cargo-tracker
        run: |
          nix-shell ../../$NIX_SHELL --run "stack setup"

      # スタブ期間中は --pedantic を外す (IT1 で本実装が入れば全 dep が使われる前提に戻す)。
      # 致命的な -Werror=incomplete-patterns は package.yaml 側で強制中。
      - name: Stack build
        working-directory: apps/cargo-tracker
        run: |
          nix-shell ../../$NIX_SHELL --run "stack build"

      - name: Stack test (with coverage) + HPC しきい値検証 (T-10 / U-06 / U-15)
        working-directory: apps/cargo-tracker
        env:
          # U-15 (IT4): 70 -> 74 段階引き上げ、T4-12 (IT5): 74 -> 75 (HTTP ハンドラ結線後の実測 74.89% を踏まえて gate 引き上げ)
          COVERAGE_MIN_OVERALL: 75
          COVERAGE_TARGET: 78
          # U-06 (IT3): Domain モジュール別の補助 coverage レポートを有効化
          # (IT4 で per-module gate 化検討のための足場)
          COVERAGE_REPORT_MODULES: 1
        run: |
          nix-shell ../../$NIX_SHELL --run "bash scripts/check-coverage.sh"

      - name: HPC カバレッジレポート生成 (HTML)
        working-directory: apps/cargo-tracker
        run: |
          nix-shell ../../$NIX_SHELL --run "stack hpc report --all" || true

      - name: アーティファクト保存 (テストレポート)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            apps/cargo-tracker/.stack-work/install/**/hpc/
            apps/cargo-tracker/.stack-work/logs/
          retention-days: 7

  # ----------------------------------------------------------------------
  # 依存関係セキュリティスキャン
  # ----------------------------------------------------------------------
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub の Dependency Review (PR のみ動作)
      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # ----------------------------------------------------------------------
  # 結果サマリ (Status Check 統合用)
  # ----------------------------------------------------------------------
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [quick-checks, build-and-test, security]
    if: always()
    steps:
      - name: いずれかのジョブが失敗していたら失敗扱い
        run: |
          if [ "${{ needs.quick-checks.result }}" != "success" ] || \
             [ "${{ needs.build-and-test.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] && \
             [ "${{ needs.security.result }}" != "skipped" ]; then
            echo "CI に失敗ジョブがあります"
            exit 1
          fi
          echo "全 CI ジョブが成功しました"
