name: CI

on:
  push:
    branches: [ "java/take-2" ]
    paths:
      - "apps/cargo-tracker/**"
      - "apps/cargo-tracker/e2e/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [ "java/take-2" ]
    paths:
      - "apps/cargo-tracker/**"
      - "apps/cargo-tracker/e2e/**"

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x apps/cargo-tracker/gradlew

      - name: Build with Gradle
        working-directory: apps/cargo-tracker
        run: ./gradlew build -x checkstyleMain -x checkstyleTest -x spotbugsMain -x spotbugsTest

      - name: Run Tests
        working-directory: apps/cargo-tracker
        run: ./gradlew test -x checkstyleMain -x checkstyleTest -x spotbugsMain -x spotbugsTest

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: cargo-tracker-app
          path: apps/cargo-tracker/build/libs/cargo-tracker-0.0.1-SNAPSHOT.jar
          retention-days: 1

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: apps/cargo-tracker/build/reports/tests/
          retention-days: 7

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: cargo-tracker-app
          path: apps/cargo-tracker/build/libs

      - name: Start Spring Boot
        working-directory: apps/cargo-tracker
        run: |
          java -jar build/libs/cargo-tracker-0.0.1-SNAPSHOT.jar > /tmp/cargo-tracker.log 2>&1 &

      - name: Wait for Spring Boot to be ready
        run: |
          echo "Waiting for Spring Boot..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/login || true)
            if [ "$STATUS" = "200" ]; then
              echo "Spring Boot is ready (attempt $i)"
              exit 0
            fi
            echo "Attempt $i/30: status=$STATUS, retrying in 5s..."
            sleep 5
          done
          echo "Spring Boot log:"
          cat /tmp/cargo-tracker.log || true
          echo "Spring Boot did not start in time" && exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/cargo-tracker/e2e/package-lock.json

      - name: Install dependencies
        working-directory: apps/cargo-tracker/e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/cargo-tracker/e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: apps/cargo-tracker/e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/cargo-tracker/e2e/playwright-report/
          retention-days: 7

      - name: Upload Spring Boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-log
          path: /tmp/cargo-tracker.log
          retention-days: 7
