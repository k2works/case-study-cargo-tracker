name: CD Development (Heroku)

on:
  push:
    branches: [main]
    paths:
      - 'apps/cargo-tracker/**'
      - '.github/workflows/cd-dev.yml'
  workflow_dispatch:

concurrency:
  group: cd-dev
  cancel-in-progress: false

env:
  HEROKU_APP_NAME: cargo-tracker-csharp-dev
  IMAGE: registry.heroku.com/cargo-tracker-csharp-dev/web

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Heroku Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.heroku.com
          username: _
          password: ${{ secrets.HEROKU_API_KEY }}

      # Heroku Registry は OCI マニフェスト・provenance を受け付けないため
      # docker schema2 形式で直接 push する（開発環境セットアップ手順書 参照）
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: apps/cargo-tracker
          file: apps/cargo-tracker/src/CargoTracker.Web/Dockerfile
          platforms: linux/amd64
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},oci-mediatypes=false,push=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Release to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          curl -fsSL https://cli-assets.heroku.com/install.sh | sh
          heroku container:release web -a "$HEROKU_APP_NAME"

      - name: Smoke test
        run: |
          for i in $(seq 1 12); do
            status=$(curl -s https://cargo-tracker-csharp-dev-6b9de207022a.herokuapp.com/health || true)
            if [ "$status" = "Healthy" ]; then
              echo "health: $status"
              exit 0
            fi
            sleep 10
          done
          echo "ヘルスチェックが Healthy になりませんでした" >&2
          exit 1
