name: CI - Backend

on:
  push:
    branches: [main, "java/take-4"]
    paths:
      - "apps/backend/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/backend/**"
      - ".github/workflows/ci-backend.yml"

defaults:
  run:
    working-directory: apps/backend

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/backend/**/*.gradle*', 'apps/backend/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest --no-daemon

      - name: SpotBugs
        run: ./gradlew spotbugsMain spotbugsTest --no-daemon

      - name: Test
        run: ./gradlew test --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            apps/backend/**/build/reports/tests/
            apps/backend/**/build/reports/checkstyle/
            apps/backend/**/build/reports/spotbugs/

      - name: Generate test summary
        if: always()
        run: |
          echo "## Backend CI 結果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| チェック | 結果 |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Checkstyle | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| SpotBugs   | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| テスト     | ✅ |" >> $GITHUB_STEP_SUMMARY
