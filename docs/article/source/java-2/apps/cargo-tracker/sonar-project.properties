# SonarQube のスキャン設定。
#
# scanType は sonar-scanner（npx sonarqube-scanner）を使う。gradle 経由にしないのは、
# 運用スクリプトが system の `gradle` を呼ぶためであり、本プロジェクトは
# ラッパー（9.2.1）で版を固定している（system の Gradle は 8.14.3）。
#
# 品質基準の正典は docs/design/test_strategy.md §6 である。ここに値を書き写さない。
sonar.projectKey=cargo-tracker-java-backend
sonar.projectName=Cargo Tracker Backend (java/take-6)

sonar.sources=src/main/java
sonar.tests=src/test/java

# 解析にはコンパイル済みクラスが要る。無いと Java の解析が丸ごとスキップされ、
# **「指摘 0 件」がそのまま緑になる**（何も検査していない緑）。
sonar.java.binaries=build/classes/java/main
sonar.java.test.binaries=build/classes/java/test
sonar.java.libraries=build/tmp/sonar-libs/*.jar

sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
sonar.junit.reportPaths=build/test-results/test

sonar.sourceEncoding=UTF-8

# Thymeleaf のフラグメント（layout / fragments）は単体のページではない。
# <title> が無いのは欠陥ではなく、そういう部品である。
# **「直すのが面倒」ではなく「検出が誤りである」ことを理由に除外する。**
sonar.exclusions=src/main/resources/templates/layout/**,src/main/resources/templates/fragments/**

# 境界の DTO（画面のフォームと DB の行）は、同じ項目を持つがゆえに重複として検出される。
# **これは意図した重複である。** 統合すると画面の変更がテーブルに、テーブルの変更が画面に
# 波及する。層ごとに別の型を持つのは、その波及を断つためである（architecture_backend.md）。
#
# 除外は「検出が誤りである」場合に限る。**アダプタの DTO 以外に広げないこと。**
# ドメインやアプリケーション層の重複は本当の重複であり、除外してはならない。
sonar.cpd.exclusions=src/main/java/**/interfaces/web/*Form.java,src/main/java/**/infrastructure/repositories/*Record.java

# java:S2187（TestCases should contain tests）を、入れ子テストクラスを持つ
# テストに限って除外する。
#
# **検出が誤りである。** JUnit 5 の @Nested の中にあるテストを数えないため、
# 「テストが 1 件も無いクラス」と判定される。実際にはテストは存在し実行されている
# （本 IT 時点で 1,256 件）。**入れ子テストクラスは本プロジェクトの確立した慣行**であり、
# 19 のテストクラスが同じ形で書かれている（IT13 で新規に書いた 4 クラスだけが
# 「新規コード」としてゲートに現れた）。
#
# **構造を崩して緑にしない。** @Nested は「生成」「丸め規則」「加算」のような
# 業務の区切りでテストを束ねており、読み手が仕様を追う手がかりになっている。
# ルールに合わせて平らにすると、その手がかりが消える。
#
# **見逃すリスクは別の手段で埋めている。** 「テストが 1 件も無いクラス」は
# Gradle のテスト実行件数（build/test-results）で分かる。
sonar.issue.ignore.multicriteria=nestedTests
sonar.issue.ignore.multicriteria.nestedTests.ruleKey=java:S2187
sonar.issue.ignore.multicriteria.nestedTests.resourceKey=**/*Test.java
