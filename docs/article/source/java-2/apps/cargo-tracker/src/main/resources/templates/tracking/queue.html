<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>追跡番号発行待ち | Cargo Tracker</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<nav th:replace="~{layout/nav :: navbar}"></nav>
<main class="container py-4">
  <div th:replace="~{fragments/alerts :: alerts}"></div>
  <h1 class="h4 mb-3">追跡番号発行待ち</h1>

  <!--/* 空状態。0 件のとき理由と次アクションを示す（ui_design.md） */-->
  <div th:if="${bookings.isEmpty()}" class="alert alert-info">
    追跡番号発行待ちの予約はありません。営業担当者が予約を確定すると、ここに現れます。
  </div>

  <!--/* **列が多い表は横に送る**（IT17 の R7）。幅が足りないと
         Bootstrap は列を潰して折り返し、金額が縦に割れ日付が 2 行になる。
         **列は隠さない** — どの列が要るかは場面で変わる */-->
  <div class="table-responsive">
    <table th:unless="${bookings.isEmpty()}" class="table table-hover bg-white">
      <thead>
        <tr>
          <th>予約 ID</th><th>荷主</th><th>出発地</th><th>目的地</th>
          <th>希望期限</th><th>残り</th><th>貨物種別</th><th>重量</th><th>操作</th>
        </tr>
      </thead>
      <tbody>
        <!--/* 並び順は希望期限の昇順。追跡管理者が朝に見るのは
               「どれが一番切羽詰まっているか」である（経路割り当て待ちと同じ） */-->
        <tr th:each="b : ${bookings.items()}">
          <td><code th:text="${#strings.substring(b.bookingId(), 0, 8)}">BK-1234</code></td>
          <td th:text="${b.shipper().name()}">荷主名</td>
          <td th:text="${b.delivery().origin()}">JPOSA</td>
          <td th:text="${b.delivery().destination()}">USLAX</td>
          <td th:text="${b.delivery().arrivalDeadline()}">2026-04-15</td>
          <!--/* 残り日数の色は BookingView が決める（ui_design.md が正典）。
                 **画面で日数を比べて分岐しない。** 一覧ごとに閾値がずれる */-->
          <td th:classappend="${b.delivery().deadlineUrgencyClass()}"
              th:text="${b.delivery().daysUntilDeadline() >= 0}
                       ? ${b.delivery().daysUntilDeadline()} + ' 日'
                       : '期限超過'">14 日</td>
          <td th:text="${b.cargo().typeLabel()}">一般貨物</td>
          <td th:text="${b.cargo().weight()} + ' kg'">1200 kg</td>
          <!--/* 作業入口から実際の作業へ。一覧を見た後に何もできない状態にしない。
                 発行そのものは予約詳細で行う（予約の内容を確かめてから押す） */-->
          <td>
            <a class="btn btn-sm btn-primary"
               th:href="@{/bookings/{id}(id=${b.bookingId()})}">予約を開いて発行</a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <nav th:replace="~{fragments/pagination :: pagination(${bookings}, '/tracking/queue', ${query})}"></nav>

  <!--/* 追跡中の貨物（US17 の作業入口）。

         **状態を手で更新するには、まず対象にたどり着けなければならない。**
         上の発行待ち一覧は発行した時点でその予約が消えるため、発行後の貨物へ
         画面から到達する手段が無かった。追跡番号を覚えている追跡管理者はいない。 */-->
  <h2 class="h5 mt-5 mb-3">追跡中の貨物</h2>

  <!--/* **列に出しているのは予約のステータスであり、輸送状態ではない。**
         手で入れた出港（搭載中）はここには出ない。輸送状態は Tracking Context が持ち
         （ADR-005）、この一覧は Booking 側のクエリで作っているためである。
         輸送状態を並べるには一覧の持ち主を Tracking へ移す判断が要る（IT9 で判断）。 */-->
  <div th:if="${inTransit.items().isEmpty()}" class="alert alert-secondary">
    追跡中の貨物はありません。追跡番号を発行すると、ここに現れます。
  </div>

  <table th:unless="${inTransit.items().isEmpty()}" class="table table-hover bg-white align-middle">
    <thead>
      <tr>
        <th>追跡番号</th><th>出発地</th><th>目的地</th><th>希望期限</th>
        <th>予約ステータス</th><th></th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="b : ${inTransit.items()}">
        <td><code th:text="${b.tracking().number()}">TRK-20260401-0042</code></td>
        <td th:text="${b.delivery().origin()}">JPOSA</td>
        <td th:text="${b.delivery().destination()}">USLAX</td>
        <td th:text="${b.delivery().arrivalDeadline()}">2026-04-15</td>
        <td>
          <span class="badge" th:classappend="${b.status().badgeClass()}"
                th:text="${b.status().label()}">輸送中</span>
        </td>
        <!--/* 一覧を見た後に何もできない状態にしない。**状態の更新は追跡詳細で行う**
               （現在の状態を見ながら判断するため） */-->
        <td>
          <a class="btn btn-sm btn-outline-primary"
             th:href="@{/tracking/{n}(n=${b.tracking().number()})}">状態を確認・更新</a>
        </td>
      </tr>
    </tbody>
  </table>
</main>
</body>
</html>
