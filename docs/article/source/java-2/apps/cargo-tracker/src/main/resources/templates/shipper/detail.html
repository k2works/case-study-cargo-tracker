<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>荷主詳細 | Cargo Tracker</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
</head>
<body class="bg-light">
<nav th:replace="~{layout/nav :: navbar}"></nav>
<main class="container py-4">
  <div th:replace="~{fragments/alerts :: alerts}"></div>
  <h1 class="h4 mb-3">荷主詳細</h1>
  <div class="card bg-white">
    <div class="card-body">
      <dl class="row mb-0">
        <dt class="col-sm-3">荷主コード</dt>
        <dd class="col-sm-9" th:text="${shipper.shipperCode()}">SHP-000001</dd>
        <dt class="col-sm-3">荷主名</dt>
        <dd class="col-sm-9" th:text="${shipper.name()}">荷主名</dd>
        <dt class="col-sm-3">種別</dt>
        <dd class="col-sm-9" th:text="${shipper.typeLabel()}">個人</dd>
        <!--/* 法人契約（US03）。**個人荷主には行そのものを出さない。**
               「-」を並べるより、概念が無いことが読み取れる */-->
        <th:block th:if="${shipper.hasContract()}">
          <dt class="col-sm-3">契約番号</dt>
          <dd class="col-sm-9" th:text="${shipper.contractNumber()}">CT-2026-0001</dd>
          <dt class="col-sm-3">契約割引率</dt>
          <dd class="col-sm-9"
              th:text="${shipper.discountRatePercentage()} + ' %'">10 %</dd>
        </th:block>
        <dt class="col-sm-3">メール</dt>
        <dd class="col-sm-9" th:text="${shipper.email()}">mail@example.com</dd>
        <dt class="col-sm-3">電話番号</dt>
        <dd class="col-sm-9" th:text="${shipper.phone() != ''} ? ${shipper.phone()} : '-'">-</dd>
        <dt class="col-sm-3">住所</dt>
        <dd class="col-sm-9">
          <!--/* 国際貨物のシステムで仕向地国が確認できないのは業務上おかしい */-->
          <span th:text="${shipper.addressCountry()}"></span>
          <span th:text="${shipper.addressPostalCode()}"></span>
          <span th:text="${shipper.addressRegion()}"></span>
          <span th:text="${shipper.addressCity()}"></span>
          <span th:text="${shipper.addressStreet()}"></span>
        </dd>
      </dl>
    </div>
  </div>
  <!--/* **この荷主でログインできる利用者**（ADR-013 / C11）。
         荷主から「自分で予約を見たい」と言われた営業担当者が、
         すでに使えるのかどうかをここで答えられる。
         **無いことを空欄にしない** — 空欄は「まだ調べていない」とも読める。
         次に何をすればよいか（案内先）まで書く。
         **読み取り専用である。** 紐付けの設定は運用手順で行う（ADR-013 の代償）。
         画面に操作を置くと、手順書と画面のどちらが正なのか分からなくなる。 */-->
  <div class="card bg-white mt-3">
    <div class="card-body">
      <h2 class="h6">ログインできる利用者</h2>
      <ul th:unless="${linkedUsernames.isEmpty()}" class="mb-0">
        <li th:each="u : ${linkedUsernames}" th:text="${u}">shipper1</li>
      </ul>
      <p th:if="${linkedUsernames.isEmpty()}" class="text-muted mb-0">
        この荷主に紐付いた利用者はありません。荷主が自分で予約を照会するには
        紐付けの設定が要ります。<strong>システム管理担当</strong>へ荷主コードを添えて依頼してください。
      </p>
    </div>
  </div>

  <div class="mt-3 d-flex gap-2">
    <a class="btn btn-outline-secondary" th:href="@{/shippers}">荷主一覧に戻る</a>
    <a class="btn btn-outline-primary" th:href="@{/shippers/{id}/edit(id=${shipper.id()})}">編集</a>
    <!--/* 登録直後にそのまま予約へ進めるようにする。荷主コードを覚えて
           画面を往復するのが現場で最もストレスになる（IT1 のユーザー代表レビュー） */-->
    <a class="btn btn-primary"
       th:href="@{/bookings/new(shipperCode=${shipper.shipperCode()})}">この荷主で予約する</a>
  </div>
</main>
</body>
</html>
