@()(implicit request: RequestHeader, flash: Flash, messages: play.api.i18n.Messages)
@views.html.layout.main("貨物追跡照会") {
  <h1 class="h3 mb-3">貨物追跡照会</h1>
  @flash.get("error").map { msg =>
    <div class="alert alert-danger">@msg</div>
  }
  <form method="POST" action="@cargotracker.tracking.interfaces.web.routes.TrackingController.lookup()" class="mb-3">
    @helper.CSRF.formField
    <div class="mb-3">
      <label class="form-label">追跡番号</label>
      <input type="text" name="trackingNumber" class="form-control" placeholder="TN-000001" required maxlength="20">
    </div>
    <button type="submit" class="btn btn-primary">照会</button>
  </form>
  <p class="text-muted">追跡番号は予約確定後に経路設計者が発行し、メール通知されます。</p>
}
