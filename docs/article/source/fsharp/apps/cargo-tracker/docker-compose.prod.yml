# CargoTracker 本番相当スタック（PostgreSQL + アプリ）。
# 使い方:
#   cp .env.production.example .env.production
#   （.env.production を編集して秘密情報を設定）
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# アプリは起動時に forward-only マイグレーション（db/scripts/postgresql）を適用する。
# 本番はサンプルデータを投入せず、Seed__AdminUsername / Seed__AdminPassword から管理者のみ初期投入する。

services:
  db:
    image: postgres:16
    container_name: cargo-tracker-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cargo_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-cargo_tracker}
    volumes:
      - cargo-tracker-prod-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cargo_tracker} -d ${POSTGRES_DB:-cargo_tracker}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 本番では DB ポートを外部公開しない（アプリからのみ接続）。必要時のみ ports を有効化する。

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cargo-tracker-web:latest
    container_name: cargo-tracker-prod-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      Database__Provider: postgresql
      Database__ScriptsRoot: /app/db/scripts
      Database__ConnectionString: >-
        Host=db;Port=5432;Database=${POSTGRES_DB:-cargo_tracker};Username=${POSTGRES_USER:-cargo_tracker};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      Seed__SampleData: "false"
      Seed__AdminUsername: ${ADMIN_USERNAME:-admin}
      Seed__AdminPassword: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  cargo-tracker-prod-db-data:
