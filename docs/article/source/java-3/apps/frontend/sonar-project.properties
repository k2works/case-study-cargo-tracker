# フロントエンドの SonarQube 設定。
# プロジェクトキーと接続情報は sonar-local:scan がコマンドラインで渡す。
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=src/mocks/**,src/test/**,dist/**,node_modules/**
# 動作確認用のモックは本番の成果物に含まれない（ADR-006）ため、品質の判定対象から外す
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
