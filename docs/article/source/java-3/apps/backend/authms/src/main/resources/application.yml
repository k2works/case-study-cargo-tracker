spring:
  application:
    name: authms
  datasource:
    url: ${DB_URL:jdbc:h2:mem:auth_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Tokyo


app:
  # 業務日付は業務タイムゾーンで判断する。UTC で判断すると、時差の分だけ「当日」の扱いが
  # ずれる時間帯ができる
  business-time-zone: ${BUSINESS_TIME_ZONE:Asia/Tokyo}
  jwt:
    # 検証側（gatewayms）と同じ値を設定する。鍵を持つのはこの 2 サービスだけである（ADR-004）
    secret: ${JWT_SECRET:local-development-secret-key-please-override-in-every-real-environment}
    validity-minutes: ${JWT_VALIDITY_MINUTES:480}

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
