sonar.projectKey=cargo-tracker-ruby-backend
sonar.projectName=Cargo Tracker Backend (Ruby/Rails)

# 解析対象（アプリ本体・パック・カスタム cop）
sonar.sources=app,packs,lib,config,db
sonar.tests=spec

# 除外（生成物・アセット・カバレッジ成果物・ベンダー）
# 注: pack の app/public（公開 API）は解析対象。Rails 静的 public/ は sonar.sources 外なので除外不要。
sonar.exclusions=**/db/schema.rb,**/db/migrate/**,**/vendor/**,**/coverage/**,**/tmp/**,**/log/**,**/storage/**,**/node_modules/**,**/bin/**

# SimpleCov の JSON formatter 出力（coverage/coverage.json）を連携
sonar.ruby.coverage.reportPaths=coverage/coverage.json

sonar.sourceEncoding=UTF-8
