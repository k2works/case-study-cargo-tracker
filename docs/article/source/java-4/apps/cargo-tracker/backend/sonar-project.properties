# バックエンドの SonarQube 設定。プロジェクトキーと接続情報は sonar-local:scan が渡す。
#
# 品質基準の正典は docs/design/cargo-tracker/test_strategy.md である。ここに値を書き写さない。
#
# Gradle のマルチプロジェクトなので、モジュールごとに sources / binaries を指定する。
# **解析にはコンパイル済みクラスが要る。** 無いと Java の解析が丸ごと飛ばされ、
# 「指摘 0 件」がそのまま緑になる（何も検査していない緑）。

sonar.sourceEncoding=UTF-8
sonar.modules=shared,gatewayms,authms,bookingms,routingms,trackingms,handlingms,billingms

shared.sonar.projectName=shared
shared.sonar.projectBaseDir=shared
shared.sonar.sources=src/main/java
shared.sonar.tests=src/test/java
shared.sonar.java.binaries=build/classes/java/main
shared.sonar.java.test.binaries=build/classes/java/test
shared.sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
shared.sonar.junit.reportPaths=build/test-results/test
gatewayms.sonar.projectName=gatewayms
gatewayms.sonar.projectBaseDir=gatewayms
gatewayms.sonar.sources=src/main/java
gatewayms.sonar.tests=src/test/java
gatewayms.sonar.java.binaries=build/classes/java/main
gatewayms.sonar.java.test.binaries=build/classes/java/test
gatewayms.sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
