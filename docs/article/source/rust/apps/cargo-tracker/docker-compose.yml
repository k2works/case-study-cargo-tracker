services:
  postgres:
    image: postgres:16
    container_name: cargo-tracker-postgres
    environment:
      POSTGRES_DB: cargo_tracker
      POSTGRES_USER: cargo
      POSTGRES_PASSWORD: cargo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cargo -d cargo_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
