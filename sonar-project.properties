# SonarQube スキャン設定
#
# **重要**: SonarQube は Flix を解析できない（サポート言語に含まれない）。
# したがって本設定のスキャン対象は **Node.js の運用スクリプト**（arch-lint を含む）に限る。
# アプリケーション本体（Flix）の品質は以下で担保する（docs/design/test_strategy.md 6.1）。
#
#   - arch-lint（アーキテクチャ規約の機械検査 + メタテスト）
#   - セキュリティ回帰テスト（テスト戦略 8.4）
#   - ビジネスルール ⇄ テスト トレーサビリティ（カバレッジ計測の代替）
#
# arch-lint 自身は検査器であり、そのバグが「検査をパスしているのに違反している」状態を
# 生む。**検査器のコードこそ静的解析にかける価値がある**ため、スキャン対象に含めている。

sonar.projectKey=cargo-tracker-flix
sonar.projectName=CargoTracker (Flix take-1)
sonar.projectVersion=0.1.0

# Flix は解析対象外のため、ソースは運用スクリプトのみを指定する
sonar.sources=ops/scripts
sonar.exclusions=ops/scripts/arch-lint/fixtures/**

sonar.sourceEncoding=UTF-8

# カバレッジは計測しない（Flix にツールがなく、JS 側はテストランナーを持たない）。
# 代替統制はテスト戦略 6.1 を参照
