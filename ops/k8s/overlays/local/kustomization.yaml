apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: cargo-tracker
      spec:
        type: NodePort
        ports:
          - port: 9000
            targetPort: 9000
            nodePort: 30900
    target:
      kind: Service
      name: cargo-tracker
