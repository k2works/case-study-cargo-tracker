apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatewayms
spec:
  replicas: 1
  selector:
    matchLabels: { app: gatewayms }
  template:
    metadata:
      labels: { app: gatewayms }
    spec:
      containers:
        - name: gatewayms
          image: cargo-tracker/gatewayms:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: SERVER_PORT, value: "8080" }
            - { name: AXON_SERVER, value: "axonserver:8124" }
            - name: CARGO_TRACKER_JWT_SECRET
              valueFrom:
                secretKeyRef: { name: cargo-tracker-jwt, key: secret }
            - { name: AUTHMS_URI, value: "http://authms:8081" }
            - { name: BOOKINGMS_URI, value: "http://bookingms:8082" }
            - { name: ROUTINGMS_URI, value: "http://routingms:8083" }
            - { name: TRACKINGMS_URI, value: "http://trackingms:8084" }
            - { name: HANDLINGMS_URI, value: "http://handlingms:8085" }
            - { name: BILLINGMS_URI, value: "http://billingms:8086" }
          ports:
            - { name: http, containerPort: 8080 }
          # ヘルスチェックは認証を求めない経路に置く。守ると 401 で再起動ループに入る。
          readinessProbe:
            httpGet: { path: /actuator/health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health, port: http }
            # 起動時に Axon Server への接続を検査するので、起動は遅い。
            # 短くすると、検査が終わる前に殺されて上がらなくなる。
            initialDelaySeconds: 120
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: gatewayms
spec:
  selector: { app: gatewayms }
  ports:
    - { port: 8080, targetPort: http }
---
