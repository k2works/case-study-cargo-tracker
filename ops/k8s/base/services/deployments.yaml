      containers:
        - name: authms
          image: cargo-tracker/authms:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: SERVER_PORT, value: "8081" }
            - { name: AXON_SERVER, value: "axonserver:8124" }
            # Spring のリラックスバインディングはハイフンを除くので
            # cargo-tracker.jwt.secret に対応する環境変数は CARGOTRACKER_JWT_SECRET。
            # CARGO_TRACKER_JWT_SECRET は cargo.tracker.jwt.secret に束縛され、誰も読まない。
            - name: CARGOTRACKER_JWT_SECRET
              valueFrom:
                secretKeyRef: { name: cargo-tracker-jwt, key: secret }
            # 本番相当では開発用の既定鍵で起動しない。
            - { name: CARGOTRACKER_PRODUCTIONLIKE, value: "true" }
            - { name: DB_URL, value: "jdbc:postgresql://postgres:5432/auth_db" }
            - { name: DB_USER, value: "authms" }
            - { name: DB_PASSWORD, value: "authms" }
            # 動作確認用の利用者を入れる（ADR-0004）。**ローカルの kind クラスタ限定**で、
            # 既定は無効。この overlay は開発者の手元だけで動くもので、業務データは置かない。
            # cargo-tracker.demo-users に対応する環境変数（ハイフンは落ちる）。
