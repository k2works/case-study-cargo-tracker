apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookingms
spec:
  replicas: 1
  # 入れ替えは「先に消してから作る」。既定の RollingUpdate だと、新しい Pod が
  # Ready になるまで古い Pod が残り、単一ノードの kind では JVM が 2 倍立つ。
  # 実測では CPU が飽和し、Axon Server の起動が 2 分以上に延びて全体が上がらなかった。
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: bookingms }
  template:
    metadata:
      labels: { app: bookingms }
    spec:
      # Axon Server が上がるまで待つ。業務サービスは起動時に接続を検査して、
      # 繋がらなければ**起動を止める**（AxonServerStartupCheck）。待たずに一斉に
      # 立てると、7 サービスが同時に落ちては再起動を繰り返し、単一ノードの kind では
      # その CPU で Axon Server 自身の起動がさらに遅れる（実測: CPU 681%、起動 2 分超）。
      initContainers:
        - name: wait-for-axonserver
          image: curlimages/curl:8.11.1
          command:
            - sh
            - -c
            - |
              until curl -fsS http://axonserver:8024/actuator/health > /dev/null; do
                echo "Axon Server を待っています..."
                sleep 5
              done
      containers:
        - name: bookingms
          image: cargo-tracker/bookingms:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: SERVER_PORT, value: "8082" }
            - { name: AXON_SERVER, value: "axonserver:8124" }
            # 署名鍵は配らない。後段サービスは署名を再検証しない分担なので
            # （ADR-0001 決定 4）、読まないサービスに秘密を配ると漏洩面が増えるだけ。
            - { name: DB_URL, value: "jdbc:postgresql://postgres:5432/booking_read_db" }
            - { name: DB_USER, value: "bookingms" }
            - { name: DB_PASSWORD, value: "bookingms" }
            # シミュレーション由来の印を受け付けるか（US33 §3 / ADR-0020）。
            # **印は業務の一覧から荷主と貨物を消す**ので、許可した環境でだけ
            # 受け付ける。本番では立てない。
            - { name: CARGOTRACKER_SIMULATION_ENABLED, value: "true" }
          ports:
            - { name: http, containerPort: 8082 }
          volumeMounts:
            # 荷主ごとの鍵置き場（ADR-0003 決定 2 のローカル実装）。
            # **Pod の寿命に載せない。** 鍵を失うと、暗号化済みの荷主データは
            # 二度と読めない——破棄したのと同じことになる。
            # 本番は KMS の実装を当てるので、この PVC はローカル・CI 限りである。
            - { name: shipper-keys, mountPath: /app/.keys }
          # ヘルスチェックは認証を求めない経路に置く。守ると 401 で再起動ループに入る。
          readinessProbe:
            httpGet: { path: /actuator/health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health, port: http }
            # 起動時に Axon Server への接続を検査するので、起動は遅い。
            # 短くすると、検査が終わる前に殺されて上がらなくなる。
            initialDelaySeconds: 120
            periodSeconds: 20
      volumes:
        - name: shipper-keys
          persistentVolumeClaim: { claimName: bookingms-shipper-keys }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bookingms-shipper-keys
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: bookingms
spec:
  selector: { app: bookingms }
  ports:
    - { port: 8082, targetPort: http }
---
