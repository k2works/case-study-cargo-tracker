kind: Deployment
metadata:
  name: simulationms
spec:
  replicas: 1
  # 入れ替えは「先に消してから作る」（他サービスと同じ理由）。
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: simulationms }
  template:
    metadata:
      labels: { app: simulationms }
    spec:
      # Axon Server が上がるまで待つ（共有設定が起動時に接続を検査する）。
      initContainers:
        - name: wait-for-axonserver
          image: curlimages/curl:8.11.1
          command:
            - sh
            - -c
            - |
              until curl -fsS http://axonserver:8024/actuator/health > /dev/null; do
                echo "Axon Server を待っています..."
                sleep 5
              done
      containers:
        - name: simulationms
          image: cargo-tracker/simulationms:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: SERVER_PORT, value: "8087" }
            - { name: AXON_SERVER, value: "axonserver:8124" }
            - { name: DB_URL, value: "jdbc:postgresql://postgres:5432/simulation_read_db" }
            - { name: DB_USER, value: "simulationms" }
            - { name: DB_PASSWORD, value: "simulationms" }
            # **本番では有効にしない**（US33 §受入基準 4）。kind は開発クラスタなので
            # 有効にする。名前は推測させず、application.yml で明示的に受けている。
            - { name: CARGOTRACKER_SIMULATION_ENABLED, value: "true" }
            # **継続実行はもう 1 段の許可が要る**（US36 §受入基準 6）。流し続ける
            # 側は業務を止めうるので、「実行できる環境＝流し続けてよい環境」に
            # しない。kind は開発クラスタなので有効にする。
            - { name: CARGOTRACKER_SIMULATION_SCHEDULE_ENABLED, value: "true" }
            # **間を空ける。** 0 にすると業務が止まる（この局面に固有の危険 3）。
            - { name: CARGOTRACKER_SIMULATION_SCHEDULE_INTERVAL, value: "30s" }
            - { name: CARGOTRACKER_SIMULATION_SCHEDULE_MAX_CONCURRENT, value: "2" }
            - { name: CARGOTRACKER_SIMULATION_SCHEDULE_EXCEPTION_RATIO, value: "0.2" }
            # 工程は **Gateway 経由**で本番の API を叩く（[ADR-0020] 決定 2）。
            # サービスを直接指すと認可を通らず、確かめたいものが変わる。
            - { name: GATEWAY_URL, value: "http://gatewayms:8080" }
          ports:
            - { name: http, containerPort: 8087 }
          # ヘルスチェックは認証を求めない経路に置く。守ると 401 で再起動ループに入る。
          readinessProbe:
            httpGet: { path: /actuator/health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health, port: http }
            initialDelaySeconds: 120
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: simulationms
spec:
  selector: { app: simulationms }
  ports:
    - { port: 8087, targetPort: http }
