apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatewayms
spec:
  replicas: 1
  # 入れ替えは「先に消してから作る」。既定の RollingUpdate だと、新しい Pod が
  # Ready になるまで古い Pod が残り、単一ノードの kind では JVM が 2 倍立つ。
  # 実測では CPU が飽和し、Axon Server の起動が 2 分以上に延びて全体が上がらなかった。
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: gatewayms }
  template:
    metadata:
      labels: { app: gatewayms }
    spec:
      # Axon Server が上がるまで待つ。業務サービスは起動時に接続を検査して、
      # 繋がらなければ**起動を止める**（AxonServerStartupCheck）。待たずに一斉に
      # 立てると、7 サービスが同時に落ちては再起動を繰り返し、単一ノードの kind では
      # その CPU で Axon Server 自身の起動がさらに遅れる（実測: CPU 681%、起動 2 分超）。
      initContainers:
        - name: wait-for-axonserver
          image: curlimages/curl:8.11.1
          command:
            - sh
            - -c
            - |
              until curl -fsS http://axonserver:8024/actuator/health > /dev/null; do
                echo "Axon Server を待っています..."
                sleep 5
              done
      containers:
        - name: gatewayms
          image: cargo-tracker/gatewayms:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: SERVER_PORT, value: "8080" }
            - { name: AXON_SERVER, value: "axonserver:8124" }
            # Spring のリラックスバインディングはハイフンを除くので
            # cargo-tracker.jwt.secret に対応する環境変数は CARGOTRACKER_JWT_SECRET。
            # CARGO_TRACKER_JWT_SECRET は cargo.tracker.jwt.secret に束縛され、誰も読まない。
            - name: CARGOTRACKER_JWT_SECRET
              valueFrom:
                secretKeyRef: { name: cargo-tracker-jwt, key: secret }
            # 本番相当では開発用の既定鍵で起動しない。
            - { name: CARGOTRACKER_PRODUCTIONLIKE, value: "true" }
            - { name: AUTHMS_URI, value: "http://authms:8081" }
            - { name: BOOKINGMS_URI, value: "http://bookingms:8082" }
            - { name: ROUTINGMS_URI, value: "http://routingms:8083" }
            - { name: TRACKINGMS_URI, value: "http://trackingms:8084" }
            - { name: HANDLINGMS_URI, value: "http://handlingms:8085" }
            - { name: BILLINGMS_URI, value: "http://billingms:8086" }
            - { name: SIMULATIONMS_URI, value: "http://simulationms:8087" }
          ports:
            - { name: http, containerPort: 8080 }
          # ヘルスチェックは認証を求めない経路に置く。守ると 401 で再起動ループに入る。
          readinessProbe:
            httpGet: { path: /actuator/health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health, port: http }
            # 起動時に Axon Server への接続を検査するので、起動は遅い。
            # 短くすると、検査が終わる前に殺されて上がらなくなる。
            initialDelaySeconds: 120
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: gatewayms
spec:
  selector: { app: gatewayms }
  ports:
    - { port: 8080, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authms
spec:
  replicas: 1
  # 入れ替えは「先に消してから作る」。既定の RollingUpdate だと、新しい Pod が
  # Ready になるまで古い Pod が残り、単一ノードの kind では JVM が 2 倍立つ。
