apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# cargo-tracker のローカル・ステージング共通の土台。
# 環境差（イメージのタグ・レプリカ数・永続化の当て方）は overlay で当てる。

resources:
  - axonserver/statefulset.yaml
  - postgres/statefulset.yaml
  - services/deployments.yaml

configMapGenerator:
  - name: postgres-init
    files:
      - postgres/init-databases.sql

secretGenerator:
  - name: postgres-credentials
    literals:
      - password=postgres
  - name: cargo-tracker-jwt
    literals:
      # 開発用。ステージング以降は overlay で外部シークレットに差し替える。
      - secret=cargo-tracker-development-secret-key-32bytes!

generatorOptions:
  disableNameSuffixHash: false
