apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# cargo-tracker のローカル・ステージング共通の土台。
# 環境差（イメージのタグ・レプリカ数・永続化の当て方）は overlay で当てる。

resources:
  - axonserver/statefulset.yaml
  - postgres/statefulset.yaml
  - services/deployments.yaml

configMapGenerator:
  - name: postgres-init
    files:
      - postgres/init-databases.sql

secretGenerator:
  - name: postgres-credentials
    literals:
      - password=postgres
  - name: cargo-tracker-jwt
    literals:
      # クラスタ用の鍵。**JwtSecret.DEVELOPMENT_SECRET と同じ値を置かないこと。**
      # サービスは CARGOTRACKER_PRODUCTIONLIKE=true で開発用の既定鍵を拒むため、
      # 同じ値を置くと gatewayms と authms が起動できない（CrashLoopBackOff）。
      # ステージング以降は overlay で外部シークレットに差し替える。
      - secret=cargo-tracker-local-cluster-signing-key-48bytes-long

generatorOptions:
  disableNameSuffixHash: false
