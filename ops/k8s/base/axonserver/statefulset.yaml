apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: axonserver
spec:
  serviceName: axonserver
  replicas: 1
  selector:
    matchLabels: { app: axonserver }
  template:
    metadata:
      labels: { app: axonserver }
    spec:
      containers:
        - name: axonserver
          image: axoniq/axonserver:2026.0.4
          env:
            # DCB を有効にする。無効だと接続が確立せず（実測は AXONIQ-1302）、
            # 業務サービスは起動を止めないまま無限再接続する（IT1 スパイク）。
            - { name: AXONIQ_AXONSERVER_STANDALONE_DCB, value: "true" }
            - { name: AXONIQ_AXONSERVER_DEVMODE_ENABLED, value: "true" }
          ports:
            - { name: http, containerPort: 8024 }
            - { name: grpc, containerPort: 8124 }
          volumeMounts:
            - { name: events, mountPath: /axonserver/events }
          # 起動を待つのは startupProbe に任せ、liveness は「上がったあとに死んだか」
          # だけを見る。liveness の initialDelaySeconds で起動を待たせると、
          # 機械が混んで起動が延びたときに**正常なコンテナが殺され続ける**
          # （実測: 60 秒では間に合わず exit 137 で再起動ループに入った）。
          startupProbe:
            httpGet: { path: /actuator/health, port: http }
            periodSeconds: 5
            # 5 秒 × 60 = 最大 5 分。Testcontainers 側の待ちも 3 分に取っている。
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /actuator/health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health, port: http }
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata: { name: events }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: axonserver
spec:
  selector: { app: axonserver }
  ports:
    - { name: http, port: 8024, targetPort: http }
    - { name: grpc, port: 8124, targetPort: grpc }
