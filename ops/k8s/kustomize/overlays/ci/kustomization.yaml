apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# E2E（CI）用の差分。base を共有し、CI 特有の設定だけをここに置く。
resources:
  - ../../base

patches:
  # CI では起動待ちの許容を広げる（ランナーのリソースが限られるため）
  - target:
      kind: Deployment
      labelSelector: ""
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
