apiVersion: v1
kind: Secret
metadata:
  name: cargo-secrets
  namespace: cargo
type: Opaque
stringData:
  # ローカル・CI 専用の値。実環境では Secret を別管理（SSM / Config Vars）に置き換える。
  DB_USERNAME: cargo_tracker
  DB_PASSWORD: cargo_tracker_local
  RABBITMQ_USERNAME: guest
  RABBITMQ_PASSWORD: guest
  JWT_SECRET: local-development-secret-key-please-override-in-every-real-environment
