apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookingms
  namespace: cargo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bookingms
  template:
    metadata:
      labels:
        app: bookingms
    spec:
      containers:
        - name: bookingms
          image: cargo-bookingms:0.0.1
          ports:
            - containerPort: 8082
          env:
            - name: PORT
              value: "8082"
            # シミュレーション由来として荷主を登録してよい利用者（[ADR-030] 決定 3）。
            # **要求本文だけを根拠にしない**——本文を信じると、営業が誤ってこの項目を
            # 送るだけで、その荷主の貨物が精算の締めに一生載らない。
            # 渡さない環境では、シミュレーションが荷主を作れずそこで止まる（安全側）
            - name: APP_SIMULATION_REGISTRAR_USERNAMES
              value: "sales01"
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/booking_db
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: { name: cargo-secrets, key: DB_USERNAME }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: cargo-secrets, key: DB_PASSWORD }
            # 経路の再照会先（ADR-019）。既定値は開発機を指すため、クラスタでは必ず上書きする。
            # 入れ忘れても起動は成功し、経路を確定する瞬間にだけ
            # 「いま経路を確認できません」に化ける（IT6 の kind 往復で実際に踏んだ）
            - name: APP_ROUTING_SERVICE_BASE_URL
              value: http://routingms:8083
            # 見積の概算料金を試算する先（[ADR-028] 決定 6・IT12）。**同じ形の欠陥を
            # 3 度目に踏んだ**——入れ忘れても起動は成功し、見積の候補を探す瞬間にだけ
            # 500 になる。実環境の往復を通すまで誰も気づかなかった
            - name: APP_BILLING_SERVICE_BASE_URL
              value: http://billingms:8086
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef: { name: cargo-secrets, key: RABBITMQ_USERNAME }
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef: { name: cargo-secrets, key: RABBITMQ_PASSWORD }
          # DB / ブローカーの起動待ちは readinessProbe の範囲で復帰させる（起動順序制御は作り込まない）
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          # 起動が終わるまで liveness を働かせない。10 サービスが一斉に立ち上がる環境では
          # Spring Boot の初期化が liveness の猶予を超え、正常に起動中のコンテナが
          # 殺されて再起動ループに入る（実際に発生した）。
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 10
            # 既定の 1 秒では、負荷のかかった作業機で JVM が応答しきれず、
            # 正常に起動しているコンテナが「起動できていない」と判定される
            timeoutSeconds: 5
            # 最大 10 分待つ。起動しないコンテナはここで初めて再起動される
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: bookingms
  namespace: cargo
spec:
  selector:
    app: bookingms
  ports:
    - port: 8082
      targetPort: 8082
