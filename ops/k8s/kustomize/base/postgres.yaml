apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: cargo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: cargo-secrets, key: DB_USERNAME }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: cargo-secrets, key: DB_PASSWORD }
            - name: POSTGRES_DB
              value: postgres
          volumeMounts:
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
          # exec probe の既定タイムアウトは 1 秒。初期化 SQL 実行中は応答が遅れるため明示する。
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "cargo_tracker"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "cargo_tracker"]
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: init-sql
          configMap:
            name: init-databases
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: cargo
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
