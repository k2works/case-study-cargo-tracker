apiVersion: apps/v1
kind: Deployment
metadata:
  name: billingms
  namespace: cargo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billingms
  template:
    metadata:
      labels:
        app: billingms
    spec:
      containers:
        - name: billingms
          image: cargo-billingms:0.0.1
          ports:
            - containerPort: 8086
          env:
            - name: PORT
              value: "8086"
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/billing_db
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: { name: cargo-secrets, key: DB_USERNAME }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: cargo-secrets, key: DB_PASSWORD }
            # 料金算出の入力を引く先（[ADR-027] 決定 7）。
            # **設定しないと料金の算出だけが必ず失敗する**——コードの既定値は
            # localhost を指しており、クラスタの中では自分自身を指すことになる
            # （IT5 で bookingms → routingms が同じ形の欠陥を出した）
            - name: APP_BOOKING_SERVICE_BASE_URL
              value: http://bookingms:8082
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef: { name: cargo-secrets, key: RABBITMQ_USERNAME }
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef: { name: cargo-secrets, key: RABBITMQ_PASSWORD }
          # DB / ブローカーの起動待ちは readinessProbe の範囲で復帰させる（起動順序制御は作り込まない）
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8086
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          # 起動が終わるまで liveness を働かせない。10 サービスが一斉に立ち上がる環境では
          # Spring Boot の初期化が liveness の猶予を超え、正常に起動中のコンテナが
          # 殺されて再起動ループに入る（実際に発生した）。
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8086
            periodSeconds: 10
            # 既定の 1 秒では、負荷のかかった作業機で JVM が応答しきれず、
            # 正常に起動しているコンテナが「起動できていない」と判定される
            timeoutSeconds: 5
            # 最大 10 分待つ。起動しないコンテナはここで初めて再起動される
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8086
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: billingms
  namespace: cargo
spec:
  selector:
    app: billingms
  ports:
    - port: 8086
      targetPort: 8086
