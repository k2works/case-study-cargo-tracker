apiVersion: apps/v1
kind: Deployment
metadata:
  name: www
  namespace: cargo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: www
  template:
    metadata:
      labels:
        app: www
    spec:
      containers:
        - name: www
          image: cargo-www:0.0.1
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /docs-portal/
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /docs-portal/
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: www
  namespace: cargo
spec:
  selector:
    app: www
  ports:
    - port: 80
      targetPort: 80
